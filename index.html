<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پایش حریق استان فارس</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Marker Cluster -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #b71c1c;
            color: white;
            text-align: center;
            padding: 18px;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 14px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            min-width: 150px;
            padding: 14px 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 7px rgba(0,0,0,.12);
        }

        .card h3 {
            margin: 0 0 8px;
            font-size: 13px;
            color: #555;
        }

        .card strong {
            font-size: 24px;
            color: #d32f2f;
        }

        #status {
            text-align: center;
            padding: 8px 10px 12px;
            color: #555;
        }

        #map {
            height: 620px;
            margin: 0 15px 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 7px rgba(0,0,0,.15);
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 13px;
            font-size: 12px;
        }

        .popup {
            direction: rtl;
            text-align: right;
            line-height: 1.9;
            min-width: 240px;
        }

        .popup h3 {
            margin: 0 0 8px;
            color: #b71c1c;
        }

        .boundary-label {
            background: white;
            border: 2px solid #d32f2f;
            color: #b71c1c;
            font-weight: bold;
            padding: 5px 9px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,.25);
        }

        @media (max-width: 700px) {

            header h1 {
                font-size: 19px;
            }

            #map {
                height: 500px;
                margin: 0 8px 10px;
            }

            .card {
                min-width: 130px;
                padding: 10px;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>🔥 سامانه پایش حریق استان فارس</h1>

    <p>
        پایش حریق با داده‌های NASA FIRMS
    </p>

</header>


<!-- =====================================================
     آمار
===================================================== -->

<div class="stats">

    <div class="card">
        <h3>کل حریق‌ها</h3>
        <strong id="fireCount">0</strong>
    </div>

    <div class="card">
        <h3>VIIRS</h3>
        <strong id="viirsCount">0</strong>
    </div>

    <div class="card">
        <h3>MODIS</h3>
        <strong id="modisCount">0</strong>
    </div>

    <div class="card">
        <h3>آخرین تاریخ</h3>
        <strong id="fireDate">---</strong>
    </div>

</div>


<div id="status">
    در حال دریافت داده‌های حریق...
</div>


<div id="map"></div>


<footer>
    NASA FIRMS | VIIRS | MODIS | FARS FIRE SENTINEL
</footer>


<!-- =====================================================
     Leaflet
===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- =====================================================
     Marker Cluster
===================================================== -->

<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>


<script>

/* =========================================================
   تنظیمات فایل‌ها
========================================================= */

const FIRE_FILE = "fires.csv";
const BOUNDARY_FILE = "geoBoundaries-IRN-ADM1.geojson";


/* =========================================================
   ایجاد نقشه
========================================================= */

const map = L.map("map");

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 18,
        attribution: "© OpenStreetMap contributors"
    }
).addTo(map);


/* =========================================================
   مرکز اولیه فارس
========================================================= */

map.setView(
    [29.6, 52.5],
    8
);


/* =========================================================
   لایه حریق
========================================================= */

const fireLayer =
    L.markerClusterGroup({
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
        disableClusteringAtZoom: 12,
        maxClusterRadius: 30
    });

map.addLayer(fireLayer);


/* =========================================================
   لایه مرز فارس
========================================================= */

let farsBoundaryLayer = null;


/* =========================================================
   وضعیت
========================================================= */

function setStatus(text) {

    document.getElementById(
        "status"
    ).innerText = text;

}


/* =========================================================
   خواندن CSV
========================================================= */

function parseCSV(text) {

    text = text
        .replace(/^\uFEFF/, "")
        .trim();

    if (!text) {
        return [];
    }

    const lines =
        text.split(/\r?\n/);

    if (lines.length < 2) {
        return [];
    }

    const headers =
        lines[0]
            .split(",")
            .map(function(header) {

                return header
                    .trim()
                    .toLowerCase();

            });

    const data = [];

    for (
        let i = 1;
        i < lines.length;
        i++
    ) {

        if (!lines[i].trim()) {
            continue;
        }

        const values =
            lines[i].split(",");

        const row = {};

        for (
            let j = 0;
            j < headers.length;
            j++
        ) {

            row[headers[j]] =
                values[j] !== undefined
                ? values[j].trim()
                : "";

        }

        data.push(row);
    }

    return data;
}


/* =========================================================
   نمایش مرز استان فارس
========================================================= */

function loadFarsBoundary() {

    setStatus(
        "در حال دریافت مرز استان فارس..."
    );

    return fetch(
        BOUNDARY_FILE + "?v=" + Date.now()
    )

    .then(function(response) {

        if (!response.ok) {

            throw new Error(
                "فایل GeoJSON مرز پیدا نشد."
            );
        }

        return response.json();
    })

    .then(function(data) {

        if (
            data.type !==
            "FeatureCollection"
        ) {

            throw new Error(
                "ساختار GeoJSON معتبر نیست."
            );
        }

        if (
            !Array.isArray(data.features) ||
            data.features.length === 0
        ) {

            throw new Error(
                "هیچ استان در GeoJSON پیدا نشد."
            );
        }


        /* =============================================
           پیدا کردن فارس
        ============================================= */

        let fars = null;

        data.features.forEach(
            function(feature) {

                const properties =
                    feature.properties || {};

                const name =
                    String(
                        properties.shapeName ||
                        ""
                    )
                    .trim()
                    .toLowerCase();

                if (
                    name === "fars"
                ) {

                    fars = feature;

                }

            }
        );


        if (!fars) {

            throw new Error(
                "استان Fars در GeoJSON پیدا نشد."
            );

        }


        console.log(
            "Fars boundary found:",
            fars
        );


        /* =============================================
           حذف مرز قبلی
        ============================================= */

        if (
            farsBoundaryLayer
        ) {

            map.removeLayer(
                farsBoundaryLayer
            );

        }


        /* =============================================
           رسم مرز
        ============================================= */

        farsBoundaryLayer =
            L.geoJSON(
                fars,
                {

                    style: {

                        color: "#e00000",

                        weight: 4,

                        opacity: 1,

                        fillColor: "#ff0000",

                        fillOpacity: 0.05

                    }

                }
            ).addTo(map);


        /* =============================================
           زوم روی فارس
        ============================================= */

        const boundaryBounds =
            farsBoundaryLayer.getBounds();


        if (
            boundaryBounds.isValid()
        ) {

            map.fitBounds(
                boundaryBounds,
                {
                    padding: [
                        20,
                        20
                    ]
                }
            );

        }


        /* =============================================
           برچسب فارس
        ============================================= */

        const center =
            boundaryBounds.getCenter();


        L.marker(
            center,
            {
                icon:
                    L.divIcon({
                        className:
                            "boundary-label",

                        html:
                            "استان فارس",

                        iconSize:
                            [80, 28],

                        iconAnchor:
                            [40, 14]
                    })
            }
        ).addTo(map);


        return fars;

    });

}


/* =========================================================
   دریافت داده‌های حریق
========================================================= */

function loadFireData() {

    return fetch(
        FIRE_FILE +
        "?v=" +
        Date.now()
    )

    .then(function(response) {

        if (!response.ok) {

            throw new Error(
                "fires.csv پیدا نشد."
            );

        }

        return response.text();

    })

    .then(function(csvText) {

        console.log(
            "CSV:",
            csvText
        );

        const fires =
            parseCSV(
                csvText
            );

        console.log(
            "Parsed fires:",
            fires
        );

        if (
            fires.length === 0
        ) {

            throw new Error(
                "هیچ رکوردی در fires.csv پیدا نشد."
            );

        }

        return fires;

    });

}


/* =========================================================
   نمایش حریق‌ها
========================================================= */

function displayFires(fires) {

    fireLayer.clearLayers();

    let viirs = 0;
    let modis = 0;
    let latestDate = "---";


    fires.forEach(
        function(fire) {

            const lat =
                parseFloat(
                    fire.latitude
                );

            const lon =
                parseFloat(
                    fire.longitude
                );


            if (
                isNaN(lat) ||
                isNaN(lon)
            ) {

                return;

            }


            const sensor =
                String(
                    fire.detected_sensor ||
                    fire.instrument ||
                    ""
                )
                .trim()
                .toUpperCase();


            if (
                sensor === "VIIRS"
            ) {

                viirs++;

            }


            if (
                sensor === "MODIS"
            ) {

                modis++;

            }


            if (
                fire.acq_date &&
                (
                    latestDate === "---" ||
                    fire.acq_date >
                    latestDate
                )
            ) {

                latestDate =
                    fire.acq_date;

            }


            /* =========================================
               رنگ نقطه
            ========================================= */

            let fillColor =
                "#8e24aa";


            if (
                sensor === "VIIRS"
            ) {

                fillColor =
                    "#ff1744";

            }


            if (
                sensor === "MODIS"
            ) {

                fillColor =
                    "#ff9800";

            }


            /* =========================================
               Marker
            ========================================= */

            const marker =
                L.circleMarker(
                    [lat, lon],
                    {

                        radius: 9,

                        color: "#700000",

                        fillColor:
                            fillColor,

                        fillOpacity: 0.95,

                        weight: 2

                    }
                );


            /* =========================================
               Popup
            ========================================= */

            const popup =

                "<div class='popup'>" +

                "<h3>🔥 حریق استان فارس</h3>" +

                "<b>سنجنده:</b> " +
                (
                    fire.detected_sensor ||
                    "---"
                ) +

                "<br>" +

                "<b>ماهواره:</b> " +
                (
                    fire.satellite ||
                    "---"
                ) +

                "<br>" +

                "<b>تاریخ:</b> " +
                (
                    fire.acq_date ||
                    "---"
                ) +

                "<br>" +

                "<b>ساعت:</b> " +
                (
                    fire.acq_time ||
                    "---"
                ) +

                "<br>" +

                "<b>FRP:</b> " +
                (
                    fire.frp ||
                    "---"
                ) +
                " MW" +

                "<br>" +

                "<b>Confidence:</b> " +
                (
                    fire.confidence ||
                    "---"
                ) +

                "<br>" +

                "<b>Brightness:</b> " +
                (
                    fire.brightness ||
                    "---"
                ) +

                "<br>" +

                "<b>Day/Night:</b> " +
                (
                    fire.daynight ||
                    "---"
                ) +

                "<br>" +

                "<b>مختصات:</b> " +
                lat.toFixed(5) +
                " , " +
                lon.toFixed(5) +

                "</div>";


            marker.bindPopup(
                popup
            );


            fireLayer.addLayer(
                marker
            );

        }
    );


    /* =====================================================
       آمار
    ===================================================== */

    document.getElementById(
        "fireCount"
    ).innerText =
        fires.length;


    document.getElementById(
        "viirsCount"
    ).innerText =
        viirs;


    document.getElementById(
        "modisCount"
    ).innerText =
        modis;


    document.getElementById(
        "fireDate"
    ).innerText =
        latestDate;


    /* =====================================================
       زوم روی حریق
    ===================================================== */

    const fireMarkers =
        fireLayer.getLayers();


    if (
        fireMarkers.length > 0
    ) {

        const fireBounds =
            L.featureGroup(
                fireMarkers
            ).getBounds();


        if (
            fireBounds.isValid()
        ) {

            /*
             * فقط در صورتی روی حریق زوم می‌کنیم
             * که مرز فارس قبلاً موجود نباشد.
             */

            if (
                !farsBoundaryLayer
            ) {

                map.fitBounds(
                    fireBounds,
                    {
                        padding: [
                            40,
                            40
                        ]
                    }
                );

            }

        }

    }

}


/* =========================================================
   شروع برنامه
========================================================= */

Promise.all([
    loadFarsBoundary(),
    loadFireData()
])

.then(function(results) {

    const fires =
        results[1];

    displayFires(
        fires
    );


    setStatus(
        fires.length +
        " حریق از NASA FIRMS دریافت شد."
    );

})

.catch(function(error) {

    console.error(
        "FARS FIRE SENTINEL ERROR:",
        error
    );


    setStatus(
        "خطا: " +
        error.message
    );

});

</script>

</body>
</html>
