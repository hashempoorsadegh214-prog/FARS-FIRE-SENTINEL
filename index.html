<title>

<style>

:root{
    --red:#b71c1c;
    --red-dark:#720000;
    --panel:rgba(255,255,255,.97);
    --border:#d8dee3;
    --text:#263238;
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    font-family:
        "B Nazanin",
        "BNazanin",
        Tahoma,
        Arial,
        sans-serif;
    background:#eef2f5;
    color:var(--text);
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:relative;
    z-index:5000;
    height:70px;
    background:
        linear-gradient(
            135deg,
            #720000 0%,
            #c91414 45%,
            #8f0000 75%,
            #e01b1b 100%
        );
    box-shadow:
        0 2px 12px rgba(80,0,0,.35);
}

.header-logo{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    width:68px;
    height:68px;
    object-fit:contain;
    filter:
        brightness(0)
        invert(1);
}

.header-content{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 150px 0 120px;
    text-align:center;
}

.title h1{
    margin:0;
    font-family:
        "B Titr",
        "BTitr",
        Tahoma,
        Arial,
        sans-serif;
    font-size:23px;
    line-height:1.2;
    color:#fff;
}

.title p{
    margin:3px 0 0;
    font-size:12px;
    color:rgba(255,255,255,.94);
}

.header-buttons{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    gap:4px;
}

.header-btn{
    width:34px;
    height:34px;
    border:0;
    border-radius:8px;
    background:rgba(255,255,255,.18);
    color:#fff;
    cursor:pointer;
    font-size:16px;
}

.header-btn:hover{
    background:rgba(255,255,255,.30);
}

/* =========================================================
   MAP
========================================================= */

#map{
    position:absolute;
    top:80px;
    left:8px;
    right:8px;
    bottom:8px;
    border:1px solid #d7dde1;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 16px rgba(0,0,0,.12);
}

/* =========================================================
   CONTROL PANEL
========================================================= */

.control-panel{
    position:absolute;
    top:92px;
    right:18px;
    width:230px;
    z-index:4000;
    padding:7px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel);
    box-shadow:0 4px 14px rgba(0,0,0,.16);
}

.control-panel *,
.update-box *,
.slider-box *{
    font-family:
        "B Nazanin",
        "BNazanin",
        Tahoma,
        Arial,
        sans-serif !important;
}

/* =========================================================
   FIRE COUNT
========================================================= */

.fire-count{
    margin-bottom:6px;
    padding:6px;
    text-align:center;
    border:1px solid #d9aaaa;
    border-radius:8px;
    background:#fff4f4;
    color:var(--red-dark);
    font-size:16px;
    font-weight:bold;
    line-height:1.2;
}

.fire-count-number{
    font-size:22px;
    color:var(--red);
}

/* =========================================================
   MODE BUTTONS
========================================================= */

.mode-btn{
    width:100%;
    margin-bottom:5px;
    padding:6px 8px;
    border:0;
    border-radius:8px;
    background:#f0f2f4;
    color:#344047;
    font-size:15px;
    font-weight:bold;
    text-align:right;
    cursor:pointer;
}

.mode-btn.active{
    background:
        linear-gradient(
            135deg,
            #720000,
            #d41414 55%,
            #980000
        );
    color:#fff;
    box-shadow:0 2px 8px rgba(114,0,0,.35);
}

/* =========================================================
   AREA FILTER
========================================================= */

.area-box{
    margin-top:5px;
    padding-top:6px;
    border-top:1px solid #e6eaed;
}

.area-title{
    margin-bottom:4px;
    font-size:14px;
    font-weight:bold;
}

.area-option{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:4px;
    padding:5px 7px;
    border-radius:7px;
    background:#f6f7f8;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.area-option input{
    width:14px;
    height:14px;
    margin:0;
}

/* =========================================================
   SENSOR
========================================================= */

.sensor-box{
    position:absolute;
    top:92px;
    left:50%;
    transform:translateX(-50%);
    z-index:4000;
    display:flex;
    align-items:center;
    gap:12px;
    padding:5px 10px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel);
    box-shadow:0 4px 12px rgba(0,0,0,.14);
    font-size:14px;
    white-space:nowrap;
}

.sensor-item{
    display:flex;
    align-items:center;
    gap:5px;
}

.sensor-dot{
    width:9px;
    height:9px;
    border-radius:50%;
}

/* =========================================================
   STATUS
========================================================= */

.update-box{
    position:absolute;
    right:9px;
    bottom:9px;
    z-index:4000;
    display:flex;
    align-items:center;
    justify-content:center;
    width:max-content;
    max-width:calc(100vw - 18px);
    padding:6px 12px;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--panel);
    box-shadow:0 4px 14px rgba(0,0,0,.16);
    white-space:nowrap;
    font-size:14px;
    font-weight:bold;
    direction:rtl;
}

.update-row{
    display:inline;
    color:var(--red-dark);
}

.update-row + .update-row::before{
    content:"  │  ";
    color:#8b949a;
}

/* =========================================================
   SLIDER
========================================================= */

.slider-box{
    position:absolute;
    left:18px;
    bottom:14px;
    width:350px;
    z-index:4000;
    padding:7px 12px;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--panel);
    box-shadow:0 4px 14px rgba(0,0,0,.16);
}

.slider-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:4px;
}

.slider-title{
    font-size:16px;
    font-weight:bold;
}

.slider-date{
    font-size:15px;
    font-weight:bold;
    color:var(--red-dark);
}

.slider-count{
    font-size:14px;
    color:#546e7a;
}

#archiveSlider{

/* =========================================================

========================================================= */

.fire-popup{

}

.fire-popup h3{
    margin:0 0 6px;

    font-size:15px;
}

.fire-popup .row{
    padding:2px 0;
    border-bottom:1px solid #edf0f2;
}

.fire-popup .label{
    font-weight:bold;
}

.area-name{
    color:#1565c0;
    font-weight:bold;
}

/* =========================================================
   NIGHT
========================================================= */

body.night{
    background:#121820;
}

body.night .control-panel,
body.night .sensor-box,
body.night .update-box,
body.night .slider-box{
    background:rgba(26,32,40,.97);
    border-color:#3a4650;
    color:#e8edf1;
}

body.night .mode-btn{

    color:#dbe3e8;
}

body.night .mode-btn.active{
    background:

            #d41414 55%,
            #980000

body.night .area-option{
    background:#252d36;
    color:#dbe3e8;
}

body.night .fire-count{
    background:#301e1e;
    border-color:#694141;
    color:#ffd6d6;
}

body.night .fire-count-number{

body.night .leaflet-tile-pane{

body.night .leaflet-container{

}

body.night .leaflet-control-zoom a{
    background:#1e252d;
    color:#e6e6e6;
    border-color:#333;
}

body.night .leaflet-control-attribution{

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

        right:5px;
        bottom:5px;
        width:auto;
        font-size:9px;
        overflow:hidden;
    }
}

</style>

<script>

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    boundary:
        "fars.geojson",

    protected:
        "protected_areas.geojson",

    hunting:
        "hunting_banned.geojson",

    archiveIndex:
        "archive/index.json",

    fallbackCsv:
        "fires.csv",

    updateInfo:
        "update-info.json"

};


/* =========================================================
   STATE
========================================================= */

const state = {

    map:null,

    lightMap:null,

    darkMap:null,

    boundaryLayer:null,

    protectedLayer:null,

    huntingLayer:null,

    fireLayer:null,

    protectedGeoJSON:null,

    huntingGeoJSON:null,

    /*
       آرشیوهای واقعی گذشته
    */
    fires:[],

    /*
       داده جاری fires.csv
    */
    currentFires:[],

    /*
       تاریخ‌های قابل انتخاب در اسلایدر.
       شامل آرشیوهای دارای رکورد + روز جاری در صورت وجود رکورد
    */
    archiveDates:[],

    archiveHeaders:[],

    mode:"24h",

    areaFilter:"none",

    systemTimestamp:null,

    currentArchiveDate:null

};


/* =========================================================
   HELPERS
========================================================= */

const $ =
    id =>
        document.getElementById(id);


async function getText(url){

    const response =
        await fetch(

            url +
            "?v=" +
            Date.now(),

            {
                cache:"no-store"
            }

        );

    if(!response.ok){

        throw new Error(
            "خطا در دریافت فایل: " +
            url
        );

    }

    return response.text();

}


function fa(value){

    return String(value)

        .replace(/0/g,"۰")
        .replace(/1/g,"۱")
        .replace(/2/g,"۲")
        .replace(/3/g,"۳")
        .replace(/4/g,"۴")
        .replace(/5/g,"۵")
        .replace(/6/g,"۶")
        .replace(/7/g,"۷")
        .replace(/8/g,"۸")
        .replace(/9/g,"۹");

}


/* =========================================================
   CSV
========================================================= */

function parseCSV(text){

    text =
        text
            .replace(/^\uFEFF/,"")
            .trim();

    if(!text){

        return {
            headers:[],
            rows:[]
        };

    }

    const lines =
        text.split(/\r?\n/);

    const headers =
        lines[0]
            .split(",")
            .map(
                h =>
                    h
                        .trim()
                        .toLowerCase()
            );

    const rows=[];

    for(
        let i=1;
        i<lines.length;
        i++
    ){

        if(!lines[i].trim()){
            continue;
        }

        const values =
            lines[i].split(",");

        const row={};

        headers.forEach(
            (header,index)=>{

                row[header] =
                    values[index] !== undefined
                    ?
                    values[index].trim()
                    :
                    "";

            }
        );

        rows.push(row);

    }

    return {
        headers,
        rows
    };

}


/* =========================================================
   JALALI
========================================================= */

function gregorianToJalali(gy,gm,gd){

    const gdm=[
        0,
        31,
        59,
        90,
        120,
        151,
        181,
        212,
        243,
        273,
        304,
        334
    ];

    let jy;

    if(gy>1600){

        jy=979;
        gy-=1600;

    }else{

        jy=0;
        gy-=621;

    }

    const gy2 =
        gm>2
        ?
        gy+1
        :
        gy;

    let days =

        365*gy

        +

        Math.floor(
            (gy2+3)/4
        )

        -

        Math.floor(
            (gy2+99)/100
        )

        +

        Math.floor(
            (gy2+399)/400
        )

        -

        80

        +

        gd

        +

        gdm[gm-1];

    jy +=
        33*
        Math.floor(
            days/12053
        );

    days%=12053;

    jy +=
        4*
        Math.floor(
            days/1461
        );

    days%=1461;

    if(days>365){

        jy +=
            Math.floor(
                (days-1)/365
            );

        days =
            (days-1)%365;

    }

    let jm;
    let jd;

    if(days<186){

        jm =
            1+
            Math.floor(
                days/31
            );

        jd =
            1+
            days%31;

    }else{

        jm =
            7+
            Math.floor(
                (days-186)/30
            );

        jd =
            1+
            (days-186)%30;

    }

    return [
        jy,
        jm,
        jd
    ];

}


function shamsiDate(date){

    if(!date){
        return "---";
    }

    const parts =
        String(date).split("-");

    if(parts.length!==3){
        return date;
    }

    const j =
        gregorianToJalali(
            Number(parts[0]),
            Number(parts[1]),
            Number(parts[2])
        );

    const months=[
        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند"
    ];

    return (
        fa(j[2]) +
        " " +
        months[j[1]-1] +
        " " +
        fa(j[0])
    );

}


/* =========================================================
   TIME
========================================================= */

function fireUTCDateTime(fire){

    if(
        !fire.acq_date ||
        !fire.acq_time
    ){

        return null;

    }

    const date =
        fire.acq_date.split("-");

    const time =
        String(fire.acq_time)
            .replace(/\D/g,"")
            .padStart(4,"0");

    return new Date(
