/* =========================================================
   توابع کمکی
========================================================= */

function toPersianDigits(
    value
) {

    return String(value)

        .replace(
            /0/g,
            "۰"
        )

        .replace(
            /1/g,
            "۱"
        )

        .replace(
            /2/g,
            "۲"
        )

        .replace(
            /3/g,
            "۳"
        )

        .replace(
            /4/g,
            "۴"
        )

        .replace(
            /5/g,
            "۵"
        )

        .replace(
            /6/g,
            "۶"
        )

        .replace(
            /7/g,
            "۷"
        )

        .replace(
            /8/g,
            "۸"
        )

        .replace(
            /9/g,
            "۹"
        );
}


/* =========================================================
   میلادی → شمسی
========================================================= */

function gregorianToJalali(
    gy,
    gm,
    gd
) {

    const gdm = [
        0,
        31,
        59,
        90,
        120,
        151,
        181,
        212,
        243,
        273,
        304,
        334
    ];


    let jy;


    if (
        gy > 1600
    ) {

        jy = 979;

        gy -= 1600;

    }

    else {

        jy = 0;

        gy -= 621;

    }


    const gy2 =
        gm > 2
        ? gy + 1
        : gy;


    let days =
        365 * gy
        +
        Math.floor(
            (gy2 + 3) / 4
        )
        -
        Math.floor(
            (gy2 + 99) / 100
        )
        +
        Math.floor(
            (gy2 + 399) / 400
        )
        -
        80
        +
        gd
        +
        gdm[gm - 1];


    jy +=
        33 *
        Math.floor(
            days / 12053
        );


    days %= 12053;


    jy +=
        4 *
        Math.floor(
            days / 1461
        );


    days %= 1461;


    if (
        days > 365
    ) {

        jy +=
            Math.floor(
                (days - 1) / 365
            );


        days =
            (days - 1) % 365;

    }


    let jm;
    let jd;


    if (
        days < 186
    ) {

        jm =
            1 +
            Math.floor(
                days / 31
            );


        jd =
            1 +
            days % 31;

    }

    else {

        jm =
            7 +
            Math.floor(
                (days - 186) / 30
            );


        jd =
            1 +
            (
                (days - 186) % 30
            );

    }


    return [
        jy,
        jm,
        jd
    ];
}


/* =========================================================
   فرمت شمسی
========================================================= */

function formatJalaliDate(
    dateString
) {

    if (
        !dateString ||
        dateString === "---"
    ) {

        return "---";
    }


    const parts =
        String(
            dateString
        )
        .split("-");


    if (
        parts.length !== 3
    ) {

        return dateString;

    }


    const gy =
        parseInt(
            parts[0],
            10
        );


    const gm =
        parseInt(
            parts[1],
            10
        );


    const gd =
        parseInt(
            parts[2],
            10
        );


    if (
        isNaN(gy) ||
        isNaN(gm) ||
        isNaN(gd)
    ) {

        return dateString;

    }


    const j =
        gregorianToJalali(
            gy,
            gm,
            gd
        );


    return toPersianDigits(
        j[0] +
        "/" +
        String(
            j[1]
        ).padStart(
            2,
            "0"
        ) +
        "/" +
        String(
            j[2]
        ).padStart(
            2,
            "0"
        )
    );
}


/* =========================================================
   نام ماه
========================================================= */

function getJalaliMonth(
    month
) {

    const months = [

        "فروردین",

        "اردیبهشت",

        "خرداد",

        "تیر",

        "مرداد",

        "شهریور",

        "مهر",

        "آبان",

        "آذر",

        "دی",

        "بهمن",

        "اسفند"
    ];


    return months[
        month - 1
    ] || "";
}


/* =========================================================
   تاریخ کامل فارسی
========================================================= */

function formatFullJalaliDate(
    dateString
) {

    if (
        !dateString
    ) {

        return "---";
    }


    const parts =
        dateString.split("-");


    if (
        parts.length !== 3
    ) {

        return dateString;
    }


    const j =
        gregorianToJalali(

            parseInt(
                parts[0],
                10
            ),

            parseInt(
                parts[1],
                10
            ),

            parseInt(
                parts[2],
                10
            )
        );


    return (

        toPersianDigits(
            j[2]
        )

        +
        " "

        +
        getJalaliMonth(
            j[1]
        )

        +
        " "

        +
        toPersianDigits(
            j[0]
        )

    );
}


/* =========================================================
   تبدیل ساعت FIRMS از UTC به ایران
========================================================= */

function formatIranTime(
    acqTime,
    acqDate
) {

    if (
        acqTime === null ||
        acqTime === undefined ||
        acqTime === ""
    ) {

        return "---";
    }


    let timeText =
        String(acqTime)
        .trim();


    timeText =
        timeText.replace(
            /\D/g,
            ""
        );


    timeText =
        timeText.padStart(
            4,
            "0"
        );


    let hour =
        parseInt(
            timeText.substring(
                0,
                2
            ),
            10
        );


    let minute =
        parseInt(
            timeText.substring(
                2,
                4
            ),
            10
        );


    if (
        isNaN(hour) ||
        isNaN(minute)
    ) {

        return "---";
    }


    /*
       FIRMS = UTC
       ایران = UTC + 3:30
    */

    let totalMinutes =
        hour * 60 +
        minute +
        210;


    let dayOffset =
        Math.floor(
            totalMinutes / 1440
        );


    totalMinutes =
        totalMinutes % 1440;


    const iranHour =
        Math.floor(
            totalMinutes / 60
        );


    const iranMinute =
        totalMinutes % 60;


    const timeString =

        String(
            iranHour
        ).padStart(
            2,
            "0"
        )

        +

        ":"

        +

        String(
            iranMinute
        ).padStart(
            2,
            "0"
        );


    return {
        time: toPersianDigits(
            timeString
        ),
        dayOffset: dayOffset
    };
}


/* =========================================================
   CSV Parser
========================================================= */

function parseCSV(
    text
) {

    text =
        text
        .replace(
            /^\uFEFF/,
            ""
        )
        .trim();


    if (
        !text
    ) {

        return [];
    }


    const lines =
        text.split(
            /\r?\n/
        );


    if (
        lines.length < 2
    ) {

        return [];
    }


    const headers =
        lines[0]
        .split(",")
        .map(
            function(h) {

                return h
                    .trim()
                    .toLowerCase();

            }
        );


    const result = [];


    for (
        let i = 1;
        i < lines.length;
        i++
    ) {

        if (
            !lines[i].trim()
        ) {

            continue;
        }


        const values =
            lines[i].split(",");


        const row = {};


        for (
            let j = 0;
            j < headers.length;
            j++
        ) {

            row[
                headers[j]
            ] =
                values[j] !== undefined
                ? values[j].trim()
                : "";

        }


        result.push(
            row
        );
    }


    return result;
}


/* =========================================================
   مرز فارس
========================================================= */

function loadBoundary() {

    return fetch(
        BOUNDARY_FILE +
        "?v=" +
        Date.now()
    )

    .then(
        function(response) {

            if (
                !response.ok
            ) {

                throw new Error(
                    "فایل مرز فارس پیدا نشد."
                );
            }


            return response.json();
        }
    )

    .then(
        function(data) {

            let fars =
                null;


            data.features.forEach(
                function(feature) {

                    const properties =
                        feature.properties ||
                        {};


                    const name =
                        String(
                            properties.shapeName ||
                            ""
                        )
                        .trim()
                        .toLowerCase();


                    if (
                        name === "fars"
                    ) {

                        fars =
                            feature;

                    }
                }
            );


            if (
                !fars
            ) {

                throw new Error(
                    "استان فارس در GeoJSON پیدا نشد."
                );
            }


            if (
                farsBoundaryLayer
            ) {

                map.removeLayer(
                    farsBoundaryLayer
                );
            }


            farsBoundaryLayer =
                L.geoJSON(
                    fars,
                    {

                        style: {

                            color:
                                "#ff0000",

                            weight:
                                4,

                            opacity:
                                1,

                            fillColor:
                                "#ff0000",

                            fillOpacity:
                                0.04
                        }

                    }
                ).addTo(
                    map
                );


            const bounds =
                farsBoundaryLayer.getBounds();


            if (
                bounds.isValid()
            ) {

                map.fitBounds(
                    bounds,
                    {
                        padding:
                            [20,20]
                    }
                );
            }


            return fars;
        }
    );
}


/* =========================================================
   دریافت CSV
========================================================= */

function loadCSV(
    url
) {

    return fetch(
        url +
        (
            url.includes("?")
            ? "&"
            : "?"
        ) +
        "v=" +
        Date.now()
    )

    .then(
        function(response) {

            if (
                !response.ok
            ) {

                throw new Error(
                    "فایل داده پیدا نشد."
                );
            }


            return response.text();
        }
    )

    .then(
        function(text) {

            return parseCSV(
                text
            );
        }
    );
}


/* =========================================================
   Popup
========================================================= */

function createPopup(
    fire
) {

    const iranTime =
        formatIranTime(
            fire.acq_time,
            fire.acq_date
        );


    let localDate =
        formatFullJalaliDate(
            fire.acq_date
        );


    /*
       اگر تبدیل UTC به ایران از نیمه شب عبور کرد،
       تاریخ نمایش را یک روز جلو می‌بریم.
    */

    if (
        iranTime.dayOffset === 1
    ) {

        localDate =
            addOneDayJalali(
                fire.acq_date
            );
    }


    return (

        "<div class='popup'>" +

        "<h3>🔥 حریق استان فارس</h3>" +

        "<b>سنجنده:</b> " +
        (
            fire.detected_sensor ||
            "---"
        ) +

        "<br>" +

        "<b>ماهواره:</b> " +
        (
            fire.satellite ||
            "---"
        ) +

        "<br>" +

        "<b>تاریخ ایران:</b> " +
        localDate +

        "<br>" +

        "<b>تاریخ UTC:</b> " +
        (
            fire.acq_date ||
            "---"
        ) +

        "<br>" +

        "<b>ساعت ایران:</b> " +
        iranTime.time +

        "<br>" +

        "<b>ساعت UTC:</b> " +
        formatUTCtime(
            fire.acq_time
        ) +

        "<br>" +

        "<b>FRP:</b> " +
        (
            fire.frp ||
            "---"
        ) +
        " MW" +

        "<br>" +

        "<b>Confidence:</b> " +
        (
            fire.confidence ||
            "---"
        ) +

        "<br>" +

        "<b>Brightness:</b> " +
        (
            fire.brightness ||
            "---"
        ) +

        "<br>" +

        "<b>روز/شب:</b> " +
        (
            fire.daynight ||
            "---"
        ) +

        "<br>" +

        "<b>مختصات:</b> " +
        parseFloat(
            fire.latitude
        ).toFixed(5) +

        " , " +

        parseFloat(
            fire.longitude
        ).toFixed(5) +

        "</div>"
    );
}


/* =========================================================
   ساعت UTC
========================================================= */

function formatUTCtime(
    value
) {

    if (
        !value
    ) {

        return "---";
    }


    let text =
        String(value)
        .replace(
            /\D/g,
            ""
        )
        .padStart(
            4,
            "0"
        );


    return toPersianDigits(
        text.substring(
            0,
            2
        ) +
        ":" +
        text.substring(
            2,
            4
        )
    );
}


/* =========================================================
   یک روز به تاریخ اضافه کن
========================================================= */

function addOneDayJalali(
    dateString
) {

    const parts =
        dateString.split("-");


    const date =
        new Date(
            Date.UTC(
                parseInt(
                    parts[0],
                    10
                ),

                parseInt(
                    parts[1],
                    10
                ) - 1,

                parseInt(
                    parts[2],
                    10
                )
            )
        );


    date.setUTCDate(
        date.getUTCDate() + 1
    );


    const gy =
        date.getUTCFullYear();


    const gm =
        date.getUTCMonth() + 1;


    const gd =
        date.getUTCDate();


    const j =
        gregorianToJalali(
            gy,
            gm,
            gd
        );


    return (
        toPersianDigits(
            j[2]
        )
        +
        " "
        +
        getJalaliMonth(
            j[1]
        )
        +
        " "
        +
        toPersianDigits(
            j[0]
        )
    );
}


/* =========================================================
   نمایش حریق
========================================================= */

function displayFires(
    fires
) {

    fireLayer.clearLayers();


    let viirs =
        0;

    let modis =
        0;


    let latestDate =
        "---";


    fires.forEach(
        function(fire) {

            const lat =
                parseFloat(
                    fire.latitude
                );


            const lon =
                parseFloat(
                    fire.longitude
                );


            if (
                isNaN(lat) ||
                isNaN(lon)
            ) {

                return;
            }


            const sensor =
                String(
                    fire.detected_sensor ||
                    fire.instrument ||
                    ""
                )
                .trim()
                .toUpperCase();


            if (
                sensor === "VIIRS"
            ) {

                viirs++;
            }


            if (
                sensor === "MODIS"
            ) {

                modis++;
            }


            if (
                fire.acq_date &&
                (
                    latestDate === "---" ||
                    fire.acq_date >
                    latestDate
                )
            ) {

                latestDate =
                    fire.acq_date;
            }


            let fillColor =
                "#8e24aa";


            if (
                sensor === "VIIRS"
            ) {

                fillColor =
                    "#ff1744";
            }


            if (
                sensor === "MODIS"
            ) {

                fillColor =
                    "#ff9800";
            }


            const marker =
                L.circleMarker(
                    [
                        lat,
                        lon
                    ],
                    {

                        radius:
                            9,

                        color:
                            "#700000",

                        fillColor:
                            fillColor,

                        fillOpacity:
                            0.95,

                        weight:
                            2
                    }
                );


            marker.bindPopup(
                createPopup(
                    fire
                )
            );


            fireLayer.addLayer(
                marker
            );

        }
    );


    document.getElementById(
        "fireCount"
    ).innerText =
        toPersianDigits(
            fires.length
        );


    document.getElementById(
        "viirsCount"
    ).innerText =
        toPersianDigits(
            viirs
        );


    document.getElementById(
        "modisCount"
    ).innerText =
        toPersianDigits(
            modis
        );


    document.getElementById(
        "fireDate"
    ).innerText =
        formatJalaliDate(
            latestDate
        );


    document.getElementById(
        "archiveCount"
    ).innerText =
        toPersianDigits(
            fires.length
        ) +
        " حریق";


    const layers =
        fireLayer.getLayers();


    if (
        layers.length > 0
    ) {

        const bounds =
            L.featureGroup(
                layers
            ).getBounds();


        if (
            bounds.isValid()
        ) {

            map.fitBounds(
                bounds,
                {
                    padding:
                        [30,30]
                }
            );
        }
    }
}


/* =========================================================
   بارگذاری آرشیو
========================================================= */

function loadArchiveIndex() {

    return fetch(
        ARCHIVE_INDEX +
        "?v=" +
        Date.now()
    )

    .then(
        function(response) {

            if (
                !response.ok
            ) {

                throw new Error(
                    "آرشیو پیدا نشد."
                );
            }


            return response.json();
        }
    )

    .then(
        function(index) {

            /*
               قدیمی → جدید
            */

            archiveDates =
                index
                .map(
                    function(item) {
                        return item.date;
                    }
                )
                .sort();


            const slider =
                document.getElementById(
                    "archiveSlider"
                );


            slider.min =
                0;


            slider.max =
                Math.max(
                    0,
                    archiveDates.length - 1
                );


            selectedArchiveIndex =
                archiveDates.length - 1;


            slider.value =
                selectedArchiveIndex;


            updateArchiveLabel();


            return archiveDates;
        }
    );
}


/* =========================================================
   برچسب اسلایدر
========================================================= */

function updateArchiveLabel() {

    if (
        archiveDates.length === 0
    ) {

        document.getElementById(
            "dateLabel"
        ).innerText =
            "---";

        return;
    }


    const date =
        archiveDates[
            selectedArchiveIndex
        ];


    document.getElementById(
        "dateLabel"
    ).innerText =
        formatFullJalaliDate(
            date
        );
}


/* =========================================================
   بارگذاری روز انتخاب‌شده
========================================================= */

function loadSelectedArchive() {

    if (
        archiveDates.length === 0
    ) {

        return;
    }


    const date =
        archiveDates[
            selectedArchiveIndex
        ];


    updateArchiveLabel();


    setStatus(
        "در حال دریافت آرشیو " +
        formatFullJalaliDate(
            date
        ) +
        "..."
    );


    const url =
        "archive/" +
        date +
        ".csv";


    loadCSV(
        url
    )

    .then(
        function(fires) {

            displayFires(
                fires
            );


            setStatus(
                "آرشیو " +
                formatFullJalaliDate(
                    date
                ) +
                " نمایش داده شد."
            );
        }
    )

    .catch(
        function(error) {

            fireLayer.clearLayers();


            document.getElementById(
                "fireCount"
            ).innerText =
                "۰";


            document.getElementById(
                "viirsCount"
            ).innerText =
                "۰";


            document.getElementById(
                "modisCount"
            ).innerText =
                "۰";


            document.getElementById(
                "archiveCount"
            ).innerText =
                "۰ حریق";


            setStatus(
                "برای این روز داده‌ای ثبت نشده است."
            );


            console.error(
                error
            );
        }
    );
}


/* =========================================================
   تغییر اسلایدر
========================================================= */

document.getElementById(
    "archiveSlider"
).addEventListener(
    "input",
    function() {

        selectedArchiveIndex =
            parseInt(
                this.value,
                10
            );


        loadSelectedArchive();
    }
);


/* =========================================================
   دکمه به‌روزرسانی دستی
========================================================= */

document.getElementById(
    "updateButton"
).addEventListener(
    "click",
    function() {

        const button =
            this;


        button.disabled =
            true;


        button.innerText =
            "⏳ در حال به‌روزرسانی...";


        setStatus(
            "در حال بررسی آخرین داده..."
        );


        /*
           GitHub Pages نمی‌تواند
           Python را اجرا کند.

           بنابراین این دکمه فقط
           آخرین فایل منتشرشده را
           دوباره دریافت می‌کند.
        */

        loadCSV(
            FIRE_FILE
        )

        .then(
            function(fires) {

                displayFires(
                    fires
                );


                setStatus(
                    "آخرین داده موجود با موفقیت بارگذاری شد."
                );
            }
        )

        .catch(
            function(error) {

                setStatus(
                    "خطا در دریافت داده."
                );


                console.error(
                    error
                );
            }
        )

        .finally(
            function() {

                button.disabled =
                    false;


                button.innerText =
                    "🔄 به‌روزرسانی";
            }
        );
    }
);


/* =========================================================
   Legend
========================================================= */

const legend =
    L.control({
        position:
            "bottomleft"
    });


legend.onAdd =
    function() {

        const div =
            L.DomUtil.create(
                "div",
                "legend"
            );


        div.innerHTML =

            "<b>راهنمای حریق</b>" +

            "<div class='legend-item'>" +

            "<span class='legend-dot' " +
            "style='background:#ff1744'></span>" +

            "VIIRS" +

            "</div>" +

            "<div class='legend-item'>" +

            "<span class='legend-dot' " +
            "style='background:#ff9800'></span>" +

            "MODIS" +

            "</div>";


        return div;
    };


legend.addTo(
    map
);


/* =========================================================
   شروع سیستم
========================================================= */

Promise.all(
    [

        loadBoundary(),

        loadArchiveIndex()

    ]
)

.then(
    function() {

        /*
           آخرین روز = امروز
        */

        loadSelectedArchive();

    }
)

.catch(
    function(error) {

        console.error(
            error
        );


        setStatus(
            "خطا در بارگذاری سامانه: " +
            error.message
        );
    }
);

</script>
