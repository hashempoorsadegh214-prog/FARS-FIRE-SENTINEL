
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سامانه پایش و مدیریت داده‌های حریق</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

<style>

:root{
    --red:#b71c1c;
    --red-dark:#720000;
    --panel:rgba(255,255,255,.97);
    --border:#d8dee3;
    --text:#263238;
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    font-family:
        "B Nazanin",
        "BNazanin",
        Tahoma,
        Arial,
        sans-serif;
    background:#eef2f5;
    color:var(--text);
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:relative;
    z-index:5000;
    height:70px;
    background:
        linear-gradient(
            135deg,
            #720000 0%,
            #c91414 45%,
            #8f0000 75%,
            #e01b1b 100%
        );
    box-shadow:
        0 2px 12px rgba(80,0,0,.35);
}

.header-logo{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    width:68px;
    height:68px;
    object-fit:contain;
    filter:
        brightness(0)
        invert(1);
}

.header-content{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 150px 0 120px;
    text-align:center;
}

.title h1{
    margin:0;
    font-family:
        "B Titr",
        "BTitr",
        Tahoma,
        Arial,
        sans-serif;
    font-size:23px;
    line-height:1.2;
    color:#fff;
}

.title p{
    margin:3px 0 0;
    font-size:12px;
    color:rgba(255,255,255,.94);
}

.header-buttons{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    gap:4px;
}

.header-btn{
    width:34px;
    height:34px;
    border:0;
    border-radius:8px;
    background:rgba(255,255,255,.18);
    color:#fff;
    cursor:pointer;
    font-size:16px;
}

.header-btn:hover{
    background:rgba(255,255,255,.30);
}

/* =========================================================
   MAP
========================================================= */

#map{
    position:absolute;
    top:80px;
    left:8px;
    right:8px;
    bottom:8px;
    border:1px solid #d7dde1;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 16px rgba(0,0,0,.12);
}

/* =========================================================
   CONTROL PANEL
========================================================= */

.control-panel{
    position:absolute;
    top:92px;
    right:18px;
    width:230px;
    z-index:4000;
    padding:7px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel);
    box-shadow:0 4px 14px rgba(0,0,0,.16);
}

.control-panel *,
.update-box *,
.slider-box *{
    font-family:
        "B Nazanin",
        "BNazanin",
        Tahoma,
        Arial,
        sans-serif !important;
}

.fire-count{
    margin-bottom:6px;
    padding:6px;
    text-align:center;
    border:1px solid #d9aaaa;
    border-radius:8px;
    background:#fff4f4;
    color:var(--red-dark);
    font-size:16px;
    font-weight:bold;
    line-height:1.2;
}

.fire-count-number{
    font-size:22px;
    color:var(--red);
}

.mode-btn{
    width:100%;
    margin-bottom:5px;
    padding:6px 8px;
    border:0;
    border-radius:8px;
    background:#f0f2f4;
    color:#344047;
    font-size:15px;
    font-weight:bold;
    text-align:right;
    cursor:pointer;
}

.mode-btn.active{
    background:
        linear-gradient(
            135deg,
            #720000,
            #d41414 55%,
            #980000
        );
    color:#fff;
    box-shadow:0 2px 8px rgba(114,0,0,.35);
}

/* =========================================================
   AREA
========================================================= */

.area-box{
    margin-top:5px;
    padding-top:6px;
    border-top:1px solid #e6eaed;
}

.area-title{
    margin-bottom:4px;
    font-size:14px;
    font-weight:bold;
}

.area-option{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:4px;
    padding:5px 7px;
    border-radius:7px;
    background:#f6f7f8;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.area-option input{
    width:14px;
    height:14px;
    margin:0;
}

/* =========================================================
   SENSOR
========================================================= */

.sensor-box{
    position:absolute;
    top:92px;
    left:50%;
    transform:translateX(-50%);
    z-index:4000;
    display:flex;
    align-items:center;
    gap:12px;
    padding:5px 10px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel);
    box-shadow:0 4px 12px rgba(0,0,0,.14);
    font-size:14px;
    white-space:nowrap;
}

.sensor-item{
    display:flex;
    align-items:center;
    gap:5px;
}

.sensor-dot{
    width:9px;
    height:9px;
    border-radius:50%;
}

/* =========================================================
   STATUS
========================================================= */

.update-box{
    position:absolute;
    right:9px;
    bottom:9px;
    z-index:4000;
    display:flex;
    align-items:center;
    justify-content:center;
    width:max-content;
    max-width:calc(100vw - 18px);
    padding:6px 12px;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--panel);
    box-shadow:0 4px 14px rgba(0,0,0,.16);
    white-space:nowrap;
    font-size:14px;
    font-weight:bold;
    direction:rtl;
}

.update-row{
    display:inline;
    color:var(--red-dark);
}

.update-row + .update-row::before{
    content:"  │  ";
    color:#8b949a;
}

/* =========================================================
   SLIDER
========================================================= */

.slider-box{
    position:absolute;
    left:18px;
    bottom:14px;
    width:350px;
    z-index:4000;
    padding:7px 12px;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--panel);
    box-shadow:0 4px 14px rgba(0,0,0,.16);
}

.slider-head{

    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:4px;
}

.slider-title{
    font-size:16px;

}

.slider-date{
    font-size:15px;
    font-weight:bold;
    color:var(--red-dark);
}

.slider-count{
    font-size:14px;
    color:#546e7a;
}

#archiveSlider{

}

/* =========================================================
   POPUP
========================================================= */

.fire-popup{
    width:270px;
    direction:rtl;
    text-align:right;
    font-family:Tahoma,Arial,sans-serif;

    line-height:1.9;
}

.fire-popup h3{

}

.fire-popup .row{

    border-bottom:1px solid #edf0f2;
}

.fire-popup .label{
    font-weight:bold;
}

.area-name{
    color:#1565c0;
    font-weight:bold;
}

/* =========================================================
   NIGHT
========================================================= */

body.night{
    background:#121820;
}

body.night .control-panel,
body.night .sensor-box,
body.night .update-box,
body.night .slider-box{
    background:rgba(26,32,40,.97);
    border-color:#3a4650;
    color:#e8edf1;
}

body.night .mode-btn{
    background:#252d36;
    color:#dbe3e8;
}

body.night .mode-btn.active{
    background:

            #720000,
            #d41414 55%,
            #980000

}

body.night .area-option{
    background:#252d36;
    color:#dbe3e8;
}

body.night .fire-count{
    background:#301e1e;
    border-color:#694141;
    color:#ffd6d6;
}

body.night .fire-count-number{

/*
   فقط نقشه پایه خیابانی در حالت شب تاریک می‌شود.
   لایه ماهواره‌ای معکوس نمی‌شود.
*/

body.night .leaflet-container{

}

body.night .leaflet-control-zoom a{

    color:#e6e6e6;
    border-color:#333;
}

body.night .leaflet-control-attribution{

        left:5px;

        width:auto;
        font-size:9px;
        overflow:hidden;
    }
}

</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   CONFIG
========================================================= */

const CONFIG={

    boundary:"fars.geojson",

    protected:"protected_areas.geojson",

    hunting:"hunting_banned.geojson",

    archiveIndex:"archive/index.json",

    updateInfo:"update-info.json"

};


/* =========================================================
   STATE
========================================================= */

const state={

    map:null,

    lightMap:null,

    darkMap:null,

    /*
       لایه تصویر ماهواره‌ای
    */
    satelliteMap:null,

    /*
       وضعیت فعلی پس‌زمینه
       street = نقشه خیابانی
       satellite = تصویر ماهواره‌ای
    */
    baseMap:"street",

    boundaryLayer:null,

    protectedLayer:null,

    huntingLayer:null,

    fireLayer:null,

    protectedGeoJSON:null,

    huntingGeoJSON:null,

    fires:[],

    archiveDates:[],

    archiveHeaders:[],

    mode:"24h",

    areaFilter:"none",

    systemTimestamp:null,

    currentArchiveDate:null

};


/* =========================================================
   HELPERS
========================================================= */

const $=
    id=>
        document.getElementById(id);


async function getText(url){

    const response=
        await fetch(
            url+
            "?v="+
            Date.now(),
            {
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            "خطا در دریافت فایل: "+
            url
        );

    }

    return response.text();

}


function fa(value){

    return String(value)

        .replace(/0/g,"۰")
        .replace(/1/g,"۱")
        .replace(/2/g,"۲")
        .replace(/3/g,"۳")
        .replace(/4/g,"۴")
        .replace(/5/g,"۵")
        .replace(/6/g,"۶")
        .replace(/7/g,"۷")
        .replace(/8/g,"۸")
        .replace(/9/g,"۹");

}


/* =========================================================
   CSV
========================================================= */

function parseCSV(text){

    text=
        text
            .replace(/^\uFEFF/,"")
            .trim();

    if(!text){

        return{
            headers:[],
            rows:[]
        };

    }

    const lines=
        text.split(/\r?\n/);

    const headers=
        lines[0]
            .split(",")
            .map(
                h=>
                    h.trim().toLowerCase()
            );

    const rows=[];

    for(
        let i=1;
        i<lines.length;
        i++
    ){

        if(
            !lines[i].trim()
        ){

            continue;

        }

        const values=
            lines[i].split(",");

        const row={};

        headers.forEach(
            (
                header,
                index
            )=>{

                row[header]=

                    values[index]!==undefined

                    ?

                    values[index].trim()

                    :

                    "";

            }
        );

        rows.push(row);

    }

    return{
        headers,
        rows
    };

}


/* =========================================================
   JALALI
========================================================= */

function gregorianToJalali(
    gy,
    gm,
    gd
){

    const gdm=[
        0,
        31,
        59,
        90,
        120,
        151,
        181,
        212,
        243,
        273,
        304,
        334
    ];

    let jy;

    if(
        gy>1600
    ){

        jy=979;
        gy-=1600;

    }else{

        jy=0;
        gy-=621;

    }

    const gy2=
        gm>2
        ?
        gy+1
        :
        gy;

    let days=

        365*gy

        +

        Math.floor(
            (gy2+3)/4
        )

        -

        Math.floor(
            (gy2+99)/100
        )

        +

        Math.floor(
            (gy2+399)/400
        )

        -

        80

        +

        gd

        +

        gdm[gm-1];

    jy+=
        33*
        Math.floor(
            days/12053
        );

    days%=12053;

    jy+=
        4*
        Math.floor(
            days/1461
        );

    days%=1461;

    if(
        days>365
    ){

        jy+=
            Math.floor(
                (days-1)/365
            );

        days=
            (days-1)%365;

    }

    let jm;
    let jd;

    if(
        days<186
    ){

        jm=
            1+
            Math.floor(
                days/31
            );

        jd=
            1+
            days%31;

    }else{

        jm=
            7+
            Math.floor(
                (days-186)/30
            );

        jd=
            1+
            (days-186)%30;

    }

    return[
        jy,
        jm,
        jd
    ];

}


function shamsiDate(date){

    if(
        !date
    ){

        return"---";

    }

    const parts=
        String(date)
            .split("-");

    if(
        parts.length!==3
    ){

        return date;

    }

    const j=
        gregorianToJalali(

            Number(parts[0]),
            Number(parts[1]),
            Number(parts[2])

        );

    const months=[

        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند"

    ];

    return(

        fa(j[2])
        +
        " "
        +
        months[j[1]-1]
        +
        " "
        +
        fa(j[0])

    );

}


/* =========================================================
   TIME
========================================================= */

function fireUTCDateTime(fire){

    if(
        !fire.acq_date ||
        !fire.acq_time
    ){

        return null;

    }

    const date=
        String(
            fire.acq_date
        )
        .split("-");

    const time=
        String(
            fire.acq_time
        )
        .replace(
            /\D/g,
            ""
        )
        .padStart(
            4,
            "0"
        );

    return new Date(

        Date.UTC(

            Number(date[0]),

            Number(date[1])-1,

            Number(date[2]),

            Number(
                time.slice(0,2)
            ),

            Number(
                time.slice(2,4)
            ),

            0

        )

    );

}


function iranTime(fire){

    const utc=
        fireUTCDateTime(fire);

    if(
        !utc
    ){

        return"---";

    }

    const iran=
        new Date(

            utc.getTime()
            +
            3.5*
            60*
            60*
            1000

        );

    return(

        String(
            iran.getUTCHours()
        )
        .padStart(2,"0")

        +

        ":"

        +

        String(
            iran.getUTCMinutes()
        )
        .padStart(2,"0")

    );

}


function getTimeLabel(fire){

    const time=
        iranTime(fire);

    if(
        time==="---"
    ){

        return"---";

    }

    const hour=
        Number(
            time.slice(0,2)
        );

    if(
        hour<6
    ){

        return"بامداد";

    }

    const dn=
        String(
            fire.daynight||
            ""
        )
        .trim()
        .toUpperCase();

    if(
        dn==="D"
    ){

        dn==="N"
    ){

    }

}

   SENSOR
========================================================= */

function getSensor(fire){

    const value=
        String(

            fire.detected_sensor
            ||
            fire.instrument
            ||
            ""

        )
        .trim()
        .toUpperCase();

    if(
        value.includes("VIIRS")
    ){

        return"VIIRS";

    }

    if(
        value.includes("MODIS")
    ){

        return"MODIS";

    }

    return"UNKNOWN";

}


function sensorColor(sensor){

    if(
        sensor==="VIIRS"
    ){

        return"#ff1744";

    }

    if(
        sensor==="MODIS"
    ){

        return"#ff9800";

    }

    return"#8e24aa";

}

/* =========================================================

async function loadArchiveIndex(){

    const today=
        getCurrentIranDate();

    let dates=[];

    try{

        const data=
            JSON.parse(
                await getText(
                    CONFIG.archiveIndex
                )
            );

        const index=

            Array.isArray(data)

            ?

            data

            :

            Array.isArray(data.dates)

            ?

            data.dates

            :

            [];

        dates=

            index

            .map(
                item=>
                    typeof item==="string"
                    ?
                    item
                    :
                    item.date
            )

            .filter(Boolean)

            .filter(
                date=>
                    date<=today
            )

            .filter(
                (date,index,self)=>
                    self.indexOf(date)===index
            )

            .sort();

    }catch(error){

        console.warn(
            "archive/index:",
            error
        );

    }

    if(
        !dates.includes(today)
    ){

        dates.push(today);

    }

    state.archiveDates=
        dates.sort();

}

/* =========================================================
   TIME FILTER
========================================================= */

function getTimeFilteredFires(){

    const all=
        getAllFires();

    const now=
        Date.now();

    if(
        state.mode==="24h"
    ){

        const start=
            now-
            24*
            60*
            60*
            1000;

        return all.filter(
            fire=>{

                const time=
                    fireUTCDateTime(
                        fire
                    );

                if(
                    !time
                ){

                    return false;

                }

                const timestamp=
                    time.getTime();

                return(

                    timestamp>=start
                    &&
                    timestamp<=now

                );

            }
        );

    }

    if(
        state.mode==="5days"
    ){

        const start=
            now-
            5*
            24*
            60*
            60*
            1000;

        return all.filter(
            fire=>{

                const time=
                    fireUTCDateTime(
                        fire
                    );

                if(
                    !time
                ){

                    return false;

                }

                const timestamp=
                    time.getTime();

                return(

                    timestamp>=start
                    &&
                    timestamp<=now

                );

            }
        );

    }

    if(
        state.mode==="today"
    ){

        const today=
            getCurrentIranDate();

        return all.filter(
            fire=>
                String(
                    fire.iran_date||""
                ).trim()===today
        );

    }

    return[];

}


/* =========================================================
   AREA
========================================================= */

function pointInRing(
    point,
    ring
){

    const x=point[0];
    const y=point[1];

    let inside=false;

    for(

        let i=0,
            j=ring.length-1;

        i<ring.length;

        j=i++

    ){

        const xi=ring[i][0];
        const yi=ring[i][1];

        const xj=ring[j][0];
        const yj=ring[j][1];

        const intersect=

            (
                yi>y
            )
            !==
            (
                yj>y
            )

            &&

            x <

            (

                (
                    xj-xi
                )
                *
                (
                    y-yi
                )
                /
                (
                    yj-yi
                )
                +
                xi

            );

        if(
            intersect
        ){

            inside=!inside;

        }

    }

    return inside;

}


function pointInPolygon(
    point,
    rings
){

    if(
        !rings ||
        !rings.length
    ){

        return false;

    }

    if(
        !pointInRing(
            point,
            rings[0]
        )
    ){

        return false;

    }

    for(
        let i=1;
        i<rings.length;
        i++
    ){

        if(
            pointInRing(
                point,
                rings[i]
            )
        ){

            return false;

        }

    }

    return true;

}


function findRegionName(
    properties
){

    if(
        !properties
    ){

        return"";

    }

    const preferred=[

        "name",
        "NAME",
        "Name",
        "نام",
        "نام منطقه",
        "نام_منطقه",
        "نام منطقه حفاظت شده",
        "نام منطقه شکار ممنوع",
        "area_name",
        "AREA_NAME",
        "area",
        "AREA",
        "title",
        "Title",
        "region",
        "Region",
        "zone",
        "ZONE",
        "Name_1",
        "NAME_1"

    ];

    for(
        const key of preferred
    ){

        if(

            properties[key]!==undefined
            &&
            properties[key]!==null
            &&
            String(
                properties[key]
            ).trim()!==""

        ){

            return String(
                properties[key]
            ).trim();

        }

    }

    const dynamicKey=
        Object.keys(
            properties
        )
        .find(
            key=>
                /name|نام|title|عنوان/i
                .test(key)
        );

    if(
        dynamicKey
    ){

        return String(
            properties[dynamicKey]
        ).trim();

    }

    return"";

}


function findRegionsAtPoint(
    lat,
    lon
){

    const result={
        protected:[],
        hunting:[]
    };

    const point=[
        lon,
        lat
    ];

    function scan(
        geojson,
        target
    ){

        if(
            !geojson
        ){

            return;

        }

        const features=

            geojson.type==="FeatureCollection"

            ?
            geojson.features

            :
            geojson.type==="Feature"

            ?
            [geojson]

            :
            [];

        features.forEach(
            feature=>{

                if(
                    !feature ||
                    !feature.geometry
                ){

                    return;

                }

                const geometry=
                    feature.geometry;

                let inside=false;

                if(
                    geometry.type==="Polygon"
                ){

                    inside=
                        pointInPolygon(
                            point,
                            geometry.coordinates
                        );

                }

                if(
                    geometry.type==="MultiPolygon"
                ){

                    for(
                        const polygon
                        of
                        geometry.coordinates
                    ){

                        if(
                            pointInPolygon(
                                point,
                                polygon
                            )
                        ){

                            inside=true;

                            break;

                        }

                    }

                }

                if(
                    inside
                ){

                    const name=
                        findRegionName(
                            feature.properties
                        );

                    if(

                        name

                        &&

                        !result[target]
                            .includes(
                                name
                            )

                    ){

                        result[target]
                            .push(
                                name
                            );

                    }

                }

            }
        );

    }

    scan(
        state.protectedGeoJSON,
        "protected"
    );

    scan(
        state.huntingGeoJSON,
        "hunting"
    );

    return result;

}


function applyAreaFilter(
    fires
){

    if(
        state.areaFilter==="none"
    ){

        return fires;

    }

    return fires.filter(
        fire=>{

            const lat=
                Number(
                    fire.latitude
                );

            const lon=
                Number(
                    fire.longitude
                );

            if(

                !Number.isFinite(lat)
                ||
                !Number.isFinite(lon)

            ){

                return false;

            }

            const regions=
                findRegionsAtPoint(
                    lat,
                    lon
                );

            if(
                state.areaFilter==="protected"
            ){

                return(
                    regions.protected.length>0
                );

            }

            return(
                regions.hunting.length>0
            );

        }
    );

}

function getLatestObservation(){

    let latest=null;

    getAllFires().forEach(
        fire=>{

            const time=
                fireUTCDateTime(
                    fire
                );

            if(
                !time
            ){

                return;

            }

            if(
                !latest ||
                time>latest
            ){

                latest=
                    time;

            }

        }
    );

    return latest;

}


function ageText(
    timestamp
){

    if(
        !timestamp
    ){

        return "در انتظار اطلاعات";

    }

    const seconds=
        Math.max(

            0,

            Math.floor(

                (
                    Date.now()-
                    timestamp
                )
                /
                1000

            )

        );

    const hours=
        Math.floor(
            seconds/3600
        );

    const minutes=
        Math.floor(
            (seconds%3600)/60
        );

    const sec=
        seconds%60;

    if(
        hours>0
    ){

        return(

            fa(hours)
            +
            " ساعت و "
            +
            fa(minutes)
            +
            " دقیقه پیش"

        );

    }

    return(

        fa(minutes)
        +
        " دقیقه و "
        +
        fa(sec)
        +
        " ثانیه پیش"

    );

}

function escapeXml(
    value
){

    return String(
        value??""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&apos;");

}


function exportExcel(){

    const fires=
        getVisibleFires();

    if(
        !fires.length
    ){

        alert(
            "برای بازه انتخاب‌شده داده‌ای وجود ندارد."
        );

        return;

    }

    const headers=[

        "latitude",
        "longitude",
        "acq_date",
        "acq_time",
        "iran_date",
        "iran_time",
        "satellite",
        "instrument",
        "detected_sensor",
        "frp",
        "confidence",
        "daynight",
        "archive_date"

    ];

    let xml=

        '<?xml version="1.0"?>'

        +

        '<Workbook '

        +

        'xmlns="urn:schemas-microsoft-com:office:spreadsheet" '

        +

        'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'

        +

        '<Worksheet ss:Name="Fires">'

        +

        '<Table>';

    xml+=
        "<Row>";

    headers.forEach(
        header=>{

            xml+=

                "<Cell>"

                +

                '<Data ss:Type="String">'

                +

                escapeXml(
                    header
                )

                +

                "</Data>"

                +

                "</Cell>";

        }
    );

    xml+=
        "</Row>";

    fires.forEach(
        fire=>{

            xml+=
                "<Row>";

            headers.forEach(
                header=>{

                    xml+=

                        "<Cell>"

                        +

                        '<Data ss:Type="String">'

                        +

                        escapeXml(
                            fire[header]
                        )

                        +

                        "</Data>"

                        +

                        "</Cell>";

                }
            );

            xml+=
                "</Row>";

        }
    );

    xml+=

        "</Table>"

        +

        "</Worksheet>"

        +

        "</Workbook>";

    const blob=
        new Blob(

            [xml],

            {

                type:
                    "application/vnd.ms-excel"

            }

        );

    const url=
        URL.createObjectURL(
            blob
        );

    const link=
        document.createElement(
            "a"
        );

    link.href=url;

    link.download=

        "fires_"

        +

        new Date()
            .toISOString()
            .slice(
                0,
                10
            )

        +

        ".xls";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    setTimeout(
        ()=>URL.revokeObjectURL(url),
        1000
    );

}


/* =========================================================
   REPORT
========================================================= */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function lonToWorldX(
    lon,
    zoom
){

    const size=
        256*
        Math.pow(
            2,
            zoom
        );

    return(

        (
            lon+
            180
        )
        /
        360

    )*
    size;

}


function latToWorldY(
    lat,
    zoom
){

    const size=
        256*
        Math.pow(
            2,
            zoom
        );

    const rad=
        lat*
        Math.PI/
        180;

    const mercator=
        Math.log(

            Math.tan(

                Math.PI/4+
                rad/2

            )

        );

    return(

        (
            1-
            mercator/
            Math.PI
        )
        /
        2

    )*
    size;

}


function loadImage(
    url
){

    return new Promise(
        (resolve,reject)=>{

            const image=
                new Image();

            image.crossOrigin=
                "anonymous";

            image.onload=
                ()=>resolve(image);

            image.onerror=
                ()=>reject(
                    new Error(
                        "Tile load failed: "+
                        url
                    )
                );

            image.src=url;

        }
    );

}


function drawFireStar(
    ctx,
    x,
    y
){

    const outer=8;
    const inner=3.5;

    ctx.save();

    ctx.beginPath();

    for(
        let i=0;
        i<10;
        i++
    ){

        const angle=

            -Math.PI/2+
            i*Math.PI/5;

        const radius=

            i%2===0
            ?
            outer
            :
            inner;

        const px=
            x+
            Math.cos(angle)*
            radius;

        const py=
            y+
            Math.sin(angle)*
            radius;

        if(
            i===0
        ){

            ctx.moveTo(
                px,
                py
            );

        }else{

            ctx.lineTo(
                px,
                py
            );

        }

    }

    ctx.closePath();

    ctx.fillStyle=
        "#ff0000";

    ctx.fill();

    ctx.lineWidth=
        1.5;

    ctx.strokeStyle=
        "#720000";

    ctx.stroke();

    ctx.restore();

}


async function buildReportMap(){

    const center=
        state.map.getCenter();

    const zoom=
        state.map.getZoom();

    const mapElement=
        $("map");

    const width=
        Math.round(
            mapElement.clientWidth
        );

    const height=
        Math.round(
            mapElement.clientHeight
        );

    if(
        !width ||
        !height
    ){

        throw new Error(
            "Map size is zero."
        );

    }

    const tileSize=256;

    const centerWorldX=
        lonToWorldX(
            center.lng,
            zoom
        );

    const centerWorldY=
        latToWorldY(
            center.lat,
            zoom
        );

    const topLeftWorldX=
        centerWorldX-
        width/2;

    const topLeftWorldY=
        centerWorldY-
        height/2;

    const canvas=
        document.createElement(
            "canvas"
        );

    canvas.width=
        width;

    canvas.height=
        height;

    const ctx=
        canvas.getContext(
            "2d"
        );

    ctx.fillStyle=
        "#e5e5e5";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    const startTileX=
        Math.floor(
            topLeftWorldX/
            tileSize
        );

    const startTileY=
        Math.floor(
            topLeftWorldY/
            tileSize
        );

    const endTileX=
        Math.floor(

            (
                topLeftWorldX+
                width
            )
            /
            tileSize

        );

    const endTileY=
        Math.floor(

            (
                topLeftWorldY+
                height
            )
            /
            tileSize

        );

    const maxTile=
        Math.pow(
            2,
            zoom
        )-
        1;

    const tilePromises=[];

    for(

        let tileY=startTileY;

        tileY<=endTileY;

        tileY++

    ){

        for(

            let tileX=startTileX;

            tileX<=endTileX;

            tileX++

        ){

            const worldTiles=
                maxTile+1;

            const wrappedX=

                (
                    (
                        tileX%
                        worldTiles
                    )
                    +
                    worldTiles
                )
                %
                worldTiles;

            const safeY=
                clamp(
                    tileY,
                    0,
                    maxTile
                );

            /*
               گزارش تصویری مطابق لایه پایه فعلی
            */

            let url;

            if(
                state.baseMap==="satellite"
            ){

                url=

                    `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${safeY}/${wrappedX}`;

            }else{

                url=

                    `https://tile.openstreetmap.org/${zoom}/${wrappedX}/${safeY}.png`;

            }

            tilePromises.push(

                loadImage(
                    url
                )
                .then(
                    image=>{

                        const dx=

                            tileX*
                            tileSize-
                            topLeftWorldX;

                        const dy=

                            tileY*
                            tileSize-
                            topLeftWorldY;

                        ctx.drawImage(

                            image,

                            Math.round(dx),

                            Math.round(dy),

                            tileSize,
                            tileSize

                        );

                    }
                )
                .catch(
                    ()=>{}
                )

            );

        }

    }

    await Promise.all(
        tilePromises
    );

    const reportFires=
        getVisibleFires();

    const bounds=
        state.map.getBounds();

    reportFires.forEach(
        fire=>{

            const lat=
                Number(
                    fire.latitude
                );

            const lon=
                Number(
                    fire.longitude
                );

            if(

                !Number.isFinite(lat)
                ||
                !Number.isFinite(lon)

            ){

                return;

            }

            if(
                !bounds.contains(
                    [lat,lon]
                )
            ){

                return;

            }

            const fireWorldX=
                lonToWorldX(
                    lon,
                    zoom
                );

            const fireWorldY=
                latToWorldY(
                    lat,
                    zoom
                );

            drawFireStar(

                ctx,

                fireWorldX-
                topLeftWorldX,

                fireWorldY-
                topLeftWorldY

            );

        }
    );

    return canvas;

}


async function createRegionReport(){

/* =========================================================
   CURRENT IRAN DATE
========================================================= */

function getCurrentIranDate(){

    const parts=
        new Intl.DateTimeFormat(

            "en-CA",

            {

                timeZone:
                    "Asia/Tehran",

                year:"numeric",

                month:"2-digit",

                day:"2-digit"

            }

        )
        .formatToParts(
            new Date()
        );

    const values={};

    parts.forEach(
        part=>{

            if(
                part.type!=="literal"
            ){

                values[
                    part.type
                ]=
                    part.value;

            }

        }
    );

    return(

        values.year+
        "-"
        +
        values.month+
        "-"
        +
        values.day

    );

}
