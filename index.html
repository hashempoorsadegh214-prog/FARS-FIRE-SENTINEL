<script>

/* =========================================================
   FILES
========================================================= */

const BOUNDARY_FILE =
    "geoBoundaries-IRN-ADM1.geojson";

const ARCHIVE_INDEX =
    "archive/index.json";

const UPDATE_INFO =
    "update-info.json";


/* =========================================================
   MAP
========================================================= */

const map =
    L.map("map");


const lightTile =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 18,
            attribution:
                "© OpenStreetMap contributors"
        }
    );


const darkTile =
    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            maxZoom: 19,
            attribution:
                "© OpenStreetMap © CARTO"
        }
    );


lightTile.addTo(map);


map.setView(
    [29.6, 52.5],
    8
);


/* =========================================================
   VARIABLES
========================================================= */

let farsBoundaryLayer = null;

let archiveDates = [];

let allFires = [];

let currentMode = "today";

let selectedArchiveIndex = 0;

let lastUpdateTimestamp = null;


/* =========================================================
   FIRE LAYER
========================================================= */

const fireLayer =
    L.markerClusterGroup({

        showCoverageOnHover: false,

        spiderfyOnMaxZoom: true,

        disableClusteringAtZoom: 12,

        maxClusterRadius: 30

    });


map.addLayer(
    fireLayer
);


/* =========================================================
   PERSIAN DIGITS
========================================================= */

function toPersianDigits(value) {

    return String(value)
        .replace(/0/g, "۰")
        .replace(/1/g, "۱")
        .replace(/2/g, "۲")
        .replace(/3/g, "۳")
        .replace(/4/g, "۴")
        .replace(/5/g, "۵")
        .replace(/6/g, "۶")
        .replace(/7/g, "۷")
        .replace(/8/g, "۸")
        .replace(/9/g, "۹");
}


/* =========================================================
   GREGORIAN TO JALALI
========================================================= */

function gregorianToJalali(
    gy,
    gm,
    gd
) {

    const gdm = [
        0,
        31,
        59,
        90,
        120,
        151,
        181,
        212,
        243,
        273,
        304,
        334
    ];

    let jy;

    if (gy > 1600) {

        jy = 979;
        gy -= 1600;

    } else {

        jy = 0;
        gy -= 621;
    }

    const gy2 =
        gm > 2
        ? gy + 1
        : gy;

    let days =
        365 * gy
        +
        Math.floor((gy2 + 3) / 4)
        -
        Math.floor((gy2 + 99) / 100)
        +
        Math.floor((gy2 + 399) / 400)
        -
        80
        +
        gd
        +
        gdm[gm - 1];

    jy +=
        33 * Math.floor(days / 12053);

    days %= 12053;

    jy +=
        4 * Math.floor(days / 1461);

    days %= 1461;

    if (days > 365) {

        jy +=
            Math.floor((days - 1) / 365);

        days =
            (days - 1) % 365;
    }

    let jm;
    let jd;

    if (days < 186) {

        jm =
            1 + Math.floor(days / 31);

        jd =
            1 + days % 31;

    } else {

        jm =
            7 + Math.floor((days - 186) / 30);

        jd =
            1 + ((days - 186) % 30);
    }

    return [
        jy,
        jm,
        jd
    ];
}


/* =========================================================
   JALALI DATE
========================================================= */

function jalaliFullDate(dateString) {

    if (!dateString) {
        return "---";
    }

    const parts =
        String(dateString).split("-");

    if (parts.length !== 3) {
        return dateString;
    }

    const j =
        gregorianToJalali(
            parseInt(parts[0], 10),
            parseInt(parts[1], 10),
            parseInt(parts[2], 10)
        );

    const months = [
        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند"
    ];

    return (
        toPersianDigits(j[2])
        +
        " "
        +
        months[j[1] - 1]
        +
        " "
        +
        toPersianDigits(j[0])
    );
}


/* =========================================================
   LOAD TEXT
========================================================= */

async function loadText(url) {

    const separator =
        url.includes("?")
        ? "&"
        : "?";

    const response =
        await fetch(
            url
            +
            separator
            +
            "v="
            +
            Date.now()
        );

    if (!response.ok) {

        throw new Error(
            "خطا در دریافت " + url
        );
    }

    return await response.text();
}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

    text =
        text
        .replace(/^\uFEFF/, "")
        .trim();

    if (!text) {
        return [];
    }

    const lines =
        text.split(/\r?\n/);

    if (lines.length < 2) {
        return [];
    }

    const headers =
        lines[0]
        .split(",")
        .map(function(value) {

            return value
                .trim()
                .toLowerCase();

        });

    const rows = [];

    for (
        let i = 1;
        i < lines.length;
        i++
    ) {

        if (!lines[i].trim()) {
            continue;
        }

        const values =
            lines[i].split(",");

        const row = {};

        for (
            let j = 0;
            j < headers.length;
            j++
        ) {

            row[headers[j]] =
                values[j] !== undefined
                ? values[j].trim()
                : "";
        }

        rows.push(row);
    }

    return rows;
}


/* =========================================================
   LOAD BOUNDARY
========================================================= */

async function loadBoundary() {

    const text =
        await loadText(
            BOUNDARY_FILE
        );

    const data =
        JSON.parse(text);

    let fars = null;

    data.features.forEach(
        function(feature) {

            const name =
                String(
                    feature.properties?.shapeName
                    ||
                    ""
                )
                .trim()
                .toLowerCase();

            if (name === "fars") {
                fars = feature;
            }
        }
    );

    if (!fars) {

        throw new Error(
            "استان فارس پیدا نشد."
        );
    }

    farsBoundaryLayer =
        L.geoJSON(
            fars,
            {
                style: {
                    color: "#ef5350",
                    weight: 3,
                    opacity: .95,
                    fillOpacity: .02
                }
            }
        ).addTo(map);

    const bounds =
        farsBoundaryLayer.getBounds();

    if (bounds.isValid()) {

        map.fitBounds(
            bounds,
            {
                padding: [20,20]
            }
        );
    }
}


/* =========================================================
   LOAD ARCHIVE INDEX
========================================================= */

async function loadArchiveIndex() {

    const text =
        await loadText(
            ARCHIVE_INDEX
        );

    const index =
        JSON.parse(text);

    archiveDates =
        index
        .map(function(item) {

            return item.date;

        })
        .filter(Boolean)
        .sort();

    const slider =
        document.getElementById(
            "archiveSlider"
        );

    slider.min = 0;

    slider.max =
        Math.max(
            archiveDates.length - 1,
            0
        );

    selectedArchiveIndex =
        Math.max(
            archiveDates.length - 1,
            0
        );

    slider.value =
        selectedArchiveIndex;

    updateSliderDate();
}


/* =========================================================
   LOAD ALL ARCHIVE FILES
========================================================= */

async function loadAllArchives() {

    allFires = [];

    for (
        const date of archiveDates
    ) {

        try {

            const text =
                await loadText(
                    "archive/"
                    +
                    date
                    +
                    ".csv"
                );

            const rows =
                parseCSV(text);

            rows.forEach(
                function(row) {

                    row.archive_date =
                        date;

                    allFires.push(row);
                }
            );

        } catch (error) {

            console.warn(
                "Archive unavailable:",
                date
            );
        }
    }
}


/* =========================================================
   TODAY IRAN DATE
========================================================= */

function getTodayIranDate() {

    const formatter =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone: "Asia/Tehran",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        );

    return formatter.format(
        new Date()
    );
}


/* =========================================================
   FIRMS UTC DATETIME
========================================================= */

function getFireUTCDateTime(fire) {

    if (
        !fire.acq_date
        ||
        !fire.acq_time
    ) {

        return null;
    }

    let text =
        String(
            fire.acq_time
        )
        .replace(/\D/g, "")
        .padStart(4, "0");

    let hour =
        parseInt(
            text.substring(0,2),
            10
        );

    let minute =
        parseInt(
            text.substring(2,4),
            10
        );

    if (hour > 23) {
        hour %= 24;
    }

    if (minute > 59) {
        minute = 0;
    }

    const parts =
        fire.acq_date.split("-");

    if (parts.length !== 3) {
        return null;
    }

    return new Date(
        Date.UTC(
            parseInt(parts[0],10),
            parseInt(parts[1],10) - 1,
            parseInt(parts[2],10),
            hour,
            minute,
            0
        )
    );
}


/* =========================================================
   IRAN TIME 24 HOUR
========================================================= */

function getIranTime24(fire) {

    if (fire.iran_time) {

        return format24Hour(
            fire.iran_time
        );
    }

    const utcDate =
        getFireUTCDateTime(
            fire
        );

    if (!utcDate) {
        return "---";
    }

    const iranDate =
        new Date(
            utcDate.getTime()
            +
            (
                3.5
                *
                60
                *
                60
                *
                1000
            )
        );

    return (
        String(
            iranDate.getUTCHours()
        ).padStart(2, "0")
        +
        ":"
        +
        String(
            iranDate.getUTCMinutes()
        ).padStart(2, "0")
    );
}


/* =========================================================
   FORMAT 24 HOUR
========================================================= */

function format24Hour(value) {

    let text =
        String(value)
        .replace(/\D/g, "")
        .padStart(4, "0");

    let hour =
        parseInt(
            text.substring(0,2),
            10
        );

    let minute =
        parseInt(
            text.substring(2,4),
            10
        );

    if (hour > 23) {
        hour %= 24;
    }

    if (minute > 59) {
        minute = 0;
    }

    return (
        String(hour).padStart(2, "0")
        +
        ":"
        +
        String(minute).padStart(2, "0")
    );
}


/* =========================================================
   FILTER
========================================================= */

function getFilteredFires(mode) {

    const now =
        new Date();


    /* -----------------------------------------------------
       امروز
    ----------------------------------------------------- */

    if (mode === "today") {

        const todayIran =
            getTodayIranDate();

        return allFires.filter(
            function(fire) {

                const fireDate =
                    fire.iran_date
                    ||
                    fire.archive_date;

                if (
                    fireDate !== todayIran
                ) {

                    return false;
                }

                const fireUTC =
                    getFireUTCDateTime(
                        fire
                    );

                if (!fireUTC) {
                    return false;
                }

                return (
                    fireUTC.getTime()
                    <=
                    now.getTime()
                );
            }
        );
    }


    /* -----------------------------------------------------
       24 ساعت گذشته
    ----------------------------------------------------- */

    if (mode === "24h") {

        const start =
            new Date(
                now.getTime()
                -
                (
                    24
                    *
                    60
                    *
                    60
                    *
                    1000
                )
            );

        return allFires.filter(
            function(fire) {

                const fireUTC =
                    getFireUTCDateTime(
                        fire
                    );

                if (!fireUTC) {
                    return false;
                }

                const time =
                    fireUTC.getTime();

                return (
                    time >= start.getTime()
                    &&
                    time <= now.getTime()
                );
            }
        );
    }


    /* -----------------------------------------------------
       5 روز گذشته
    ----------------------------------------------------- */

    if (mode === "5days") {

        const start =
            new Date(
                now.getTime()
                -
                (
                    5
                    *
                    24
                    *
                    60
                    *
                    60
                    *
                    1000
                )
            );

        return allFires.filter(
            function(fire) {

                const fireUTC =
                    getFireUTCDateTime(
                        fire
                    );

                if (!fireUTC) {
                    return false;
                }

                const time =
                    fireUTC.getTime();

                return (
                    time >= start.getTime()
                    &&
                    time <= now.getTime()
                );
            }
        );
    }


    return [];
}


/* =========================================================
   DISPLAY FIRES
========================================================= */

function displayFires(fires) {

    fireLayer.clearLayers();

    fires.forEach(
        function(fire) {

            const lat =
                parseFloat(
                    fire.latitude
                );

            const lon =
                parseFloat(
                    fire.longitude
                );

            if (
                isNaN(lat)
                ||
                isNaN(lon)
            ) {

                return;
            }

            const sensor =
                String(
                    fire.detected_sensor
                    ||
                    fire.instrument
                    ||
                    ""
                )
                .trim()
                .toUpperCase();

            let color =
                "#8e24aa";

            if (sensor === "VIIRS") {
                color =
                    "#ef233c";
            }

            if (sensor === "MODIS") {
                color =
                    "#f39c12";
            }

            const marker =
                L.circleMarker(
                    [
                        lat,
                        lon
                    ],
                    {
                        radius: 8,
                        color: "#6d1a00",
                        fillColor: color,
                        fillOpacity: .95,
                        weight: 2
                    }
                );

            marker.bindPopup(
                createPopup(fire)
            );

            fireLayer.addLayer(
                marker
            );
        }
    );
}


/* =========================================================
   POPUP
========================================================= */

function createPopup(fire) {

    const iranDate =
        fire.iran_date
        ||
        fire.archive_date
        ||
        "---";

    const iranTime =
        toPersianDigits(
            getIranTime24(fire)
        );

    const dayNightCode =
        String(
            fire.daynight
            ||
            ""
        ).toUpperCase();

    let dayNight =
        "---";

    if (dayNightCode === "D") {
        dayNight = "روز";
    }

    if (dayNightCode === "N") {
        dayNight = "شب";
    }

    return (
        "<div class='popup'>"

        +
        "<h3>🔥 حریق استان فارس</h3>"

        +
        "<b>سنجنده:</b> "
        +
        (
            fire.detected_sensor
            ||
            fire.instrument
            ||
            "---"
        )

        +
        "<br>"

        +
        "<b>ماهواره:</b> "
        +
        (
            fire.satellite
            ||
            "---"
        )

        +
        "<br>"

        +
        "<b>تاریخ ایران:</b> "
        +
        jalaliFullDate(
            iranDate
        )

        +
        "<br>"

        +
        "<b>ساعت ایران:</b> "
        +
        iranTime

        +
        "<br>"

        +
        "<b>روز/شب:</b> "
        +
        dayNight

        +
        "<br>"

        +
        "<b>تاریخ UTC:</b> "
        +
        (
            fire.acq_date
            ||
            "---"
        )

        +
        "<br>"

        +
        "<b>ساعت UTC:</b> "
        +
        (
            fire.acq_time
            ||
            "---"
        )

        +
        "<br>"

        +
        "<b>FRP:</b> "
        +
        (
            fire.frp
            ||
            "---"
        )
        +
        " MW"

        +
        "<br>"

        +
        "<b>Confidence:</b> "
        +
        (
            fire.confidence
            ||
            "---"
        )

        +
        "<br>"

        +
        "<b>مختصات:</b> "
        +
        parseFloat(
            fire.latitude
        ).toFixed(5)
        +
        " , "
        +
        parseFloat(
            fire.longitude
        ).toFixed(5)

        +
        "</div>"
    );
}


/* =========================================================
   APPLY MODE
========================================================= */

function applyMode(mode) {

    currentMode =
        mode;

    const fires =
        getFilteredFires(
            mode
        );

    displayFires(
        fires
    );

    document.querySelectorAll(
        ".mode-btn"
    ).forEach(
        function(button) {

            button.classList.toggle(
                "active",
                button.dataset.mode === mode
            );
        }
    );
}


/* =========================================================
   MODE EVENTS
========================================================= */

document.querySelectorAll(
    ".mode-btn"
).forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                applyMode(
                    this.dataset.mode
                );
            }
        );
    }
);


/* =========================================================
   SLIDER DATE
========================================================= */

function updateSliderDate() {

    const date =
        archiveDates[
            selectedArchiveIndex
        ];

    document.getElementById(
        "sliderDate"
    ).innerText =
        date
        ?
        jalaliFullDate(date)
        :
        "---";
}


/* =========================================================
   SLIDER EVENT
========================================================= */

document.getElementById(
    "archiveSlider"
).addEventListener(
    "input",
    function() {

        selectedArchiveIndex =
            parseInt(
                this.value,
                10
            );

        updateSliderDate();

        const selectedDate =
            archiveDates[
                selectedArchiveIndex
            ];

        const fires =
            allFires.filter(
                function(fire) {

                    const date =
                        fire.iran_date
                        ||
                        fire.archive_date;

                    return (
                        date === selectedDate
                    );
                }
            );

        displayFires(
            fires
        );
    }
);


/* =========================================================
   SLIDER OPEN/CLOSE
========================================================= */

document.getElementById(
    "sliderToggle"
).addEventListener(
    "click",
    function() {

        const drawer =
            document.getElementById(
                "sliderDrawer"
            );

        drawer.classList.toggle(
            "closed"
        );

        this.innerText =
            drawer.classList.contains(
                "closed"
            )
            ? "▶"
            : "◀";
    }
);


/* =========================================================
   NIGHT MODE
========================================================= */

document.getElementById(
    "nightToggle"
).addEventListener(
    "click",
    function() {

        document.body.classList.toggle(
            "night"
        );

        const isNight =
            document.body.classList.contains(
                "night"
            );

        if (isNight) {

            map.removeLayer(
                lightTile
            );

            darkTile.addTo(
                map
            );

            this.innerText =
                "☀️";

            this.title =
                "حالت روز";

            localStorage.setItem(
                "fars-fire-night",
                "1"
            );

        } else {

            map.removeLayer(
                darkTile
            );

            lightTile.addTo(
                map
            );

            this.innerText =
                "🌙";

            this.title =
                "حالت شب";

            localStorage.setItem(
                "fars-fire-night",
                "0"
            );
        }
    }
);


/* =========================================================
   RESTORE NIGHT MODE
========================================================= */

if (
    localStorage.getItem(
        "fars-fire-night"
    )
    ===
    "1"
) {

    document.body.classList.add(
        "night"
    );

    map.removeLayer(
        lightTile
    );

    darkTile.addTo(
        map
    );

    document.getElementById(
        "nightToggle"
    ).innerText =
        "☀️";
}


/* =========================================================
   LOAD UPDATE INFO
========================================================= */

async function loadUpdateInfo() {

    try {

        const text =
            await loadText(
                UPDATE_INFO
            );

        const info =
            JSON.parse(text);

        const timestamp =
            Number(
                info.updated_at_timestamp
            );

        if (
            !Number.isFinite(timestamp)
            ||
            timestamp <= 0
        ) {

            throw new Error(
                "timestamp نامعتبر"
            );
        }

        lastUpdateTimestamp =
            timestamp * 1000;

        updateUpdateLabel();

    } catch (error) {

        document.getElementById(
            "updateInfo"
        ).innerText =
            "آخرین به‌روزرسانی: نامشخص";
    }
}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateUpdateLabel() {

    const element =
        document.getElementById(
            "updateInfo"
        );

    if (!element) {
        return;
    }

    if (!lastUpdateTimestamp) {

        element.innerText =
            "آخرین به‌روزرسانی: در انتظار اطلاعات";

        return;
    }

    const seconds =
        Math.max(
            0,
            Math.floor(
                (
                    Date.now()
                    -
                    lastUpdateTimestamp
                )
                /
                1000
            )
        );

    const minutes =
        Math.floor(
            seconds / 60
        );

    const remainder =
        seconds % 60;

    element.innerText =
        "آخرین به‌روزرسانی: "
        +
        toPersianDigits(minutes)
        +
        " دقیقه و "
        +
        toPersianDigits(remainder)
        +
        " ثانیه پیش";
}

setInterval(
    updateUpdateLabel,
    1000
);
