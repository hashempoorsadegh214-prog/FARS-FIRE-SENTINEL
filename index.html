<script>

/* =========================================================
   FILES
========================================================= */

const FIRE_FILE =
"fires.csv";

const BOUNDARY_FILE =
"geoBoundaries-IRN-ADM1.geojson";

const ARCHIVE_INDEX =
"archive/index.json";

const UPDATE_INFO =
"update-info.json";


/* =========================================================

========================================================= */

const map =
L.map("map");

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
    maxZoom:18,

    attribution:
    "© OpenStreetMap contributors"
}
).addTo(map);

map.setView(
[29.6,52.5],
8
);


/* =========================================================
   FIRE LAYER
========================================================= */

const fireLayer =
L.markerClusterGroup({

    showCoverageOnHover:false,

    spiderfyOnMaxZoom:true,

    disableClusteringAtZoom:12,

    maxClusterRadius:30

});

map.addLayer(
fireLayer
);


/* =========================================================
   VARIABLES
========================================================= */

let farsBoundaryLayer =
null;

let archiveDates =
[];

let selectedArchiveIndex =
0;

let lastUpdateTimestamp =
null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
text
){

document.getElementById(
"status"
).innerText =
text;

}


/* =========================================================
   PERSIAN DIGITS
========================================================= */

function toPersianDigits(
value
){

return String(value)

.replace(/0/g,"۰")
.replace(/1/g,"۱")
.replace(/2/g,"۲")
.replace(/3/g,"۳")
.replace(/4/g,"۴")
.replace(/5/g,"۵")
.replace(/6/g,"۶")
.replace(/7/g,"۷")
.replace(/8/g,"۸")
.replace(/9/g,"۹");

}


/* =========================================================
   GREGORIAN TO JALALI
========================================================= */

function gregorianToJalali(
gy,
gm,
gd
){

const gdm=[
0,
31,
59,
90,
120,
151,
181,
212,
243,
273,
304,
334
];

let jy;

if(gy>1600){

jy=979;
gy-=1600;

}

else{

jy=0;
gy-=621;

}

const gy2=
gm>2
?gy+1
:gy;

let days=
365*gy
+
Math.floor((gy2+3)/4)
-
Math.floor((gy2+99)/100)
+
Math.floor((gy2+399)/400)
-
80
+
gd
+
gdm[gm-1];

jy+=
33*
Math.floor(days/12053);

days%=12053;

jy+=
4*
Math.floor(days/1461);

days%=1461;

if(days>365){

jy+=
Math.floor((days-1)/365);

days=
(days-1)%365;

}

let jm;
let jd;

if(days<186){

jm=
1+
Math.floor(days/31);

jd=
1+
days%31;

}

else{

jm=
7+
Math.floor((days-186)/30);

jd=
1+
((days-186)%30);

}

return[
jy,
jm,
jd
];

}


/* =========================================================
   JALALI DATE
========================================================= */

function formatJalaliDate(
dateString
){

if(
!dateString
||
dateString==="---"
){

return"---";

}

const parts=
String(dateString)
.split("-");

if(parts.length!==3){

return dateString;

}

const j=
gregorianToJalali(
parseInt(parts[0]),
parseInt(parts[1]),
parseInt(parts[2])
);

return toPersianDigits(
j[0]+"/"+
String(j[1]).padStart(2,"0")+
"/"+
String(j[2]).padStart(2,"0")
);

}


/* =========================================================
   MONTH
========================================================= */

function getJalaliMonth(
month
){

const months=[
"فروردین",
"اردیبهشت",
"خرداد",
"تیر",
"مرداد",
"شهریور",
"مهر",
"آبان",
"آذر",
"دی",
"بهمن",
"اسفند"
];

return months[month-1]||"";

}


/* =========================================================
   FULL DATE
========================================================= */

function formatFullJalaliDate(
dateString
){

if(!dateString){

return"---";

}

const parts=
dateString.split("-");

if(parts.length!==3){

return dateString;

}

const j=
gregorianToJalali(
parseInt(parts[0]),
parseInt(parts[1]),
parseInt(parts[2])
);

return(
toPersianDigits(j[2])
+
" "
+
getJalaliMonth(j[1])
+
" "
+
toPersianDigits(j[0])
);

}


/* =========================================================
   UTC TIME
========================================================= */

function formatUTCtime(
value
){

if(!value){

return"---";

}

const text=
String(value)
.replace(/\D/g,"")
.padStart(4,"0");

return toPersianDigits(
text.substring(0,2)
+
":"
+
text.substring(2,4)
);

}


/* =========================================================
   IRAN TIME
========================================================= */

function formatIranTime(
value
){

if(!value){

return{
time:"---",
dayOffset:0
};

}

const text=
String(value)
.replace(/\D/g,"")
.padStart(4,"0");

const hour=
parseInt(
text.substring(0,2)
);

const minute=
parseInt(
text.substring(2,4)
);

let total=
hour*60+
minute+
210;

const dayOffset=
Math.floor(total/1440);

total%=1440;

const iranHour=
Math.floor(total/60);

const iranMinute=
total%60;

return{

time:
toPersianDigits(
String(iranHour).padStart(2,"0")
+
":"
+
String(iranMinute).padStart(2,"0")
),

dayOffset:
dayOffset

};

}


/* =========================================================
   ADD DAY
========================================================= */

function addOneDay(
dateString
){

const parts=
dateString.split("-");

const date=
new Date(
Date.UTC(
parseInt(parts[0]),
parseInt(parts[1])-1,
parseInt(parts[2])
)
);

date.setUTCDate(
date.getUTCDate()+1
);

const j=
gregorianToJalali(
date.getUTCFullYear(),
date.getUTCMonth()+1,
date.getUTCDate()
);

return(
toPersianDigits(j[2])
+
" "
+
getJalaliMonth(j[1])
+
" "
+
toPersianDigits(j[0])
);

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(
text
){

text=
text
.replace(/^\uFEFF/,"")
.trim();

if(!text){

return[];

}

const lines=
text.split(/\r?\n/);

if(lines.length<2){

return[];

}

const headers=
lines[0]
.split(",")
.map(
h=>
h.trim().toLowerCase()
);

const records=[];

for(
let i=1;
i<lines.length;
i++
){

if(
!lines[i].trim()
){

continue;

}

const values=
lines[i].split(",");

const row={};

for(
let j=0;
j<headers.length;
j++
){

row[
headers[j]
]=
values[j] !== undefined
?
values[j].trim()
:
"";

}

records.push(row);

}

return records;

}


/* =========================================================
   LOAD FILE
========================================================= */

function loadTextFile(
url
){

return fetch(
url+
"?v="+
Date.now()
)

.then(
response=>{

if(!response.ok){

throw new Error(
"فایل دریافت نشد"
);

}

return response.text();

}
);

}


/* =========================================================
   LOAD BOUNDARY
========================================================= */

async function loadBoundary(){

const text=
await loadTextFile(
BOUNDARY_FILE
);

const data=
JSON.parse(text);

let fars=null;

data.features.forEach(
feature=>{

const name=
String(
feature.properties?.shapeName||""
)
.trim()
.toLowerCase();

if(name==="fars"){

fars=
feature;

}

}
);

if(!fars){

throw new Error(
"استان فارس پیدا نشد."
);

}

farsBoundaryLayer=
L.geoJSON(
fars,
{

style:{

color:"#e74c3c",

weight:4,

opacity:1,

fillColor:"#e67e22",

fillOpacity:.035

}

}
).addTo(map);

const bounds=
farsBoundaryLayer.getBounds();

if(bounds.isValid()){

map.fitBounds(
bounds,
{
padding:[20,20]
}
);

}

}


/* =========================================================
   FIRE CSV
========================================================= */

async function loadFireCSV(
url
){

const text=
await loadTextFile(
url
);

return parseCSV(text);

}


/* =========================================================
   POPUP
========================================================= */

function createPopup(
fire
){

const iranTime=
formatIranTime(
fire.acq_time
);

let localDate=
formatFullJalaliDate(
fire.acq_date
);

if(
iranTime.dayOffset===1
){

localDate=
addOneDay(
fire.acq_date
);

}

return`

<div class="popup">

<h3>
🔥 حریق استان فارس
</h3>

<b>سنجنده:</b>
${fire.detected_sensor||"---"}

<br>

<b>ماهواره:</b>
${fire.satellite||"---"}

<br>

<b>تاریخ ایران:</b>
${localDate}

<br>

<b>تاریخ UTC:</b>
${fire.acq_date||"---"}

<br>

<b>ساعت ایران:</b>
${iranTime.time}

<br>

<b>ساعت UTC:</b>
${formatUTCtime(
fire.acq_time
)}

<br>

<b>FRP:</b>
${fire.frp||"---"} MW

<br>

<b>Confidence:</b>
${fire.confidence||"---"}

<br>

<b>Brightness:</b>
${fire.brightness||"---"}

<br>

<b>روز/شب:</b>
${fire.daynight||"---"}

<br>

<b>مختصات:</b>
${parseFloat(fire.latitude).toFixed(5)}
,
${parseFloat(fire.longitude).toFixed(5)}

</div>

`;

}


/* =========================================================
   DISPLAY FIRES
========================================================= */

function displayFires(
fires,
fitBoundary=false
){

fireLayer.clearLayers();

let viirs=0;

let modis=0;

let latestDate="---";

fires.forEach(
fire=>{

const lat=
parseFloat(
fire.latitude
);

const lon=
parseFloat(
fire.longitude
);

if(
isNaN(lat)
||
isNaN(lon)
){

return;

}

const sensor=
String(
fire.detected_sensor||
fire.instrument||
""
)
.trim()
.toUpperCase();

if(
sensor==="VIIRS"
){

viirs++;

}

if(
sensor==="MODIS"
){

modis++;

}

if(
fire.acq_date
&&
(
latestDate==="---"
||
fire.acq_date>latestDate
)
){

latestDate=
fire.acq_date;

}

let color=
"#8e24aa";

if(
sensor==="VIIRS"
){

color=
"#ef233c";

}

if(
sensor==="MODIS"
){

color=
"#f39c12";

}

const marker=
L.circleMarker(
[lat,lon],
{

radius:9,

color:"#6d1a00",

fillColor:color,

fillOpacity:.95,

weight:2

}
);

marker.bindPopup(
createPopup(
fire
)
);

fireLayer.addLayer(
marker
);

}
);

document.getElementById(
"fireCount"
).innerText=
toPersianDigits(
fires.length
);

document.getElementById(
"viirsCount"
).innerText=
toPersianDigits(
viirs
);

document.getElementById(
"modisCount"
).innerText=
toPersianDigits(
modis
);

document.getElementById(
"fireDate"
).innerText=
formatJalaliDate(
latestDate
);

document.getElementById(
"archiveCount"
).innerText=
toPersianDigits(
fires.length
)
+
" حریق";

if(
fitBoundary
&&
farsBoundaryLayer
){

map.fitBounds(
farsBoundaryLayer.getBounds(),
{
padding:[20,20]
}
);

}

}


/* =========================================================
   ARCHIVE
========================================================= */

async function loadArchiveIndex(){

const text=
await loadTextFile(
ARCHIVE_INDEX
);

const index=
JSON.parse(text);

archiveDates=
index
.map(

)
.filter(
Boolean
)
.sort();

document.getElementById(

0;

archiveDates.length-1,
0
);

Math.max(
archiveDates.length-1,
0
);

}

/* =========================================================
   UPDATE TIMER
========================================================= */

async function loadUpdateInfo(){

try{

const text=
await loadTextFile(
UPDATE_INFO
);

const info=
JSON.parse(text);

const timestamp=
Number(
info.updated_at_timestamp
);

if(
!Number.isFinite(timestamp)
||
timestamp<=0
){

throw new Error(
"Invalid timestamp"
);

}

lastUpdateTimestamp=
timestamp*
1000;

updateLastUpdateLabel();

}

catch(error){

console.error(
error
);

document.getElementById(
"lastUpdate"
).innerText=
"آخرین به‌روزرسانی: در انتظار اولین اجرای موفق";

}

}


/* =========================================================
   TIMER LABEL
========================================================= */

function updateLastUpdateLabel(){

const element=
document.getElementById(
"lastUpdate"
);

if(
!lastUpdateTimestamp
){

element.innerText=
"آخرین به‌روزرسانی: در انتظار اطلاعات";

return;

}

const elapsed=
Math.max(
0,
Date.now()
-
lastUpdateTimestamp
);

const seconds=
Math.floor(
elapsed/1000
);

const minutes=
Math.floor(
seconds/60
);

const hours=
Math.floor(
minutes/60
);

const days=
Math.floor(
hours/24
);

let text=
"آخرین به‌روزرسانی: ";

if(
days>0
){

text+=
toPersianDigits(days)
+
" روز پیش";

}

else if(
hours>0
){

text+=
toPersianDigits(hours)
+
" ساعت و "
+
toPersianDigits(
minutes%60
)
+
" دقیقه پیش";

}

else if(
minutes>0
){

text+=
toPersianDigits(minutes)
+
" دقیقه و "
+
toPersianDigits(
seconds%60
)
+
" ثانیه پیش";

}

else{

text+=
toPersianDigits(seconds)
+
" ثانیه پیش";

}

element.innerText=
text;

}

setInterval(
updateLastUpdateLabel,
1000
);

);

error.message
);

}

}

initializeApp();
