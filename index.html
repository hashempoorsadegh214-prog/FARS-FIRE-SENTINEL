<style>

    --red-light:#d41414;

*{

}

html,
body{

body{

/* =========================
   HEADER
========================= */

header{
    position:relative;
    z-index:5000;

.header-content{

.header-logo{

    height:68px;

    object-fit:contain;

        brightness(0)

}

.title h1{
    margin:0;

    font-family:
        "B Titr",
        "BTitr",
        Tahoma,
        Arial,
        sans-serif;

    font-size:23px;
    line-height:1.2;

    color:#fff;
}

.title p{
    margin:3px 0 0;

        rgba(255,255,255,.94);
}

.header-buttons{
    position:absolute;

    right:10px;
    top:50%;

    transform:translateY(-50%);

    display:flex;
    gap:4px;
}

.header-btn{
    width:34px;
    height:34px;

    border:0;
    border-radius:8px;

    background:
        rgba(255,255,255,.18);

    color:#fff;

    cursor:pointer;

    font-size:16px;
}

.header-btn:hover{
    background:
        rgba(255,255,255,.30);
}


/* =========================
   MAP
========================= */

#map{
    position:absolute;

    top:80px;
    left:8px;
    right:8px;
    bottom:8px;

    border:1px solid #d7dde1;
    border-radius:10px;

    overflow:hidden;

    box-shadow:
        0 4px 16px rgba(0,0,0,.12);
}


/* =========================
   CONTROL PANEL
========================= */

.control-panel{
    position:absolute;

    top:92px;
    right:18px;

    width:230px;

    z-index:4000;

    padding:7px;

    border:1px solid var(--border);
    border-radius:12px;

    background:var(--panel);

    box-shadow:
        0 4px 14px rgba(0,0,0,.16);
}

.control-panel *,
.update-box *,
.slider-box *{

    font-family:
        "B Nazanin",
        "BNazanin",
        Tahoma,
        Arial,
        sans-serif !important;
}


/* COUNT */

.fire-count{
    margin-bottom:6px;
    padding:6px;

    text-align:center;

    border:1px solid #d9aaaa;
    border-radius:8px;

    background:#fff4f4;

    color:var(--red-dark);

    font-size:16px;
    font-weight:bold;

    line-height:1.2;
}

.fire-count-number{
    font-size:22px;

}


/* MODE */

.mode-btn{
    width:100%;

    margin-bottom:5px;
    padding:6px 8px;

    border:0;
    border-radius:8px;

    background:#f0f2f4;

    color:#344047;

    font-size:15px;
    font-weight:bold;

    text-align:right;

    cursor:pointer;
}

.mode-btn.active{
    background:
        linear-gradient(

            #d41414 55%,
            #980000

    box-shadow:
        0 2px 8px rgba(114,0,0,.35);
}


/* AREAS */

.area-box{

    padding-top:6px;

        1px solid #e6eaed;
}

.area-title{
    margin-bottom:4px;

    font-size:14px;
    font-weight:bold;
}

.area-option{

    font-size:14px;
    font-weight:bold;

}

.area-option input{
    width:14px;
    height:14px;

}


/* SENSOR */

.sensor-box{
    position:absolute;

    top:92px;
    left:50%;

    transform:translateX(-50%);

    z-index:4000;

    align-items:center;

    gap:12px;

    border:1px solid var(--border);
    border-radius:10px;

    background:var(--panel);

}

.sensor-item{
    display:flex;
    align-items:center;

}

.sensor-dot{

    height:9px;

    border-radius:50%;
    border:1px solid #555;
}


/* STATUS */

.update-box{
    position:absolute;

    right:9px;
    bottom:9px;

    z-index:4000;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

        0 4px 14px rgba(0,0,0,.16);

    font-weight:bold;

.update-row{
    display:inline;

    color:var(--red-dark);

}

.slider-box{

<script>

/* =========================
   CONFIG
========================= */

const CONFIG = {

    boundary:
        "fars.geojson",

    protected:
        "protected_areas.geojson",

    hunting:
        "hunting_banned.geojson",

    archiveIndex:
        "archive/index.json",

    fallbackCsv:
        "fires.csv",

    updateInfo:
        "update-info.json"

};


/* =========================
   STATE
========================= */

const state = {

    map:null,

    lightMap:null,

    darkMap:null,

    boundaryLayer:null,

    protectedLayer:null,

    huntingLayer:null,

    protectedGeoJSON:null,

    huntingGeoJSON:null,

    fireLayer:null,

    fires:[],

    archiveDates:[],

    archiveCache:{},

    archiveHeaders:[],

    mode:"24h",

    areaFilter:"none",

    systemTimestamp:null

};


/* =========================
   HELPERS
========================= */

const $ =
    id =>
        document.getElementById(id);


async function getText(
    url
){

    const response =
        await fetch(
            url +
            "?v=" +
            Date.now()
        );


    if(
        !response.ok
    ){

        throw new Error(
            "خطا در دریافت فایل: "+
            url
        );

    }


    return response.text();

}


function fa(
    value
){

    return String(value)
        .replace(/0/g,"۰")
        .replace(/1/g,"۱")
        .replace(/2/g,"۲")
        .replace(/3/g,"۳")
        .replace(/4/g,"۴")
        .replace(/5/g,"۵")
        .replace(/6/g,"۶")
        .replace(/7/g,"۷")
        .replace(/8/g,"۸")
        .replace(/9/g,"۹");

}


/* =========================
   CSV
========================= */

function parseCSV(
    text
){

    text =
        text
            .replace(
                /^\uFEFF/,
                ""
            )
            .trim();


    if(
        !text
    ){

        return {
            headers:[],
            rows:[]
        };

    }


    const lines =
        text.split(
            /\r?\n/
        );


    const headers =
        lines[0]
            .split(",")
            .map(
                h =>
                    h.trim().toLowerCase()
            );


    const rows=[];


    for(
        let i=1;
        i<lines.length;
        i++
    ){

        if(
            !lines[i].trim()
        ){

            continue;

        }


        const values =
            lines[i].split(",");


        const row={};


        headers.forEach(
            (
                header,
                index
            ) => {

                row[header] =
                    values[index] !== undefined
                    ?
                    values[index].trim()
                    :
                    "";

            }
        );


        rows.push(row);

    }


    return {
        headers,
        rows
    };

}


/* =========================
   JALALI
========================= */

function gregorianToJalali(
    gy,
    gm,
    gd
){

    const gdm=[
        0,31,59,90,120,151,
        181,212,243,273,304,334
    ];


    let jy;


    if(
        gy>1600
    ){

        jy=979;
        gy-=1600;

    }else{

        jy=0;
        gy-=621;

    }


    const gy2 =
        gm>2
        ?
        gy+1
        :
        gy;


    let days =
        365*gy
        +
        Math.floor((gy2+3)/4)
        -
        Math.floor((gy2+99)/100)
        +
        Math.floor((gy2+399)/400)
        -
        80
        +
        gd
        +
        gdm[gm-1];


    jy +=
        33*
        Math.floor(days/12053);


    days %=12053;


    jy +=
        4*
        Math.floor(days/1461);


    days %=1461;


    if(
        days>365
    ){

        jy +=
            Math.floor((days-1)/365);

        days =
            (days-1)%365;

    }


    let jm;
    let jd;


    if(
        days<186
    ){

        jm =
            1+
            Math.floor(days/31);

        jd =
            1+
            days%31;

    }else{

        jm =
            7+
            Math.floor((days-186)/30);

        jd =
            1+
            (days-186)%30;

    }


    return [
        jy,
        jm,
        jd
    ];

}


function shamsiDate(
    date
){

    if(
        !date
    ){

        return "---";

    }


    const parts =
        String(date).split("-");


    if(
        parts.length!==3
    ){

        return date;

    }


    const j =
        gregorianToJalali(
            Number(parts[0]),
            Number(parts[1]),
            Number(parts[2])
        );


    const months=[
        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند"
    ];


    return (
        fa(j[2])+
        " "+
        months[j[1]-1]+
        " "+
        fa(j[0])
    );

}


/* =========================
   TIME
========================= */

function fireUTCDateTime(
    fire
){

    if(
        !fire.acq_date ||
        !fire.acq_time
    ){

        return null;

    }


    const d =
        fire.acq_date.split("-");


    const t =
        String(
            fire.acq_time
        )
        .replace(/\D/g,"")
        .padStart(4,"0");


    return new Date(
        Date.UTC(
            Number(d[0]),
            Number(d[1])-1,
            Number(d[2]),
            Number(t.slice(0,2)),
            Number(t.slice(2,4)),
            0
        )
    );

}


function iranTime(
    fire
){

    const utc =
        fireUTCDateTime(fire);


    if(
        !utc
    ){

        return "---";

    }


    const iran =
        new Date(
            utc.getTime()+
            3.5*60*60*1000
        );


    return (
        String(
            iran.getUTCHours()
        ).padStart(2,"0")+
        ":"+
        String(
            iran.getUTCMinutes()
        ).padStart(2,"0")
    );

}


function getTimeLabel(
    fire
){

    const time =
        iranTime(fire);


    if(
        time==="---"
    ){

        return "---";

    }


    const hour =
        Number(
            time.slice(0,2)
        );


    if(
        hour<6
    ){

        return "بامداد";

    }


    const dn =
        String(
            fire.daynight||""
        )
        .trim()
        .toUpperCase();


    if(
        dn==="D"
    ){

        return "روز";

    }


    if(
        dn==="N"
    ){

        return "شب";

    }


    return "---";

}


/* =========================
   SENSOR
========================= */

function getSensor(
    fire
){

    const value =
        String(
            fire.detected_sensor||
            fire.instrument||
            ""
        )
        .trim()
        .toUpperCase();


    if(
        value.includes("VIIRS")
    ){

        return "VIIRS";

    }


    if(
        value.includes("MODIS")
    ){

        return "MODIS";

    }


    return "UNKNOWN";

}


function sensorColor(
    sensor
){

    return sensor==="VIIRS"
        ? "#ff1744"
        : sensor==="MODIS"
        ? "#ff9800"
        : "#8e24aa";

}

function getTimeFilteredFires(){

    const now=
        new Date();


    const hours=
        state.mode==="24h"
        ?

        :
        120;


    const start=
        new Date(
            now.getTime()-
            hours*3600000
        );


    return state.fires.filter(
        fire=>{

            const t=
                fireUTCDateTime(
                    fire
                );


            return (
                t &&
                t>=start &&
                t<=now
            );

        }
    );

}


/* =========================
   POINT IN POLYGON
========================= */

function pointInRing(
    point,
    ring
){

    let inside=false;

    const x=point[0];
    const y=point[1];


    for(
        let i=0,
            j=ring.length-1;

        i<ring.length;

        j=i++
    ){

        const xi=ring[i][0];
        const yi=ring[i][1];

        const xj=ring[j][0];
        const yj=ring[j][1];


        const hit=
            (
                yi>y
            ) !==
            (
                yj>y
            )
            &&
            x<
            (
                (xj-xi)*
                (y-yi)/
                (yj-yi)+
                xi
            );


        if(hit){

            inside=!inside;

        }

    }


    return inside;

}


function pointInPolygon(
    point,
    rings
){

    if(
        !rings ||
        !rings.length
    ){

        return false;

    }


    if(
        !pointInRing(
            point,
            rings[0]
        )
    ){

        return false;

    }


    for(
        let i=1;
        i<rings.length;
        i++
    ){

        if(
            pointInRing(
                point,
                rings[i]
            )
        ){

            return false;

        }

    }


    return true;

}


/* =========================
   REGION
========================= */

function findRegionName(
    properties
){

    if(
        !properties
    ){

        return "";

    }


    const keys=[
        "name",
        "NAME",
        "Name",
        "نام",
        "نام منطقه",
        "نام_منطقه",
        "area_name",
        "AREA_NAME",
        "title",
        "Title",
        "region",
        "Region"
    ];


    for(
        const key of keys
    ){

        if(
            properties[key]!==undefined &&
            properties[key]!==null &&
            String(
                properties[key]
            ).trim()
        ){

            return String(
                properties[key]
            ).trim();

        }

    }


    return "";

}


function pointInGeoJSON(
    lat,
    lon,
    geojson
){

    if(
        !geojson
    ){

        return [];

    }


    const result=[];


    const features =
        geojson.type==="FeatureCollection"
        ?
        geojson.features
        :
        geojson.type==="Feature"
        ?
        [geojson]
        :
        [];


    for(
        const feature of features
    ){

        if(
            !feature.geometry
        ){

            continue;

        }


        const geometry =
            feature.geometry;


        let inside=false;


        if(
            geometry.type==="Polygon"
        ){

            inside=
                pointInPolygon(
                    [lon,lat],
                    geometry.coordinates
                );

        }


        if(
            geometry.type==="MultiPolygon"
        ){

            for(
                const polygon
                of geometry.coordinates
            ){

                if(
                    pointInPolygon(
                        [lon,lat],
                        polygon
                    )
                ){

                    inside=true;
                    break;

                }

            }

        }


        if(
            inside
        ){

            const name=
                findRegionName(
                    feature.properties
                );


            if(
                name &&
                !result.includes(name)
            ){

                result.push(name);

            }

            break;

        }

    }


    return result;

}


/* =========================
   FILTER
========================= */

function applyAreaFilter(
    fires
){

    if(
        state.areaFilter==="none"
    ){

        return fires;

    }


    const geojson =
        state.areaFilter==="protected"
        ?
        state.protectedGeoJSON
        :
        state.huntingGeoJSON;


    if(
        !geojson
    ){

        return [];

    }


    return fires.filter(
        fire=>{

            const lat=
                Number(fire.latitude);


            const lon=
                Number(fire.longitude);


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lon)
            ){

                return false;

            }


            return (
                pointInGeoJSON(
                    lat,
                    lon,
                    geojson
                ).length>0
            );

        }
    );

}


function getVisibleFires(){

    return applyAreaFilter(
        getTimeFilteredFires()
    );

}

   RENDER
========================= */

function renderFires(
    fires
){

    state.fireLayer.clearLayers();


    const fragment=[];


    fires.forEach(
        fire=>{

            const lat=
                Number(fire.latitude);


            const lon=
                Number(fire.longitude);


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lon)
            ){

                return;

            }


            fragment.push(
                [
                    fire,
                    lat,
                    lon
                ]
            );

        }
    );


    fragment.forEach(
        item=>{

            const fire=item[0];
            const lat=item[1];
            const lon=item[2];

            const sensor=
                getSensor(fire);


            const marker=
                L.circleMarker(
                    [lat,lon],
                    {
                        pane:"firePane",
                        radius:8,
                        color:"#6d0000",
                        weight:2,
                        fillColor:
                            sensorColor(sensor),
                        fillOpacity:.95
                    }
                );


            marker.bindPopup(
                createPopup(
                    fire,
                    sensor
                )
            );


            marker.on(
                "popupopen",
                event=>{

                    updatePopupRegion(
                        fire,
                        event.popup
                    );

                }
            );


            marker.addTo(
                state.fireLayer
            );

        }
    );

}

        .checked=

    $("huntingFilter")
        .checked=

    if(
        type==="protected"

function getLatestObservation(){

    let latest=null;


    state.fires.forEach(
        fire=>{

            const time=
                fireUTCDateTime(fire);


            if(
                !time
            ){

                return;

            }


            if(
                !latest ||
                time>latest
            ){

                latest=time;

            }

        }
    );


    return latest;

}


function ageText(
    timestamp
){

    if(
        !timestamp
    ){

        return "در انتظار اطلاعات";

    }


    const seconds=
        Math.max(
            0,
            Math.floor(
                (Date.now()-timestamp)/1000
            )
        );


    const hours=
        Math.floor(
            seconds/3600
        );


    const minutes=
        Math.floor(
            (seconds%3600)/60
        );


    const sec=
        seconds%60;


    if(
        hours>0
    ){

        return (
            fa(hours)+
            " ساعت و "+
            fa(minutes)+
            " دقیقه پیش"
        );

    }


    return (
        fa(minutes)+
        " دقیقه و "+
        fa(sec)+
        " ثانیه پیش"
    );

}

/* =========================

========================= */

function escapeXml(
    value
){

    return String(
        value??""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&apos;");

}


function exportExcel(){

    const fires=
        applyAreaFilter(
            getTimeFilteredFires()
        );


    if(
        !fires.length
    ){

        alert(
            "برای بازه انتخاب‌شده داده‌ای وجود ندارد."
        );

        return;

    }


    const headers=
        state.archiveHeaders.length
        ?
        state.archiveHeaders
        :
        Object.keys(fires[0]);


    let xml=
        '<?xml version="1.0"?>'+
        '<Workbook '+
        'xmlns="urn:schemas-microsoft-com:office:spreadsheet" '+
        'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
        '<Worksheet ss:Name="FireData">'+
        '<Table>';


    xml+="<Row>";


    headers.forEach(
        header=>{

            xml+=
                "<Cell>"+
                '<Data ss:Type="String">'+
                escapeXml(header)+
                "</Data>"+
                "</Cell>";

        }
    );


    xml+="</Row>";


    fires.forEach(
        fire=>{

            xml+="<Row>";


            headers.forEach(
                header=>{

                    xml+=
                        "<Cell>"+
                        '<Data ss:Type="String">'+
                        escapeXml(
                            fire[header]
                        )+
                        "</Data>"+
                        "</Cell>";

                }
            );


            xml+="</Row>";

        }
    );


    xml+=
        "</Table>"+
        "</Worksheet>"+
        "</Workbook>";


    const blob=
        new Blob(
            [xml],
            {
                type:
                    "application/vnd.ms-excel"
            }
        );


    const link=
        document.createElement("a");


    link.href=
        URL.createObjectURL(blob);


    link.download=
        "fires_"+
        new Date()
            .toISOString()
            .slice(0,10)+
        ".xls";


    link.click();

}

async function loadHtml2Canvas(){

    await new Promise(
        (resolve,reject)=>{

            script.onload=resolve;
            script.onerror=reject;

            document.head.appendChild(
                script
            );

        }
    );


    return window.html2canvas;

}


function calculateFireCenter(
    fires
){

    if(
        !fires.length
    ){

        return null;

    }


    let lat=0;
    let lon=0;


    fires.forEach(
        fire=>{

            lat +=
                Number(
                    fire.latitude
                );

            lon +=
                Number(
                    fire.longitude
                );

        }
    );


    return {
        lat:
            lat/fires.length,

        lon:
            lon/fires.length
    };

}


async function createRegionReport(){

    let html2canvas;


    try{

        html2canvas=
            await loadHtml2Canvas();

    }catch(error){

        alert(
            "ابزار تهیه گزارش بارگذاری نشد."
        );

        return;

    }


    const fires=
        getVisibleFires();


    if(
        !fires.length
    ){

        alert(
            "در محدوده فعلی رخدادی برای گزارش وجود ندارد."
        );

        return;

    }


    const center=
        calculateFireCenter(
            fires
        );


    const mapElement=
        document.getElementById(
            "map"
        );


    const canvas=
        await html2canvas(
            mapElement,
            {
                backgroundColor:"#fff",

                useCORS:true,

                allowTaint:false,

                logging:false,

                scale:
                    Math.min(
                        window.devicePixelRatio||1,
                        1.3
                    )
            }
        );


    const ctx=
        canvas.getContext(
            "2d"
        );


    const mapRect=
        mapElement.getBoundingClientRect();


    const scaleX=
        canvas.width/
        mapRect.width;


    const scaleY=
        canvas.height/
        mapRect.height;


    const point=
        state.map.latLngToContainerPoint(
            [
                center.lat,
                center.lon
            ]
        );


    const x=
        point.x*scaleX;


    const y=
        point.y*scaleY;


    /* ستاره قرمز */

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        -Math.PI/2
    );


    const outer=
        14*
        Math.max(
            scaleX,
            scaleY
        );


    const inner=
        outer*.45;


    ctx.beginPath();


    for(
        let i=0;
        i<10;
        i++
    ){

        const r=
            i%2===0
            ?
            outer
            :
            inner;


        const a=
            i*Math.PI/5;


        const px=
            Math.cos(a)*r;


        const py=
            Math.sin(a)*r;


        if(
            i===0
        ){

            ctx.moveTo(
                px,
                py
            );

        }else{

            ctx.lineTo(
                px,
                py
            );

        }

    }


    ctx.closePath();


    ctx.fillStyle=
        "#d50000";


    ctx.fill();


    ctx.lineWidth=
        2;


    ctx.strokeStyle=
        "#ffffff";


    ctx.stroke();


    ctx.restore();


    /* سربرگ گزارش */

    const headerHeight=
        78;


    const report=
        document.createElement(
            "canvas"
        );


    report.width=
        canvas.width;


    report.height=
        canvas.height+
        headerHeight;


    const rctx=
        report.getContext(
            "2d"
        );


    rctx.fillStyle=
        "#ffffff";


    rctx.fillRect(
        0,
        0,
        report.width,
        report.height
    );


    rctx.fillStyle=
        "#b71c1c";


    rctx.fillRect(
        0,
        0,
        report.width,
        headerHeight
    );


    rctx.drawImage(
        canvas,
        0,
        headerHeight
    );


    rctx.direction=
        "rtl";


    rctx.textAlign=
        "right";


    rctx.fillStyle=
        "#ffffff";


    rctx.font=
        "bold 23px Tahoma";


    rctx.fillText(
        "سامانه پایش و مدیریت داده‌های حریق",
        report.width-20,
        30
    );


    rctx.font=
        "13px Tahoma";


    rctx.fillText(
        "مرکز رخدادهای شناسایی‌شده: "+
        fires.length+
        " رخداد | ستاره قرمز = مرکز رخدادها",
        report.width-20,
        56
    );


    const link=
        document.createElement(
            "a"
        );


    link.download=
        "fire_report_"+
        new Date()
            .toISOString()
            .slice(0,10)+
        ".png";


    link.href=
        report.toDataURL(
            "image/png"
        );


    link.click();

}

function toggleNight(){

    const enabled=
        document.body
        .classList
        .toggle("night");


    if(
        enabled
    ){

        state.map.removeLayer(
            state.lightMap
        );

        state.darkMap.addTo(
            state.map
        );

        $("nightBtn")
            .textContent="☀️";


        localStorage.setItem(
            "fars-night",
            "1"
        );

    }else{

        state.map.removeLayer(
            state.darkMap
        );

        state.lightMap.addTo(
            state.map
        );

        $("nightBtn")
            .textContent="🌙";


        localStorage.setItem(
            "fars-night",
            "0"
        );

    }

}


function restoreNight(){

    if(
        localStorage.getItem(
            "fars-night"
        )==="1"
    ){

        document.body
            .classList
            .add("night");


        state.map.removeLayer(
            state.lightMap
        );


        state.darkMap.addTo(
            state.map
        );


        $("nightBtn")
            .textContent="☀️";

    }

}
