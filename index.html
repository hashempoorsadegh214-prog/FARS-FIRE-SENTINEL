<script>

/* =====================================================
   FILES
===================================================== */

const BOUNDARY_FILE =
    "geoBoundaries-IRN-ADM1.geojson";

const ARCHIVE_INDEX =
    "archive/index.json";

const UPDATE_INFO =
    "update-info.json";


/* =====================================================
   MAP
===================================================== */

const map =
    L.map("map");


const lightMap =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 18,
            attribution:
                "© OpenStreetMap contributors"
        }
    );


const darkMap =
    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            maxZoom: 19,
            attribution:
                "© OpenStreetMap © CARTO"
        }
    );


lightMap.addTo(map);


map.setView(
    [29.6, 52.5],
    8
);


/* =====================================================
   VARIABLES
===================================================== */

let boundaryLayer =
    null;

let archiveDates =
    [];

let fires =
    [];

let updateTimestamp =
    null;


/* =====================================================
   FIRE LAYER
===================================================== */

const fireLayer =
    L.layerGroup().addTo(
        map
    );


/* =====================================================
   PERSIAN DIGITS
===================================================== */

function fa(value) {

    return String(value)
        .replace(/0/g,"۰")
        .replace(/1/g,"۱")
        .replace(/2/g,"۲")
        .replace(/3/g,"۳")
        .replace(/4/g,"۴")
        .replace(/5/g,"۵")
        .replace(/6/g,"۶")
        .replace(/7/g,"۷")
        .replace(/8/g,"۸")
        .replace(/9/g,"۹");
}


/* =====================================================
   GREGORIAN TO JALALI
===================================================== */

function gregorianToJalali(gy,gm,gd) {

    const gdm = [
        0,31,59,90,120,151,
        181,212,243,273,304,334
    ];

    let jy;

    if (gy > 1600) {
        jy = 979;
        gy -= 1600;
    } else {
        jy = 0;
        gy -= 621;
    }

    const gy2 =
        gm > 2
        ? gy + 1
        : gy;

    let days =
        365 * gy
        +
        Math.floor((gy2 + 3) / 4)
        -
        Math.floor((gy2 + 99) / 100)
        +
        Math.floor((gy2 + 399) / 400)
        -
        80
        +
        gd
        +
        gdm[gm - 1];

    jy +=
        33 * Math.floor(days / 12053);

    days %= 12053;

    jy +=
        4 * Math.floor(days / 1461);

    days %= 1461;

    if (days > 365) {

        jy +=
            Math.floor((days - 1) / 365);

        days =
            (days - 1) % 365;
    }

    let jm;
    let jd;

    if (days < 186) {

        jm =
            1 +
            Math.floor(days / 31);

        jd =
            1 +
            days % 31;

    } else {

        jm =
            7 +
            Math.floor(
                (days - 186) / 30
            );

        jd =
            1 +
            ((days - 186) % 30);
    }

    return [
        jy,
        jm,
        jd
    ];
}


/* =====================================================
   SHAMSI DATE
===================================================== */

function shamsiDate(dateString) {

    if (!dateString) {
        return "---";
    }

    const p =
        String(dateString).split("-");

    if (p.length !== 3) {
        return dateString;
    }

    const j =
        gregorianToJalali(
            parseInt(p[0],10),
            parseInt(p[1],10),
            parseInt(p[2],10)
        );

    const months = [
        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند"
    ];

    return (
        fa(j[2])
        +
        " "
        +
        months[j[1] - 1]
        +
        " "
        +
        fa(j[0])
    );
}


/* =====================================================
   GET TEXT
===================================================== */

async function getText(url) {

    const response =
        await fetch(
            url + "?v=" + Date.now()
        );

    if (!response.ok) {
        throw new Error(
            "فایل دریافت نشد: " + url
        );
    }

    return await response.text();
}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(text) {

    text =
        text
        .replace(/^\uFEFF/,"")
        .trim();

    if (!text) {
        return [];
    }

    const lines =
        text.split(/\r?\n/);

    if (lines.length < 2) {
        return [];
    }

    const headers =
        lines[0]
        .split(",")
        .map(
            h =>
                h.trim().toLowerCase()
        );

    const result = [];

    for (
        let i = 1;
        i < lines.length;
        i++
    ) {

        if (!lines[i].trim()) {
            continue;
        }

        const values =
            lines[i].split(",");

        const row = {};

        for (
            let j = 0;
            j < headers.length;
            j++
        ) {

            row[headers[j]] =
                values[j] !== undefined
                ? values[j].trim()
                : "";
        }

        result.push(row);
    }

    return result;
}


/* =====================================================
   LOAD BOUNDARY
   جدا از داده
===================================================== */

async function loadBoundary() {

    try {

        const text =
            await getText(
                BOUNDARY_FILE
            );

        const data =
            JSON.parse(text);

        let fars = null;

        for (
            const feature
            of
            data.features || []
        ) {

            const name =
                String(
                    feature.properties?.shapeName
                    ||
                    ""
                )
                .trim()
                .toLowerCase();

            if (name === "fars") {

                fars =
                    feature;

                break;
            }
        }

        if (!fars) {
            throw new Error(
                "فارس پیدا نشد"
            );
        }

        boundaryLayer =
            L.geoJSON(
                fars,
                {
                    style: {
                        color: "#ef5350",
                        weight: 3,
                        opacity: .95,
                        fillOpacity: .02
                    }
                }
            ).addTo(map);

        const bounds =
            boundaryLayer.getBounds();

        if (bounds.isValid()) {

            map.fitBounds(
                bounds,
                {
                    padding: [15,15]
                }
            );
        }

    } catch (error) {

        console.warn(
            "مرز بارگذاری نشد:",
            error
        );
    }
}


/* =====================================================
   ARCHIVE INDEX
===================================================== */

async function loadArchiveIndex() {

    const text =
        await getText(
            ARCHIVE_INDEX
        );

    const index =
        JSON.parse(text);

    archiveDates =
        index
        .map(
            item => item.date
        )
        .filter(Boolean)
        .sort();

    const slider =
        document.getElementById(
            "archiveSlider"
        );

    slider.min = 0;

    slider.max =
        Math.max(
            archiveDates.length - 1,
            0
        );

    slider.value =
        Math.max(
            archiveDates.length - 1,
            0
        );

    updateSliderDate();
}


/* =====================================================
   LOAD ARCHIVES
===================================================== */

async function loadArchives() {

    fires = [];

    for (
        const date
        of
        archiveDates
    ) {

        try {

            const text =
                await getText(
                    "archive/"
                    +
                    date
                    +
                    ".csv"
                );

            const rows =
                parseCSV(
                    text
                );

            rows.forEach(
                row => {

                    row.archive_date =
                        date;

                    fires.push(row);
                }
            );

        } catch (error) {

            console.warn(
                "آرشیو در دسترس نیست:",
                date
            );
        }
    }
}


/* =====================================================
   TODAY IRAN
===================================================== */

function todayIranDate() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: "Asia/Tehran",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(
        new Date()
    );
}


/* =====================================================
   FIRMS UTC TIME
===================================================== */

function fireUTCDateTime(fire) {

    if (
        !fire.acq_date
        ||
        !fire.acq_time
    ) {
        return null;
    }

    const parts =
        fire.acq_date.split("-");

    let time =
        String(
            fire.acq_time
        )
        .replace(/\D/g,"")
        .padStart(4,"0");

    const hour =
        parseInt(
            time.substring(0,2),
            10
        );

    const minute =
        parseInt(
            time.substring(2,4),
            10
        );

    return new Date(
        Date.UTC(
            parseInt(parts[0],10),
            parseInt(parts[1],10) - 1,
            parseInt(parts[2],10),
            hour,
            minute,
            0
        )
    );
}


/* =====================================================
   IRAN TIME 24H
===================================================== */

function iranTime(fire) {

    if (fire.iran_time) {

        return format24(
            fire.iran_time
        );
    }

    const utc =
        fireUTCDateTime(
            fire
        );

    if (!utc) {
        return "---";
    }

    const iran =
        new Date(
            utc.getTime()
            +
            (
                3.5
                *
                60
                *
                60
                *
                1000
            )
        );

    return (
        String(
            iran.getUTCHours()
        ).padStart(2,"0")
        +
        ":"
        +
        String(
            iran.getUTCMinutes()
        ).padStart(2,"0")
    );
}


/* =====================================================
   FORMAT 24H
===================================================== */

function format24(value) {

    const t =
        String(value)
        .replace(/\D/g,"")
        .padStart(4,"0");

    return (
        t.substring(0,2)
        +
        ":"
        +
        t.substring(2,4)
    );
}


/* =====================================================
   FILTERS
===================================================== */

function filteredFires(mode) {

    const now =
        new Date();


    /* TODAY */

    if (
        mode === "today"
    ) {

        const today =
            todayIranDate();

        return fires.filter(
            fire => {

                const date =
                    fire.iran_date
                    ||
                    fire.archive_date;

                const time =
                    fireUTCDateTime(
                        fire
                    );

                return (
                    date === today
                    &&
                    time
                    &&
                    time <= now
                );
            }
        );
    }


    /* 24 HOURS */

    if (
        mode === "24h"
    ) {

        const start =
            new Date(
                now.getTime()
                -
                24 * 60 * 60 * 1000
            );

        return fires.filter(
            fire => {

                const time =
                    fireUTCDateTime(
                        fire
                    );

                return (
                    time
                    &&
                    time >= start
                    &&
                    time <= now
                );
            }
        );
    }


    /* 5 DAYS */

    if (
        mode === "5days"
    ) {

        const start =
            new Date(
                now.getTime()
                -
                5 * 24 * 60 * 60 * 1000
            );

        return fires.filter(
            fire => {

                const time =
                    fireUTCDateTime(
                        fire
                    );

                return (
                    time
                    &&
                    time >= start
                    &&
                    time <= now
                );
            }
        );
    }


    return [];
}


/* =====================================================
   DISPLAY
===================================================== */

function showFires(
    list
) {

    fireLayer.clearLayers();

    list.forEach(
        fire => {

            const lat =
                parseFloat(
                    fire.latitude
                );

            const lon =
                parseFloat(
                    fire.longitude
                );

            if (
                isNaN(lat)
                ||
                isNaN(lon)
            ) {
                return;
            }

            const sensor =
                String(
                    fire.detected_sensor
                    ||
                    fire.instrument
                    ||
                    ""
                )
                .trim()
                .toUpperCase();

            let color =
                "#8e24aa";

            if (
                sensor === "VIIRS"
            ) {
                color =
                    "#ef233c";
            }

            if (
                sensor === "MODIS"
            ) {
                color =
                    "#f39c12";
            }

            const marker =
                L.circleMarker(
                    [lat,lon],
                    {
                        radius: 8,
                        color: "#6b1a00",
                        fillColor: color,
                        fillOpacity: .95,
                        weight: 2
                    }
                );

            marker.bindPopup(
                popupContent(
                    fire
                )
            );

            marker.addTo(
                fireLayer
            );
        }
    );
}


/* =====================================================
   POPUP
===================================================== */

function popupContent(
    fire
) {

    const date =
        fire.iran_date
        ||
        fire.archive_date
        ||
        fire.acq_date
        ||
        "---";

    const time =
        fa(
            iranTime(
                fire
            )
        );

    const code =
        String(
            fire.daynight
            ||
            ""
        )
        .trim()
        .toUpperCase();

    let dayNight =
        "---";

    if (
        code === "D"
    ) {

        dayNight =
            "روز";
    }

    if (
        code === "N"
    ) {

        dayNight =
            "شب";
    }

    return `

<div class="fire-popup">

    <h3>
        🔥 حریق استان فارس
    </h3>

    <div class="row">
        <span class="label">سنجنده:</span>
        ${fire.detected_sensor || fire.instrument || "---"}
    </div>

    <div class="row">
        <span class="label">ماهواره:</span>
        ${fire.satellite || "---"}
    </div>

    <div class="row">
        <span class="label">تاریخ ایران:</span>
        ${shamsiDate(date)}
    </div>

    <div class="row">
        <span class="label">ساعت ایران:</span>
        ${time}
    </div>

    <div class="row">
        <span class="label">روز/شب:</span>
        ${dayNight}
    </div>

    <div class="row">
        <span class="label">تاریخ UTC:</span>
        ${fire.acq_date || "---"}
    </div>

    <div class="row">
        <span class="label">ساعت UTC:</span>
        ${fire.acq_time || "---"}
    </div>

    <div class="row">
        <span class="label">FRP:</span>
        ${fire.frp || "---"} MW
    </div>

    <div class="row">
        <span class="label">Confidence:</span>
        ${fire.confidence || "---"}
    </div>

    <div class="row">
        <span class="label">Brightness:</span>
        ${fire.brightness || "---"}
    </div>

    <div class="row">
        <span class="label">مختصات:</span>
        ${coordinate(fire.latitude)}
        ,
        ${coordinate(fire.longitude)}
    </div>

</div>

`;
}


/* =====================================================
   COORDINATE
===================================================== */

function coordinate(
    value
) {

    const n =
        parseFloat(
            value
        );

    return isNaN(n)
        ? "---"
        : n.toFixed(5);
}


/* =====================================================
   APPLY MODE
===================================================== */

function applyMode(
    mode
) {

    const list =
        filteredFires(
            mode
        );

    showFires(
        list
    );

    document
        .querySelectorAll(
            ".mode-button"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.mode
                    ===
                    mode
                );
            }
        );
}


/* =====================================================
   MODE BUTTONS
===================================================== */

document
    .querySelectorAll(
        ".mode-button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    applyMode(
                        this.dataset.mode
                    );
                }
            );
        }
    );


/* =====================================================
   SLIDER LABEL
===================================================== */

function updateSliderDate() {

    const slider =
        document.getElementById(
            "archiveSlider"
        );

    const index =
        parseInt(
            slider.value,
            10
        );

    const date =
        archiveDates[index];

    document.getElementById(
        "sliderDate"
    ).innerText =
        date
        ?
        shamsiDate(date)
        :
        "---";
}


/* =====================================================
   SLIDER EVENT
===================================================== */

document.getElementById(
    "archiveSlider"
).addEventListener(
    "input",
    function() {

        const index =
            parseInt(
                this.value,
                10
            );

        const date =
            archiveDates[index];

        updateSliderDate();

        const list =
            fires.filter(
                fire => {

                    const fireDate =
                        fire.iran_date
                        ||
                        fire.archive_date;

                    return (
                        fireDate === date
                    );
                }
            );

        showFires(
            list
        );
    }
);


/* =====================================================
   NIGHT
===================================================== */

document.getElementById(
    "nightButton"
).addEventListener(
    "click",
    function() {

        document.body.classList.toggle(
            "night"
        );

        const night =
            document.body.classList.contains(
                "night"
            );

        if (night) {

            map.removeLayer(
                lightMap
            );

            darkMap.addTo(
                map
            );

            this.innerText =
                "☀️";

            localStorage.setItem(
                "fars-night",
                "1"
            );

        } else {

            map.removeLayer(
                darkMap
            );

            lightMap.addTo(
                map
            );

            this.innerText =
                "🌙";

            localStorage.setItem(
                "fars-night",
                "0"
            );
        }
    }
);


/* =====================================================
   RESTORE NIGHT
===================================================== */

if (
    localStorage.getItem(
        "fars-night"
    )
    ===
    "1"
) {

    document.body.classList.add(
        "night"
    );

    map.removeLayer(
        lightMap
    );

    darkMap.addTo(
        map
    );

    document.getElementById(
        "nightButton"
    ).innerText =
        "☀️";
}


/* =====================================================
   UPDATE INFO
===================================================== */

async function loadUpdateInfo() {

    try {

        const text =
            await getText(
                UPDATE_INFO
            );

        const data =
            JSON.parse(
                text
            );

        const timestamp =
            Number(
                data.updated_at_timestamp
            );

        if (
            !Number.isFinite(
                timestamp
            )
        ) {

            throw new Error(
                "timestamp invalid"
            );
        }

        updateTimestamp =
            timestamp * 1000;

        updateTimer();

    } catch (error) {

        document.getElementById(
            "updateInfo"
        ).innerText =
            "آخرین به‌روزرسانی: نامشخص";
    }
}


/* =====================================================
   TIMER
===================================================== */

function updateTimer() {

    const element =
        document.getElementById(
            "updateInfo"
        );

    if (
        !updateTimestamp
    ) {

        element.innerText =
            "آخرین به‌روزرسانی: در انتظار اطلاعات";

        return;
    }

    const seconds =
        Math.max(
            0,
            Math.floor(
                (
                    Date.now()
                    -
                    updateTimestamp
                )
                /
                1000
            )
        );

    const minutes =
        Math.floor(
            seconds / 60
        );

    const sec =
        seconds % 60;

    element.innerText =
        "آخرین به‌روزرسانی: "
        +
        fa(minutes)
        +
        " دقیقه و "
        +
        fa(sec)
        +
        " ثانیه پیش";
}


setInterval(
    updateTimer,
    1000
);


/* =====================================================
   REFRESH
===================================================== */

document.getElementById(
    "refreshButton"
).addEventListener(
    "click",
    function() {

        location.reload();
    }
);


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize() {

    /*
       داده‌ها اول
       تا مرز مانع سایت نشود
    */

    try {

        await loadArchiveIndex();

    } catch (error) {

        console.error(
            "Archive index error:",
            error
        );
    }


    try {

        await loadArchives();

    } catch (error) {

        console.error(
            "Archive loading error:",
            error
        );
    }


    /*
       نمایش فوری حریق‌های امروز
    */

    applyMode(
        "today"
    );


    /*
       تایمر
    */

    loadUpdateInfo();


    /*
       مرز جداگانه
    */

    loadBoundary();
}


/* =====================================================
   START
===================================================== */

initialize();

</script>
