<link

<style>

/* =====================================================
   تنظیمات اصلی
===================================================== */

:root {

    --orange-light: #fff3e8;

}

* {

}

html,
body {

    margin: 0;
    overflow: hidden;
}

body {
    font-family: Tahoma, Arial, sans-serif;

}


/* =====================================================
   هدر
===================================================== */

header {

    z-index: 5000;

    height: 74px;

        linear-gradient(

            #e9782c,

        0 2px 12px rgba(0,0,0,.18);
}

.header-content {
    height: 100%;

    align-items: center;
    justify-content: center;

}

.title h1 {

}

.title p {

}


/* =====================================================
   دکمه‌های هدر
===================================================== */

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =====================================================
   CONFIG
===================================================== */

const CONFIG = {

    boundary:
        "fars.geojson",

    archiveIndex:
        "archive/index.json",

    updateInfo:
        "update-info.json"

};


/* =====================================================
   STATE
===================================================== */

const state = {

    map:
        null,

    boundaryLayer:
        null,

    fireLayer:
        null,

    archiveDates:
        [],

    archiveHeaders:
        [],

    fires:
        [],

    mode:
        "24h",

    systemTimestamp:
        null

};


/* =====================================================
   ابزارهای عمومی
===================================================== */

const $ = id =>
    document.getElementById(id);


function fa(value) {

    return String(value)

        .replace(/0/g,"۰")
        .replace(/1/g,"۱")
        .replace(/2/g,"۲")
        .replace(/3/g,"۳")
        .replace(/4/g,"۴")
        .replace(/5/g,"۵")
        .replace(/6/g,"۶")
        .replace(/7/g,"۷")
        .replace(/8/g,"۸")
        .replace(/9/g,"۹");

}


async function fetchText(url) {

    const response =
        await fetch(
            url +
            "?v=" +
            Date.now()
        );

    if (
        !response.ok
    ) {

        throw new Error(
            "فایل دریافت نشد: " +
            url
        );

    }

    return await response.text();

}


/* =====================================================
   CSV
===================================================== */

function parseCSV(text) {

    text =
        text
            .replace(
                /^\uFEFF/,
                ""
            )
            .trim();

    if (!text) {

        return {
            headers: [],
            rows: []
        };

    }


    const lines =
        text.split(
            /\r?\n/
        );


    const headers =
        lines[0]
            .split(",")
            .map(
                h =>
                    h.trim().toLowerCase()
            );


    const rows = [];


    for (
        let i = 1;
        i < lines.length;
        i++
    ) {

        if (
            !lines[i].trim()
        ) {

            continue;

        }


        const values =
            lines[i].split(",");


        const row = {};


        headers.forEach(
            (header,index) => {

                row[header] =
                    values[index] !== undefined
                    ?
                    values[index].trim()
                    :
                    "";

            }
        );


        rows.push(row);

    }


    return {
        headers,
        rows
    };

}


/* =====================================================
   تبدیل تاریخ
===================================================== */

function gregorianToJalali(
    gy,
    gm,
    gd
) {

    const gdm = [
        0,31,59,90,120,151,
        181,212,243,273,304,334
    ];


    let jy;


    if (
        gy > 1600
    ) {

        jy = 979;
        gy -= 1600;

    } else {

        jy = 0;
        gy -= 621;

    }


    const gy2 =
        gm > 2
        ?
        gy + 1
        :
        gy;


    let days =
        365 * gy
        +
        Math.floor(
            (gy2 + 3) / 4
        )
        -
        Math.floor(
            (gy2 + 99) / 100
        )
        +
        Math.floor(
            (gy2 + 399) / 400
        )
        -
        80
        +
        gd
        +
        gdm[
            gm - 1
        ];


    jy +=
        33 *
        Math.floor(
            days / 12053
        );


    days %=
        12053;


    jy +=
        4 *
        Math.floor(
            days / 1461
        );


    days %=
        1461;


    if (
        days > 365
    ) {

        jy +=
            Math.floor(
                (days - 1) / 365
            );


        days =
            (days - 1) % 365;

    }


    let jm;
    let jd;


    if (
        days < 186
    ) {

        jm =
            1 +
            Math.floor(
                days / 31
            );


        jd =
            1 +
            days % 31;

    } else {

        jm =
            7 +
            Math.floor(
                (days - 186) / 30
            );


        jd =
            1 +
            (
                (days - 186) % 30
            );

    }


    return [
        jy,
        jm,
        jd
    ];

}


function shamsiDate(date) {

    if (!date) {
        return "---";
    }


    const parts =
        String(date).split("-");


    if (
        parts.length !== 3
    ) {

        return date;

    }


    const j =
        gregorianToJalali(
            Number(parts[0]),
            Number(parts[1]),
            Number(parts[2])
        );


    const months = [

        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند"

    ];


    return (
        fa(j[2]) +
        " " +
        months[j[1]-1] +
        " " +
        fa(j[0])
    );

}


/* =====================================================
   زمان
===================================================== */

function fireUTCDateTime(fire) {

    if (
        !fire.acq_date ||
        !fire.acq_time
    ) {

        return null;

    }


    const date =
        fire.acq_date.split("-");


    const time =
        String(
            fire.acq_time
        )
        .replace(
            /\D/g,
            ""
        )
        .padStart(
            4,
            "0"
        );


    return new Date(
        Date.UTC(

            Number(date[0]),
            Number(date[1]) - 1,
            Number(date[2]),

            Number(
                time.slice(0,2)
            ),

            Number(
                time.slice(2,4)
            ),

            0

        )
    );

}


function iranTime(fire) {

    if (
        fire.iran_time
    ) {

        return formatTime(
            fire.iran_time
        );

    }


    const utc =
        fireUTCDateTime(
            fire
        );


    if (!utc) {
        return "---";
    }


    const iran =
        new Date(
            utc.getTime()
            +
            3.5 *
            60 *
            60 *
            1000
        );


    return (

        String(
            iran.getUTCHours()
        ).padStart(
            2,
            "0"
        )

        +
        ":"

        +

        String(
            iran.getUTCMinutes()
        ).padStart(
            2,
            "0"
        )

    );

}


function formatTime(value) {

    const t =
        String(value)
        .replace(
            /\D/g,
            ""
        )
        .padStart(
            4,
            "0"
        );


    return (
        t.slice(0,2)
        +
        ":"
        +
        t.slice(2,4)
    );

}


function getTimeLabel(fire) {

    const time =
        iranTime(
            fire
        );


    if (
        !time ||
        time === "---"
    ) {

        return "---";

    }


    const hour =
        Number(
            time.slice(0,2)
        );


    if (
        hour < 6
    ) {

        return "بامداد";

    }


    const code =
        String(
            fire.daynight ||
            ""
        )
        .trim()
        .toUpperCase();


    if (
        code === "D"
    ) {

        return "روز";

    }


    if (
        code === "N"
    ) {

        return "شب";

    }


    return "---";

}


/* =====================================================
   سنجنده
===================================================== */

function getSensor(fire) {

    const explicit =
        String(
            fire.detected_sensor ||
            ""
        )
        .trim()
        .toUpperCase();


    if (
        explicit.includes("VIIRS")
    ) {

        return "VIIRS";

    }


    if (
        explicit.includes("MODIS")
    ) {

        return "MODIS";

    }


    const instrument =
        String(
            fire.instrument ||
            ""
        )
        .trim()
        .toUpperCase();


    if (
        instrument.includes("VIIRS")
    ) {

        return "VIIRS";

    }


    if (
        instrument.includes("MODIS")
    ) {

        return "MODIS";

    }


    return "UNKNOWN";

}


function sensorColor(sensor) {

    if (
        sensor === "VIIRS"
    ) {

        return "#ff1744";

    }


    if (
        sensor === "MODIS"
    ) {

        return "#ff9800";

    }


    return "#8e24aa";

}


/* =====================================================
   مرز
===================================================== */

async function loadBoundary() {

    const text =
        await fetchText(
            CONFIG.boundary
        );


    const geojson =
        JSON.parse(
            text
        );


    state.boundaryLayer =
        L.geoJSON(
            geojson,
            {
                style: {
                    color: "#ff0000",
                    weight: 4,
                    opacity: 1,
                    fillColor: "#ff0000",
                    fillOpacity: .02
                }
            }
        )
        .addTo(
            state.map
        );


    const bounds =
        state.boundaryLayer
            .getBounds();


    if (
        bounds.isValid()
    ) {

        state.map.fitBounds(
            bounds,
            {
                padding: [20,20]
            }
        );

    }

}


/* =====================================================
   آرشیو
===================================================== */

async function loadArchiveIndex() {

    const text =
        await fetchText(
            CONFIG.archiveIndex
        );


    const index =
        JSON.parse(
            text
        );


    state.archiveDates =
        index
            .map(
                item => item.date
            )
            .filter(Boolean)
            .sort();


    const slider =
        $("archiveSlider");


    slider.min = 0;

    slider.max =
        Math.max(
            state.archiveDates.length - 1,
            0
        );


    slider.value =
        Math.max(
            state.archiveDates.length - 1,
            0
        );

}


async function loadArchives() {

    state.fires = [];

    state.archiveHeaders = [];


    for (
        const date
        of
        state.archiveDates
    ) {

        try {

            const text =
                await fetchText(
                    `archive/${date}.csv`
                );


            const parsed =
                parseCSV(
                    text
                );


            if (
                state.archiveHeaders.length === 0
            ) {

                state.archiveHeaders =
                    parsed.headers.slice();

            }


            parsed.rows.forEach(
                row => {

                    row.archive_date =
                        date;

                    state.fires.push(
                        row
                    );

                }
            );


        } catch (error) {

            console.warn(
                "آرشیو موجود نیست:",
                date
            );

        }

    }

}


/* =====================================================
   فیلتر زمانی
===================================================== */

function getFilteredFires(mode) {

    const now =
        new Date();


    const hours =
        mode === "24h"
        ?
        24
        :
        120;


    const start =
        new Date(
            now.getTime()
            -
            hours *
            60 *
            60 *
            1000
        );


    return state.fires.filter(
        fire => {

            const time =
                fireUTCDateTime(
                    fire
                );


            return (
                time &&
                time >= start &&
                time <= now
            );

        }
    );

}


/* =====================================================
   نمایش روی نقشه
===================================================== */

function renderFires(fires) {

    state.fireLayer.clearLayers();


    fires.forEach(
        fire => {

            const lat =
                Number(
                    fire.latitude
                );


            const lon =
                Number(
                    fire.longitude
                );


            if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lon)
            ) {

                return;

            }


            const sensor =
                getSensor(
                    fire
                );


            const marker =
                L.circleMarker(
                    [lat,lon],
                    {
                        radius: 8,

                        color:
                            "#6d0000",

                        weight: 2,

                        fillColor:
                            sensorColor(
                                sensor
                            ),

                        fillOpacity: .95
                    }
                );


            marker.bindPopup(
                createPopup(
                    fire,
                    sensor
                )
            );


            marker.addTo(
                state.fireLayer
            );

        }
    );

}


/* =====================================================
   Popup
===================================================== */

function createPopup(
    fire,
    sensor
) {

    const date =
        fire.iran_date ||
        fire.archive_date ||
        fire.acq_date ||
        "---";


    return `

<div class="fire-popup">

    <h3>
        🔥 حریق استان فارس
    </h3>

    <div class="row">
        <span class="label">سنجنده:</span>
        ${sensor}
    </div>

    <div class="row">
        <span class="label">ماهواره:</span>
        ${fire.satellite || "---"}
    </div>

    <div class="row">
        <span class="label">تاریخ ایران:</span>
        ${shamsiDate(date)}
    </div>

    <div class="row">
        <span class="label">ساعت ایران:</span>
        ${fa(iranTime(fire))}
    </div>

    <div class="row">
        <span class="label">زمان:</span>
        ${getTimeLabel(fire)}
    </div>

    <div class="row">
        <span class="label">تاریخ UTC:</span>
        ${fire.acq_date || "---"}
    </div>

    <div class="row">
        <span class="label">ساعت UTC:</span>
        ${fire.acq_time || "---"}
    </div>

    <div class="row">
        <span class="label">FRP:</span>
        ${fire.frp || "---"} MW
    </div>

    <div class="row">
        <span class="label">Confidence:</span>
        ${fire.confidence || "---"}
    </div>

    <div class="row">
        <span class="label">Brightness:</span>
        ${fire.brightness || "---"}
    </div>

    <div class="row">
        <span class="label">مختصات:</span>
        ${Number(fire.latitude).toFixed(5)}
        ،
        ${Number(fire.longitude).toFixed(5)}
    </div>

</div>

`;

}


/* =====================================================
   حالت فعلی
===================================================== */

function applyMode(mode) {

    state.mode =
        mode;


    const fires =
        getFilteredFires(
            mode
        );


    renderFires(
        fires
    );


    $("fireCount")
        .textContent =
            fa(
                fires.length
            );


    document
        .querySelectorAll(
            ".mode-btn"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",

                    button.dataset.mode ===
                    mode
                );

            }
        );

}


/* =====================================================
   تعداد یک روز آرشیو
===================================================== */

function getArchiveFires(date) {

    return state.fires.filter(
        fire => {

            const fireDate =
                fire.iran_date ||
                fire.archive_date ||
                fire.acq_date;


            return (
                fireDate ===
                date
            );

        }
    );

}


/* =====================================================
   نمایش تاریخ اسلایدر
===================================================== */

function updateSlider() {

    const slider =
        $("archiveSlider");


    const index =
        Number(
            slider.value
        );


    const date =
        state.archiveDates[
            index
        ];


    if (!date) {

        $("sliderDate")
            .textContent =
                "---";


        $("sliderCount")
            .textContent =
                "تعداد رخداد: ۰";


        return;

    }


    const dailyFires =
        getArchiveFires(
            date
        );


    $("sliderDate")
        .textContent =
            shamsiDate(
                date
            );


    $("sliderCount")
        .textContent =
            "تعداد رخداد: " +
            fa(
                dailyFires.length
            );

}


/* =====================================================
   آخرین مشاهده سنجنده
===================================================== */

function getLatestSensorObservation() {

    let latest =
        null;


    state.fires.forEach(
        fire => {

            const time =
                fireUTCDateTime(
                    fire
                );


            if (
                !time
            ) {

                return;

            }


            if (
                latest === null ||
                time > latest
            ) {

                latest =
                    time;

            }

        }
    );


    return latest;

}


/* =====================================================
   اختلاف زمانی
===================================================== */

function ageText(timestamp) {

    if (!timestamp) {

        return "در انتظار اطلاعات";

    }


    const seconds =
        Math.max(
            0,
            Math.floor(
                (
                    Date.now() -
                    timestamp
                )
                /
                1000
            )
        );


    const days =
        Math.floor(
            seconds / 86400
        );


    const hours =
        Math.floor(
            (
                seconds % 86400
            )
            /
            3600
        );


    const minutes =
        Math.floor(
            (
                seconds % 3600
            )
            /
            60
        );


    const sec =
        seconds %
        60;


    if (
        days > 0
    ) {

        return (
            fa(days) +
            " روز و " +
            fa(hours) +
            " ساعت پیش"
        );

    }


    if (
        hours > 0
    ) {

        return (
            fa(hours) +
            " ساعت و " +
            fa(minutes) +
            " دقیقه پیش"
        );

    }


    return (
        fa(minutes) +
        " دقیقه و " +
        fa(sec) +
        " ثانیه پیش"
    );

}


/* =====================================================
   بروزرسانی پنل وضعیت
===================================================== */

function updateStatusPanel() {

    const latest =
        getLatestSensorObservation();


    if (latest) {

        $("sensorAge")
            .textContent =
                "آخرین مشاهده سنجنده: " +
                ageText(
                    latest.getTime()
                );

    }


    if (
        state.systemTimestamp
    ) {

        $("systemAge")
            .textContent =
                "آخرین به‌روزرسانی سامانه: " +
                ageText(
                    state.systemTimestamp
                );

    }

}


/* =====================================================
   اطلاعات update-info
===================================================== */

async function loadSystemUpdate() {

    try {

        const text =
            await fetchText(
                CONFIG.updateInfo
            );


        const data =
            JSON.parse(
                text
            );


        const timestamp =
            Number(
                data.updated_at_timestamp
            );


        if (
            Number.isFinite(
                timestamp
            )
        ) {

            state.systemTimestamp =
                timestamp *
                1000;

        }


    } catch (error) {

        console.warn(
            "update-info دریافت نشد:",
            error
        );

    }

}


/* =====================================================
   Excel
===================================================== */

function escapeXml(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&apos;");

}


function exportExcel24h() {

    const fires =
        getFilteredFires(
            "24h"
        );


    if (
        fires.length === 0
    ) {

        alert(
            "در ۲۴ ساعت گذشته داده‌ای وجود ندارد."
        );

        return;

    }


    const headers =
        state.archiveHeaders.length
        ?
        state.archiveHeaders
        :
        Object.keys(
            fires[0]
        ).filter(
            key =>
                key !==
                "archive_date"
        );


    let xml =

        '<?xml version="1.0"?>' +

        '<Workbook ' +

        'xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +

        'xmlns:o="urn:schemas-microsoft-com:office:office" ' +

        'xmlns:x="urn:schemas-microsoft-com:office:excel" ' +

        'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +

        '<Styles>' +

        '<Style ss:ID="Header">' +

        '<Font ss:Bold="1"/>' +

        '<Interior ss:Color="#E8F0F5" Pattern="Solid"/>' +

        '</Style>' +

        '</Styles>' +

        '<Worksheet ss:Name="Fire_24H">' +

        '<Table>';


    xml +=
        "<Row>";


    headers.forEach(
        header => {

            xml +=
                '<Cell ss:StyleID="Header">' +
                '<Data ss:Type="String">' +
                escapeXml(
                    header
                ) +
                "</Data>" +
                "</Cell>";

        }
    );


    xml +=
        "</Row>";


    fires.forEach(
        fire => {

            xml +=
                "<Row>";


            headers.forEach(
                header => {

                    xml +=
                        "<Cell>" +
                        '<Data ss:Type="String">' +
                        escapeXml(
                            fire[header]
                        ) +
                        "</Data>" +
                        "</Cell>";

                }
            );


            xml +=
                "</Row>";

        }
    );


    xml +=
        "</Table>" +
        "</Worksheet>" +
        "</Workbook>";


    const blob =
        new Blob(
            [xml],
            {
                type:
                    "application/vnd.ms-excel"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    const now =
        new Date();


    const filename =
        "fires_24h_" +
        now.getFullYear() +
        String(
            now.getMonth() + 1
        ).padStart(2,"0") +
        String(
            now.getDate()
        ).padStart(2,"0") +
        "_" +
        String(
            now.getHours()
        ).padStart(2,"0") +
        String(
            now.getMinutes()
        ).padStart(2,"0") +
        ".xls";


    link.href =
        url;


    link.download =
        filename;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(
        () => {
            URL.revokeObjectURL(
                url
            );
        },
        1000
    );

}


/* =====================================================
   حالت شب
===================================================== */

function toggleNight() {

    const night =
        document.body
            .classList
            .toggle(
                "night"
            );


    if (night) {

        state.map.removeLayer(
            state.lightMap
        );


        state.darkMap.addTo(
            state.map
        );


        $("nightBtn")
            .textContent =
                "☀️";


        localStorage.setItem(
            "fars-night",
            "1"
        );

    } else {

        state.map.removeLayer(
            state.darkMap
        );


        state.lightMap.addTo(
            state.map
        );


        $("nightBtn")
            .textContent =
                "🌙";


        localStorage.setItem(
            "fars-night",
            "0"
        );

    }

}


/* =====================================================
   راه‌اندازی نقشه
===================================================== */

function createMap() {

    state.map =
        L.map(
            "map"
        );


    state.lightMap =
        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 18,
                attribution:
                    "© OpenStreetMap contributors"
            }
        )
        .addTo(
            state.map
        );


    state.darkMap =
        L.tileLayer(
            "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
            {
                maxZoom: 19,
                attribution:
                    "© OpenStreetMap © CARTO"
            }
        );


    state.fireLayer =
        L.layerGroup()
            .addTo(
                state.map
            );


    state.map.setView(
        [29.6,52.5],
        8
    );

}


/* =====================================================
   رویدادها
===================================================== */

function bindEvents() {

    document
        .querySelectorAll(
            ".mode-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        applyMode(
                            button.dataset.mode
                        );

                    }
                );

            }
        );


    $("archiveSlider")
        .addEventListener(
            "input",
            () => {

                updateSlider();

                const index =
                    Number(
                        $("archiveSlider").value
                    );

                const date =
                    state.archiveDates[
                        index
                    ];


                if (date) {

                    const fires =
                        getArchiveFires(
                            date
                        );


                    renderFires(
                        fires
                    );


                    $("fireCount")
                        .textContent =
                            fa(
                                fires.length
                            );

                }

            }
        );


    $("excelBtn")
        .addEventListener(
            "click",
            exportExcel24h
        );


    $("nightBtn")
        .addEventListener(
            "click",
            toggleNight
        );


    $("refreshBtn")
        .addEventListener(
            "click",
            () => location.reload()
        );

}


/* =====================================================
   حالت شب ذخیره‌شده
===================================================== */

function restoreNight() {

    if (
        localStorage.getItem(
            "fars-night"
        )
        ===
        "1"
    ) {

        document.body
            .classList
            .add(
                "night"
            );


        state.map.removeLayer(
            state.lightMap
        );


        state.darkMap.addTo(
            state.map
        );


        $("nightBtn")
            .textContent =
                "☀️";

    }

}


/* =====================================================
   اجرای اصلی
===================================================== */

async function init() {

    try {

        createMap();

        bindEvents();

        await loadBoundary();

        await loadArchiveIndex();

        await loadArchives();

        await loadSystemUpdate();

        applyMode(
            "24h"
        );

        updateSlider();

        updateStatusPanel();

        restoreNight();


    } catch (error) {

        console.error(
            "سامانه:",
            error
        );


        $("sensorAge")
            .textContent =
                "خطا در دریافت اطلاعات";


        $("systemAge")
            .textContent =
                error.message;

    }

}


/* =====================================================
   تایمر
===================================================== */

setInterval(
    updateStatusPanel,
    1000
);


/* =====================================================
   START
===================================================== */

init();

</script>
