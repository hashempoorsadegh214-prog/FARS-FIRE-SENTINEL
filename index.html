<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پایش حریق استان فارس</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #b71c1c;
            color: white;
            text-align: center;
            padding: 16px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 7px 0 0;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            min-width: 150px;
            padding: 12px 22px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 7px rgba(0,0,0,.12);
        }

        .card h3 {
            margin: 0 0 7px;
            font-size: 13px;
            color: #555;
        }

        .card strong {
            font-size: 22px;
            color: #d32f2f;
        }

        #status {
            text-align: center;
            padding: 8px;
            color: #555;
        }

        #map {
            height: 620px;
            margin: 0 15px 15px;
            border-radius: 10px;
            overflow: hidden;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 12px;
        }
    </style>
</head>

<body>

<header>
    <h1>🔥 سامانه پایش حریق استان فارس</h1>
    <p>پایش حریق با داده‌های NASA FIRMS</p>
</header>

<div class="stats">

    <div class="card">
        <h3>کل حریق‌ها</h3>
        <strong id="fireCount">0</strong>
    </div>

    <div class="card">
        <h3>VIIRS</h3>
        <strong id="viirsCount">0</strong>
    </div>

    <div class="card">
        <h3>MODIS</h3>
        <strong id="modisCount">0</strong>
    </div>

    <div class="card">
        <h3>تاریخ</h3>
        <strong id="fireDate">---</strong>
    </div>

</div>

<div id="status">
    در حال دریافت داده‌های حریق...
</div>

<div id="map"></div>

<footer>
    NASA FIRMS | VIIRS | MODIS
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.markercluster@1.9.4/dist/leaflet.markercluster.js"></script>

<script>

/* =====================================================
   نقشه
===================================================== */

var map = L.map("map").setView(
    [29.6, 52.5],
    8
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "© OpenStreetMap"
    }
).addTo(map);


/* =====================================================
   لایه حریق
===================================================== */

var fireLayer =
    L.markerClusterGroup();

map.addLayer(fireLayer);


/* =====================================================
   CSV Parser ساده و مطمئن
===================================================== */

function parseCSV(text) {

    text = text.replace(/^\uFEFF/, "").trim();

    var lines =
        text.split(/\r?\n/);

    if (lines.length < 2) {
        return [];
    }

    var headers =
        lines[0].split(",").map(function(h) {
            return h.trim();
        });

    var data = [];

    for (var i = 1; i < lines.length; i++) {

        if (!lines[i].trim()) {
            continue;
        }

        var values =
            lines[i].split(",");

        var row = {};

        for (var j = 0; j < headers.length; j++) {

            row[headers[j]] =
                values[j] !== undefined
                ? values[j].trim()
                : "";
        }

        data.push(row);
    }

    return data;
}


/* =====================================================
   دریافت CSV
===================================================== */

fetch(
    "fires.csv?cache=" + Date.now()
)

.then(function(response) {

    if (!response.ok) {
        throw new Error(
            "fires.csv پیدا نشد."
        );
    }

    return response.text();
})

.then(function(csvText) {

    console.log(
        "CSV:",
        csvText
    );

    var fires =
        parseCSV(csvText);

    console.log(
        "Parsed fires:",
        fires
    );

    if (!fires.length) {

        throw new Error(
            "هیچ رکوردی در fires.csv پیدا نشد."
        );
    }


    /* =================================================
       آمار
    ================================================= */

    var viirs = 0;
    var modis = 0;

    var latestDate = "---";


    /* =================================================
       پردازش حریق‌ها
    ================================================= */

    fires.forEach(function(fire) {

        var lat =
            parseFloat(
                fire.latitude
            );

        var lon =
            parseFloat(
                fire.longitude
            );

        if (
            isNaN(lat) ||
            isNaN(lon)
        ) {
            return;
        }


        var sensor =
            String(
                fire.detected_sensor || ""
            )
            .trim()
            .toUpperCase();


        if (sensor === "VIIRS") {
            viirs++;
        }

        if (sensor === "MODIS") {
            modis++;
        }


        if (
            fire.acq_date &&
            (
                latestDate === "---" ||
                fire.acq_date > latestDate
            )
        ) {

            latestDate =
                fire.acq_date;
        }


        /* =============================================
           رنگ
        ============================================= */

        var color =
            sensor === "MODIS"
            ? "#ff9800"
            : "#ff1744";


        /* =============================================
           Marker
        ============================================= */

        var marker =
            L.circleMarker(
                [lat, lon],
                {
                    radius: 9,
                    color: "#700000",
                    fillColor: color,
                    fillOpacity: 0.95,
                    weight: 2
                }
            );


        /* =============================================
           Popup
        ============================================= */

        marker.bindPopup(

            "<div dir='rtl'>" +

            "<h3>🔥 حریق فارس</h3>" +

            "<b>سنجنده:</b> " +
            (fire.detected_sensor || "---") +

            "<br>" +

            "<b>ماهواره:</b> " +
            (fire.satellite || "---") +

            "<br>" +

            "<b>تاریخ:</b> " +
            (fire.acq_date || "---") +

            "<br>" +

            "<b>ساعت:</b> " +
            (fire.acq_time || "---") +

            "<br>" +

            "<b>FRP:</b> " +
            (fire.frp || "---") +
            " MW" +

            "<br>" +

            "<b>Confidence:</b> " +
            (fire.confidence || "---") +

            "<br>" +

            "<b>مختصات:</b> " +
            lat.toFixed(5) +
            ", " +
            lon.toFixed(5) +

            "</div>"
        );


        fireLayer.addLayer(
            marker
        );

    });


    /* =================================================
       نمایش آمار
    ================================================= */

    document.getElementById(
        "fireCount"
    ).innerText =
        fires.length;


    document.getElementById(
        "viirsCount"
    ).innerText =
        viirs;


    document.getElementById(
        "modisCount"
    ).innerText =
        modis;


    document.getElementById(
        "fireDate"
    ).innerText =
        latestDate;


    document.getElementById(
        "status"
    ).innerText =
        fires.length +
        " حریق در داده‌های FIRMS یافت شد.";


    /* =================================================
       زوم روی حریق‌ها
    ================================================= */

    if (
        fireLayer.getLayers().length > 0
    ) {

        map.fitBounds(
            fireLayer.getBounds(),
            {
                padding: [30, 30]
            }
        );
    }

})


.catch(function(error) {

    console.error(
        error
    );

    document.getElementById(
        "status"
    ).innerText =
        "خطا: " +
        error.message;

});

</script>

</body>
</html>
