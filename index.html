<script>

/* =========================================================

const FIRE_FILE =

/* =========================================================

const fireLayer =

            12,

    });

    fireLayer

/* =========================================================
   BOUNDARY
========================================================= */

let farsBoundaryLayer = null;


/* =========================================================
   ARCHIVE
========================================================= */

let archiveDates = [];

let selectedArchiveIndex = 0;


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

        "status"
    ).innerText = text;

}


/* =========================================================
   PERSIAN DIGITS
========================================================= */

function toPersianDigits(value) {

    return String(value)

        .replace(/0/g, "۰")
        .replace(/1/g, "۱")
        .replace(/2/g, "۲")
        .replace(/3/g, "۳")
        .replace(/4/g, "۴")
        .replace(/5/g, "۵")
        .replace(/6/g, "۶")
        .replace(/7/g, "۷")
        .replace(/8/g, "۸")
        .replace(/9/g, "۹");
}


/* =========================================================
   GREGORIAN TO JALALI
========================================================= */

function gregorianToJalali(
    gy,
    gm,
    gd
) {

    const gdm = [
        0,
        31,
        59,
        90,
        120,
        151,
        181,
        212,
        243,
        273,
        304,
        334
    ];


    let jy;


    if (gy > 1600) {

        jy = 979;

        gy -= 1600;

    } else {

        jy = 0;

        gy -= 621;

    }


    const gy2 =
        gm > 2
        ? gy + 1
        : gy;


    let days =
        365 * gy
        +
        Math.floor(
            (gy2 + 3) / 4
        )
        -
        Math.floor(
            (gy2 + 99) / 100
        )
        +
        Math.floor(
            (gy2 + 399) / 400
        )
        -
        80
        +
        gd
        +
        gdm[gm - 1];


    jy +=
        33 *
        Math.floor(
            days / 12053
        );


    days %= 12053;


    jy +=
        4 *
        Math.floor(
            days / 1461
        );


    days %= 1461;


    if (days > 365) {

        jy +=
            Math.floor(
                (days - 1) / 365
            );

        days =
            (days - 1) % 365;

    }


    let jm;
    let jd;


    if (days < 186) {

        jm =
            1 +
            Math.floor(
                days / 31
            );

        jd =
            1 +
            days % 31;

    } else {

        jm =
            7 +
            Math.floor(
                (days - 186) / 30
            );

        jd =
            1 +
            (
                (days - 186) % 30
            );

    }


    return [
        jy,
        jm,
        jd
    ];
}


/* =========================================================
   JALALI FORMAT
========================================================= */

function formatJalaliDate(
    dateString
) {

    if (
        !dateString ||
        dateString === "---"
    ) {
        return "---";
    }


    const parts =
        String(
            dateString
        ).split("-");


    if (
        parts.length !== 3
    ) {
        return dateString;
    }


    const gy =
        parseInt(
            parts[0],
            10
        );

    const gm =
        parseInt(
            parts[1],
            10
        );

    const gd =
        parseInt(
            parts[2],
            10
        );


    if (
        isNaN(gy) ||
        isNaN(gm) ||
        isNaN(gd)
    ) {
        return dateString;
    }


    const j =
        gregorianToJalali(
            gy,
            gm,
            gd
        );


    return toPersianDigits(
        j[0]
        + "/"
        +
        String(j[1]).padStart(2, "0")
        + "/"
        +
        String(j[2]).padStart(2, "0")
    );
}


/* =========================================================
   JALALI MONTH
========================================================= */

function getJalaliMonth(month) {

    const months = [

        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند"

    ];


    return (
        months[month - 1]
        || ""
    );
}


/* =========================================================
   FULL JALALI DATE
========================================================= */

function formatFullJalaliDate(
    dateString
) {

    if (!dateString) {
        return "---";
    }


    const parts =
        String(
            dateString
        ).split("-");


    if (
        parts.length !== 3
    ) {
        return dateString;
    }


    const j =
        gregorianToJalali(

            parseInt(
                parts[0],
                10
            ),

            parseInt(
                parts[1],
                10
            ),

            parseInt(
                parts[2],
                10
            )

        );


    return (

        toPersianDigits(
            j[2]
        )

        +
        " " +

        getJalaliMonth(
            j[1]
        )

        +
        " " +

        toPersianDigits(
            j[0]
        )
    );
}


/* =========================================================
   UTC TIME
========================================================= */

function formatUTCtime(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "---";
    }


    let text =
        String(value)
        .replace(
            /\D/g,
            ""
        )
        .padStart(
            4,
            "0"
        );


    return toPersianDigits(

        text.substring(
            0,
            2
        )

        +

        ":"

        +

        text.substring(
            2,
            4
        )
    );
}


/* =========================================================
   IRAN TIME
========================================================= */

function formatIranTime(
    acqTime
) {

    if (
        acqTime === null ||
        acqTime === undefined ||
        acqTime === ""
    ) {

        return {
            time: "---",
            dayOffset: 0
        };
    }


    let text =
        String(acqTime)
        .replace(
            /\D/g,
            ""
        )
        .padStart(
            4,
            "0"
        );


    let hour =
        parseInt(
            text.substring(
                0,
                2
            ),
            10
        );


    let minute =
        parseInt(
            text.substring(
                2,
                4
            ),
            10
        );


    if (
        isNaN(hour) ||
        isNaN(minute)
    ) {

        return {
            time: "---",
            dayOffset: 0
        };
    }


    /*
      NASA FIRMS = UTC
      ایران = UTC + 03:30
    */

    let total =
        hour * 60
        +
        minute
        +
        210;


    let dayOffset =
        Math.floor(
            total / 1440
        );


    total =
        total % 1440;


    const iranHour =
        Math.floor(
            total / 60
        );


    const iranMinute =
        total % 60;


    const time =
        String(
            iranHour
        ).padStart(
            2,
            "0"
        )
        +
        ":"
        +
        String(
            iranMinute
        ).padStart(
            2,
            "0"
        );


    return {

        time:
            toPersianDigits(
                time
            ),

        dayOffset:
            dayOffset

    };
}


/* =========================================================
   ADD ONE DAY
========================================================= */

function addOneDay(
    dateString
) {

    const parts =
        dateString.split("-");


    const date =
        new Date(
            Date.UTC(

                parseInt(
                    parts[0],
                    10
                ),

                parseInt(
                    parts[1],
                    10
                ) - 1,

                parseInt(
                    parts[2],
                    10
                )

            )
        );


    date.setUTCDate(
        date.getUTCDate() + 1
    );


    const gy =
        date.getUTCFullYear();

    const gm =
        date.getUTCMonth() + 1;

    const gd =
        date.getUTCDate();


    const j =
        gregorianToJalali(
            gy,
            gm,
            gd
        );


    return (

        toPersianDigits(
            j[2]
        )

        +
        " " +

        getJalaliMonth(
            j[1]
        )

        +
        " " +

        toPersianDigits(
            j[0]
        )

    );
}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

    text =
        text
        .replace(
            /^\uFEFF/,
            ""
        )
        .trim();


    if (!text) {
        return [];
    }


    const lines =
        text.split(
            /\r?\n/
        );


    if (
        lines.length < 2
    ) {
        return [];
    }


    const headers =
        lines[0]
        .split(",")
        .map(
            function(header) {

                return header
                    .trim()
                    .toLowerCase();

            }
        );


    const records = [];


    for (
        let i = 1;
        i < lines.length;
        i++
    ) {

        if (
            !lines[i].trim()
        ) {
            continue;
        }


        const values =
            lines[i].split(",");


        const row = {};


        for (
            let j = 0;
            j < headers.length;
            j++
        ) {

            row[
                headers[j]
            ] =
                values[j] !== undefined
                ? values[j].trim()
                : "";
        }


        records.push(
            row
        );
    }


    return records;
}


/* =========================================================
   LOAD FILE
========================================================= */

function loadTextFile(
    url
) {

    const separator =
        url.includes("?")
        ? "&"
        : "?";


    return fetch(
        url
        +
        separator
        +
        "v="
        +
        Date.now()
    )

    .then(
        function(response) {

            if (!response.ok) {

                throw new Error(
                    "فایل دریافت نشد: " +
                    url
                );
            }


            return response.text();
        }
    );
}


/* =========================================================
   LOAD BOUNDARY
========================================================= */

function loadBoundary() {

    return loadTextFile(
        BOUNDARY_FILE
    )

    .then(
        function(text) {

            const data =
                JSON.parse(
                    text
                );


            if (
                data.type !==
                "FeatureCollection"
            ) {

                throw new Error(
                    "GeoJSON معتبر نیست."
                );
            }


            let fars = null;


            data.features.forEach(
                function(feature) {

                    const properties =
                        feature.properties
                        || {};


                    const name =
                        String(
                            properties.shapeName
                            || ""
                        )
                        .trim()
                        .toLowerCase();


                    if (
                        name === "fars"
                    ) {

                        fars =
                            feature;
                    }

                }
            );


            if (!fars) {

                throw new Error(
                    "فارس در GeoJSON پیدا نشد."
                );
            }


            if (
                farsBoundaryLayer
            ) {

                map.removeLayer(
                    farsBoundaryLayer
                );
            }


            farsBoundaryLayer =
                L.geoJSON(
                    fars,
                    {

                        style: {

                            color:
                                "#ff0000",

                            weight:
                                4,

                            opacity:
                                1,

                            fillColor:
                                "#ff0000",

                            fillOpacity:
                                0.04

                        }
                    }
                ).addTo(
                    map
                );


            const bounds =
                farsBoundaryLayer
                .getBounds();


            if (
                bounds.isValid()
            ) {

                map.fitBounds(
                    bounds,
                    {
                        padding:
                            [20,20]
                    }
                );
            }


            return fars;
        }
    );
}


/* =========================================================
   LOAD FIRE CSV
========================================================= */

function loadFireCSV(
    url
) {

    return loadTextFile(
        url
    )

    .then(
        function(text) {

            const records =
                parseCSV(
                    text
                );


            return records;
        }
    );
}


/* =========================================================
   CREATE POPUP
========================================================= */

    const iranTime =
        formatIranTime(
            fire.acq_time
        );


    let localDate =
        formatFullJalaliDate(
            fire.acq_date
        );


    if (
        iranTime.dayOffset === 1
    ) {

        localDate =
            addOneDay(
                fire.acq_date
            );
    }


    return (

        "<div class='popup'>" +

        "<h3>🔥 حریق استان فارس</h3>" +

        "<b>سنجنده:</b> " +
        (
            fire.detected_sensor
            || "---"
        ) +

        "<br>" +

        "<b>ماهواره:</b> " +
        (
            fire.satellite
            || "---"
        ) +

        "<br>" +

        "<b>تاریخ ایران:</b> " +
        localDate +

        "<br>" +

        "<b>تاریخ UTC:</b> " +
        (
            fire.acq_date
            || "---"
        ) +

        "<br>" +

        "<b>ساعت ایران:</b> " +
        iranTime.time +

        "<br>" +

        "<b>ساعت UTC:</b> " +
        formatUTCtime(
            fire.acq_time
        ) +

        "<br>" +

        "<b>FRP:</b> " +
        (
            fire.frp
            || "---"
        ) +
        " MW" +

        "<br>" +

        "<b>Confidence:</b> " +
        (
            fire.confidence
            || "---"
        ) +

        "<br>" +

        "<b>Brightness:</b> " +
        (
            fire.brightness
            || "---"
        ) +

        "<br>" +

        "<b>روز/شب:</b> " +
        (
            fire.daynight
            || "---"
        ) +

        "<br>" +

        "<b>مختصات:</b> " +

        parseFloat(
            fire.latitude
        ).toFixed(5)

        +

        " , "

        +

        parseFloat(
            fire.longitude
        ).toFixed(5)

        +

        "</div>"
    );
}


/* =========================================================
   DISPLAY FIRES
========================================================= */

function displayFires(
    fires,
    fitToBoundary
) {

    fireLayer.clearLayers();


    let viirs = 0;
    let modis = 0;


    let latestDate =
        "---";


    fires.forEach(
        function(fire) {

            const lat =
                parseFloat(
                    fire.latitude
                );


            const lon =
                parseFloat(
                    fire.longitude
                );


            if (
                isNaN(lat)
                ||
                isNaN(lon)
            ) {

                return;
            }


            const sensor =
                String(
                    fire.detected_sensor
                    ||
                    fire.instrument
                    ||
                    ""
                )
                .trim()
                .toUpperCase();


            if (
                sensor === "VIIRS"
            ) {

                viirs++;
            }


            if (
                sensor === "MODIS"
            ) {

                modis++;
            }


            if (
                fire.acq_date
                &&
                (
                    latestDate === "---"
                    ||
                    fire.acq_date >
                    latestDate
                )
            ) {

                latestDate =
                    fire.acq_date;
            }


            let color =
                "#8e24aa";


            if (
                sensor === "VIIRS"
            ) {

                color =
                    "#ff1744";
            }


            if (
                sensor === "MODIS"
            ) {

                color =
                    "#ff9800";
            }


            const marker =
                L.circleMarker(
                    [
                        lat,
                        lon
                    ],
                    {

                        radius:
                            9,

                        color:
                            "#700000",

                        fillColor:
                            color,

                        fillOpacity:
                            0.95,

                        weight:
                            2
                    }
                );


            marker.bindPopup(
                createPopup(
                    fire
                )
            );


            fireLayer.addLayer(
                marker
            );

        }
    );


    /* =====================================================
       STATS
    ===================================================== */

    document.getElementById(
        "fireCount"
    ).innerText =
        toPersianDigits(
            fires.length
        );


    document.getElementById(
        "viirsCount"
    ).innerText =
        toPersianDigits(
            viirs
        );


    document.getElementById(
        "modisCount"
    ).innerText =
        toPersianDigits(
            modis
        );


    document.getElementById(
        "fireDate"
    ).innerText =
        formatJalaliDate(
            latestDate
        );


    document.getElementById(
        "archiveCount"
    ).innerText =
        toPersianDigits(
            fires.length
        )
        +
        " حریق";


    /*
       فقط در صورت نیاز روی محدوده فارس زوم می‌کنیم.
       بنابراین با یک نقطه حریق، نقشه ناگهان زوم نمی‌کند.
    */

    if (
        fitToBoundary
        &&
        farsBoundaryLayer
    ) {

        const bounds =
            farsBoundaryLayer.getBounds();


        if (
            bounds.isValid()
        ) {

            map.fitBounds(
                bounds,
                {
                    padding:
                        [20,20]
                }
            );
        }
    }

}


/* =========================================================
   ARCHIVE INDEX
========================================================= */

function loadArchiveIndex() {

    return loadTextFile(
        ARCHIVE_INDEX
    )

    .then(
        function(text) {

            const index =
                JSON.parse(
                    text
                );


            archiveDates =
                index
                .map(
                    function(item) {
                        return item.date;
                    }
                )
                .filter(
                    function(date) {
                        return !!date;
                    }
                )
                .sort();


            const slider =
                document.getElementById(
                    "archiveSlider"
                );


            slider.min =
                0;


            slider.max =
                Math.max(
                    archiveDates.length - 1,
                    0
                );


            selectedArchiveIndex =
                Math.max(
                    archiveDates.length - 1,
                    0
                );


            slider.value =
                selectedArchiveIndex;


            updateArchiveLabel();

        }
    );
}


/* =========================================================
   ARCHIVE LABEL
========================================================= */

function updateArchiveLabel() {

    if (
        archiveDates.length === 0
    ) {

        document.getElementById(
            "dateLabel"
        ).innerText =
            "---";

        return;
    }


    const date =
        archiveDates[
            selectedArchiveIndex
        ];


    document.getElementById(
        "dateLabel"
    ).innerText =
        formatFullJalaliDate(
            date
        );
}


/* =========================================================
   LOAD ARCHIVE DAY
========================================================= */

function loadSelectedArchive() {

    if (
        archiveDates.length === 0
    ) {

        return;
    }


    const date =
        archiveDates[
            selectedArchiveIndex
        ];


    updateArchiveLabel();


    setStatus(
        "در حال دریافت آرشیو " +
        formatFullJalaliDate(
            date
        )
        +
        "..."
    );


    const file =
        "archive/" +
        date +
        ".csv";


    loadFireCSV(
        file
    )

    .then(
        function(fires) {

            displayFires(
                fires,
                false
            );


            setStatus(
                "آرشیو " +
                formatFullJalaliDate(
                    date
                )
                +
                " نمایش داده شد."
            );
        }
    )

    .catch(
        function(error) {

            console.error(
                error
            );


            fireLayer.clearLayers();


            document.getElementById(
                "fireCount"
            ).innerText =
                "۰";


            document.getElementById(
                "viirsCount"
            ).innerText =
                "۰";


            document.getElementById(
                "modisCount"
            ).innerText =
                "۰";


            document.getElementById(
                "archiveCount"
            ).innerText =
                "۰ حریق";


            setStatus(
                "برای این روز داده حریق ثبت نشده است."
            );
        }
    );
}


/* =========================================================
   SLIDER
========================================================= */

document.getElementById(
    "archiveSlider"
).addEventListener(
    "input",
    function() {

        selectedArchiveIndex =
            parseInt(
                this.value,
                10
            );


        loadSelectedArchive();

    }
);


/* =========================================================
   MANUAL REFRESH
========================================================= */

document.getElementById(
    "updateButton"
).addEventListener(
    "click",
    function() {

        const button =
            this;


        button.disabled =
            true;


        button.innerText =
            "⏳ در حال بارگذاری...";


        setStatus(
            "در حال دریافت آخرین داده منتشرشده..."
        );


        loadFireCSV(
            FIRE_FILE
        )

        .then(
            function(fires) {

                displayFires(
                    fires,
                    false
                );


                setStatus(
                    toPersianDigits(
                        fires.length
                    )
                    +
                    " حریق در آخرین داده منتشرشده یافت شد."
                );
            }
        )

        .catch(
            function(error) {

                console.error(
                    error
                );


                setStatus(
                    "خطا در دریافت آخرین داده."
                );
            }
        )

        .finally(
            function() {

                button.disabled =
                    false;


                button.innerText =
                    "🔄 به‌روزرسانی";
            }
        );
    }
);


/* =========================================================
   LEGEND
========================================================= */

const legend =
    L.control({
        position:
            "bottomleft"
    });


legend.onAdd =
    function() {

        const div =
            L.DomUtil.create(
                "div",
                "legend"
            );


        div.innerHTML =

            "<b>راهنمای حریق</b>" +

            "<div class='legend-item'>" +

            "<span class='legend-dot' " +
            "style='background:#ff1744'></span>" +

            "VIIRS" +

            "</div>" +

            "<div class='legend-item'>" +

            "<span class='legend-dot' " +
            "style='background:#ff9800'></span>" +

            "MODIS" +

            "</div>" +

            "<div class='legend-item'>" +

            "<span class='legend-dot' " +
            "style='background:#8e24aa'></span>" +

            "نامشخص" +

            "</div>";


        return div;
    };


legend.addTo(
    map
);


/* =========================================================
   START
========================================================= */

async function initializeApp() {

    try {

        /*
           اول مرز را می‌خوانیم.
        */

        setStatus(
            "در حال بارگذاری مرز استان فارس..."
        );


        await loadBoundary();


        /*
           سپس داده اصلی حریق
        */

        setStatus(
            "در حال بارگذاری داده‌های حریق..."
        );


        const currentFires =
            await loadFireCSV(
                FIRE_FILE
            );


        /*
           نمایش داده فعلی
        */

        displayFires(
            currentFires,
            true
        );


        setStatus(
            toPersianDigits(
                currentFires.length
            )
            +
            " حریق در آخرین داده منتشرشده نمایش داده شد."
        );


        /*
           سپس آرشیو
        */

        await loadArchiveIndex();


        /*
           اسلایدر روی آخرین روز
        */

        if (
            archiveDates.length > 0
        ) {

            selectedArchiveIndex =
                archiveDates.length - 1;


            document.getElementById(
                "archiveSlider"
            ).value =
                selectedArchiveIndex;


            updateArchiveLabel();

        }


    } catch (error) {

        console.error(
            "FARS FIRE SENTINEL:",
            error
        );


        setStatus(
            "خطا: " +
            error.message
        );

    }

}


/* =========================================================
   RUN
========================================================= */

initializeApp();

</script>
