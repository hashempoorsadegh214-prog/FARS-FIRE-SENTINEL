name: Update Fars Fire Data

on:
  schedule:
    - cron: "15 * * * *"

  workflow_dispatch:

  push:
    paths:
      - "update_fires.py"
      - "geoBoundaries-IRN-ADM1.geojson"
      - "requirements.txt"
      - ".github/workflows/update-fires.yml"

jobs:

  update-fires:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # دریافت Repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # نصب Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # نصب requests
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # بررسی فایل‌های لازم
      - name: Check required files
        run: |
          test -f update_fires.py
          test -f geoBoundaries-IRN-ADM1.geojson
          test -f requirements.txt

          echo "Required files are OK."

      # دریافت داده از NASA FIRMS
      - name: Update fire data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python update_fires.py

      # بررسی خروجی‌ها
      - name: Check generated files
        run: |

          echo "Checking fires.csv..."

          test -f fires.csv

          echo "fires.csv:"
          wc -l fires.csv

          echo ""
          echo "Checking archive/index.json..."

          test -f archive/index.json

          echo ""
          echo "Archive files:"
          ls -lah archive/

      # ذخیره خودکار داده‌های جدید در GitHub
      - name: Commit updated fire data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add fires.csv
          git add archive/

          if git diff --cached --quiet; then

            echo "No changes in fire data."

          else

            git commit \
              -m "Update Fars fire data"

            git push

          fi
