name: Update Fars Fire Data

on:

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

  push:
    paths:
      - "update_fires.py"
      - "geoBoundaries-IRN-ADM1.geojson"
      - "requirements.txt"
      - ".github/workflows/update-fires.yml"


jobs:

  update-fires:

    concurrency:
      group: fars-fire-update
      cancel-in-progress: false

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"


      # ==================================================
      # DEPENDENCIES
      # ==================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==================================================
      # CHECK FILES
      # ==================================================

      - name: Check required files
        run: |
          test -f update_fires.py
          test -f geoBoundaries-IRN-ADM1.geojson
          test -f requirements.txt

          echo "Required files are OK."


      # ==================================================
      # NASA FIRMS
      # ==================================================

      - name: Update fire data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python update_fires.py


      # ==================================================
      # CHECK OUTPUT
      # ==================================================

      - name: Check generated files
        run: |

          test -f fires.csv
          test -f archive/index.json
          test -f update-info.json

          echo "=============================="
          echo "fires.csv"
          echo "=============================="

          wc -l fires.csv

          echo "=============================="
          echo "update-info.json"
          echo "=============================="

          cat update-info.json

          echo "=============================="
          echo "ARCHIVE"
          echo "=============================="

          ls -lah archive/


      # ==================================================
      # COMMIT
      # ==================================================

      - name: Commit and push updated data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add fires.csv
          git add archive/
          git add update-info.json

          if git diff --cached --quiet; then

            echo "No changes in fire data."

            exit 0

          fi

          git commit \
            -m "Update Fars fire data"

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
