name: Update Fars Fire Data

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

  push:
    paths:
      - "update_fires.py"
      - "geoBoundaries-IRN-ADM1.geojson"
      - "requirements.txt"
      - ".github/workflows/update-fires.yml"

jobs:

  update-fires:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required files
        run: |
          test -f update_fires.py
          test -f geoBoundaries-IRN-ADM1.geojson
          test -f requirements.txt

      - name: Update fire data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python update_fires.py

      - name: Check generated files
        run: |
          test -f fires.csv
          test -f archive/index.json
          test -f update-info.json

          echo "fires.csv:"
          wc -l fires.csv

          echo "update-info.json:"
          cat update-info.json

          echo "Archive:"
          ls -lah archive/

      - name: Commit updated fire data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add fires.csv
          git add archive/
          git add update-info.json

          if git diff --cached --quiet; then

            echo "No changes in fire data."

          else

            git commit -m "Update Fars fire data"

            git push

          fi
