name: Update Fars Fire Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

  push:
    paths:
      - "update_fires.py"
      - "geoBoundaries-IRN-ADM1.geojson"
      - "requirements.txt"
      - ".github/workflows/update-fires.yml"

jobs:
  update-fires:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ------------------------------------------
      # دریافت مخزن
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # ------------------------------------------
      # نصب Python
      # ------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"


      # ------------------------------------------
      # نصب وابستگی‌ها
      # ------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------
      # بررسی فایل‌های موردنیاز
      # ------------------------------------------

      - name: Check required files
        run: |
          test -f update_fires.py
          test -f geoBoundaries-IRN-ADM1.geojson
          test -f requirements.txt

          echo "All required files exist."


      # ------------------------------------------
      # اجرای Python و دریافت FIRMS
      # ------------------------------------------

      - name: Update fire data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python update_fires.py


      # ------------------------------------------
      # بررسی خروجی
      # ------------------------------------------

      - name: Check generated files
        run: |

          echo "Checking fires.csv..."

          if [ ! -f fires.csv ]; then
            echo "ERROR: fires.csv was not created."
            exit 1
          fi

          echo "fires.csv exists."

          echo "Checking archive..."

          if [ ! -f archive/index.json ]; then
            echo "ERROR: archive/index.json was not created."
            exit 1
          fi

          echo "Archive exists."

          echo ""
          echo "fires.csv:"
          wc -l fires.csv

          echo ""
          echo "Archive:"
          ls -lah archive/


      # ------------------------------------------
      # Commit داده‌ها
      # ------------------------------------------

      - name: Commit updated fire data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add fires.csv
          git add archive/

          if git diff --cached --quiet; then

            echo "No changes in fire data."

          else

            git commit -m "Update Fars fire data"

            git push

          fi
