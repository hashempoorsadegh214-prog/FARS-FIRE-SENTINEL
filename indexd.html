<script>

/* =====================================================
   CONFIG
===================================================== */

const CONFIG = {

    boundary:
        "fars.geojson",

    protected:
        "protected_areas.geojson",

    hunting:
        "hunting_banned.geojson",

    archiveIndex:
        "archive/index.json",

    fallbackCsv:
        "fires.csv",

    updateInfo:
        "update-info.json"

};


/* =====================================================
   STATE
===================================================== */

const state = {

    map:
        null,

    lightMap:
        null,

    darkMap:
        null,

    boundaryLayer:
        null,

    protectedLayer:
        null,

    huntingLayer:
        null,

    fireLayer:
        null,

    protectedGeoJSON:
        null,

    huntingGeoJSON:
        null,

    archiveDates:
        [],

    archiveHeaders:
        [],

    fires:
        [],

    mode:
        "24h",

    areaFilter:
        "none",

    systemTimestamp:
        null

};


/* =====================================================
   HELPERS
===================================================== */

const $ =
    id =>
        document.getElementById(id);


async function getText(
    url
) {

    const response =
        await fetch(
            url +
            "?v=" +
            Date.now()
        );


    if(
        !response.ok
    ){

        throw new Error(
            "خطا در دریافت فایل: " +
            url
        );

    }


    return response.text();

}


function fa(
    value
) {

    return String(value)

        .replace(/0/g,"۰")
        .replace(/1/g,"۱")
        .replace(/2/g,"۲")
        .replace(/3/g,"۳")
        .replace(/4/g,"۴")
        .replace(/5/g,"۵")
        .replace(/6/g,"۶")
        .replace(/7/g,"۷")
        .replace(/8/g,"۸")
        .replace(/9/g,"۹");

}


/* =====================================================
   CSV
===================================================== */

function parseCSV(
    text
) {

    text =
        text
            .replace(
                /^\uFEFF/,
                ""
            )
            .trim();


    if(
        !text
    ){

        return {
            headers:[],
            rows:[]
        };

    }


    const lines =
        text.split(
            /\r?\n/
        );


    const headers =
        lines[0]
            .split(",")
            .map(
                h =>
                    h
                        .trim()
                        .toLowerCase()
            );


    const rows=[];


    for(
        let i=1;
        i<lines.length;
        i++
    ){

        if(
            !lines[i].trim()
        ){

            continue;

        }


        const values =
            lines[i].split(",");


        const row={};


        headers.forEach(
            (
                header,
                index
            ) => {

                row[header] =
                    values[index] !== undefined
                    ?
                    values[index].trim()
                    :
                    "";

            }
        );


        rows.push(
            row
        );

    }


    return {
        headers,
        rows
    };

}


/* =====================================================
   JALALI
===================================================== */

function gregorianToJalali(
    gy,
    gm,
    gd
) {

    const gdm=[

        0,31,59,90,120,151,
        181,212,243,273,304,334

    ];


    let jy;


    if(
        gy>1600
    ){

        jy=979;
        gy-=1600;

    }else{

        jy=0;
        gy-=621;

    }


    const gy2 =
        gm>2
        ?
        gy+1
        :
        gy;


    let days =
        365*gy
        +
        Math.floor(
            (gy2+3)/4
        )
        -
        Math.floor(
            (gy2+99)/100
        )
        +
        Math.floor(
            (gy2+399)/400
        )
        -
        80
        +
        gd
        +
        gdm[
            gm-1
        ];


    jy +=
        33*
        Math.floor(
            days/12053
        );


    days %=12053;


    jy +=
        4*
        Math.floor(
            days/1461
        );


    days %=1461;


    if(
        days>365
    ){

        jy +=
            Math.floor(
                (days-1)/365
            );

        days =
            (days-1)%365;

    }


    let jm;
    let jd;


    if(
        days<186
    ){

        jm =
            1+
            Math.floor(
                days/31
            );

        jd =
            1+
            days%31;

    }else{

        jm =
            7+
            Math.floor(
                (days-186)/30
            );

        jd =
            1+
            (days-186)%30;

    }


    return [
        jy,
        jm,
        jd
    ];

}


function shamsiDate(
    date
) {

    if(
        !date
    ){

        return "---";

    }


    const parts =
        String(date)
            .split("-");


    if(
        parts.length!==3
    ){

        return date;

    }


    const j =
        gregorianToJalali(
            Number(parts[0]),
            Number(parts[1]),
            Number(parts[2])
        );


    const months=[

        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند"

    ];


    return (
        fa(j[2])
        +
        " "
        +
        months[j[1]-1]
        +
        " "
        +
        fa(j[0])
    );

}


/* =====================================================
   TIME
===================================================== */

function fireUTCDateTime(
    fire
) {

    if(
        !fire.acq_date ||
        !fire.acq_time
    ){

        return null;

    }


    const date =
        fire.acq_date.split("-");


    const time =
        String(
            fire.acq_time
        )
        .replace(
            /\D/g,
            ""
        )
        .padStart(
            4,
            "0"
        );


    return new Date(
        Date.UTC(
            Number(date[0]),
            Number(date[1])-1,
            Number(date[2]),
            Number(
                time.slice(0,2)
            ),
            Number(
                time.slice(2,4)
            ),
            0
        )
    );

}


function iranTime(
    fire
) {

    const utc =
        fireUTCDateTime(
            fire
        );


    if(
        !utc
    ){

        return "---";

    }


    const iran =
        new Date(
            utc.getTime()
            +
            3.5*60*60*1000
        );


    return (
        String(
            iran.getUTCHours()
        ).padStart(2,"0")
        +
        ":"
        +
        String(
            iran.getUTCMinutes()
        ).padStart(2,"0")
    );

}


function getTimeLabel(
    fire
) {

    const time =
        iranTime(
            fire
        );


    if(
        time==="---"
    ){

        return "---";

    }


    const hour =
        Number(
            time.slice(0,2)
        );


    if(
        hour<6
    ){

        return "بامداد";

    }


    const dn =
        String(
            fire.daynight ||
            ""
        )
        .trim()
        .toUpperCase();


    if(
        dn==="D"
    ){

        return "روز";

    }


    if(
        dn==="N"
    ){

        return "شب";

    }


    return "---";

}


/* =====================================================
   SENSOR
===================================================== */

function getSensor(
    fire
) {

    const value =
        String(
            fire.detected_sensor ||
            fire.instrument ||
            ""
        )
        .trim()
        .toUpperCase();


    if(
        value.includes("VIIRS")
    ){

        return "VIIRS";

    }


    if(
        value.includes("MODIS")
    ){

        return "MODIS";

    }


    return "UNKNOWN";

}


function sensorColor(
    sensor
) {

    if(
        sensor==="VIIRS"
    ){

        return "#ff1744";

    }


    if(
        sensor==="MODIS"
    ){

        return "#ff9800";

    }


    return "#8e24aa";

}

/* =====================================================
   TIME FILTER
===================================================== */

function getTimeFilteredFires(){

    const now =
        new Date();


    const hours =
        state.mode==="24h"
        ?
        24
        :
        120;


    const start =
        new Date(
            now.getTime()
            -
            hours*60*60*1000
        );


    return state.fires.filter(
        fire => {

            const time =
                fireUTCDateTime(
                    fire
                );


            return (
                time &&
                time>=start &&
                time<=now
            );

        }
    );

}


/* =====================================================
   POINT FILTER
===================================================== */

function pointInRing(
    point,
    ring
){

    const x =
        point[0];

    const y =
        point[1];

    let inside =
        false;


    for(
        let i=0,
            j=ring.length-1;

        i<ring.length;

        j=i++
    ){

        const xi =
            ring[i][0];

        const yi =
            ring[i][1];

        const xj =
            ring[j][0];

        const yj =
            ring[j][1];


        const intersect =
            (
                yi>y
            )
            !==
            (
                yj>y
            )
            &&
            x<
            (
                (
                    xj-xi
                )
                *
                (
                    y-yi
                )
                /
                (
                    yj-yi
                )
                +
                xi
            );


        if(
            intersect
        ){

            inside =
                !inside;

        }

    }


    return inside;

}


function pointInPolygon(
    point,
    rings
){

    if(
        !rings ||
        !rings.length
    ){

        return false;

    }


    if(
        !pointInRing(
            point,
            rings[0]
        )
    ){

        return false;

    }


    for(
        let i=1;
        i<rings.length;
        i++
    ){

        if(
            pointInRing(
                point,
                rings[i]
            )
        ){

            return false;

        }

    }


    return true;

}


/* =====================================================
   REGION NAME
===================================================== */

function findRegionName(
    properties
){

    if(
        !properties
    ){

        return "";

    }


    const preferred=[

        "name",
        "NAME",
        "Name",
        "نام",
        "نام منطقه",
        "نام_منطقه",
        "نام منطقه حفاظت شده",
        "نام منطقه شکار ممنوع",
        "area_name",
        "AREA_NAME",
        "area",
        "AREA",
        "title",
        "Title",
        "region",
        "Region",
        "zone",
        "ZONE",
        "Name_1",
        "NAME_1"

    ];


    for(
        const key of preferred
    ){

        if(
            properties[key]!==undefined &&
            properties[key]!==null &&
            String(
                properties[key]
            ).trim()!==""
        ){

            return String(
                properties[key]
            ).trim();

        }

    }


    const dynamicKey =
        Object.keys(
            properties
        )
        .find(
            key =>
                /name|نام|title|عنوان/i
                .test(key)
        );


    if(
        dynamicKey
    ){

        return String(
            properties[dynamicKey]
        ).trim();

    }


    return "";

}


/* =====================================================
   FIND REGIONS
===================================================== */

function findRegionsAtPoint(
    lat,
    lon
){

    const result={

        protected:[],
        hunting:[]

    };


    const point=[
        lon,
        lat
    ];


    function scan(
        geojson,
        target
    ){

        if(
            !geojson
        ){

            return;

        }


        const features =
            geojson.type==="FeatureCollection"
            ?
            geojson.features
            :
            geojson.type==="Feature"
            ?
            [geojson]
            :
            [];


        features.forEach(
            feature => {

                if(
                    !feature ||
                    !feature.geometry
                ){

                    return;

                }


                const geometry =
                    feature.geometry;


                let inside =
                    false;


                if(
                    geometry.type==="Polygon"
                ){

                    inside =
                        pointInPolygon(
                            point,
                            geometry.coordinates
                        );

                }


                if(
                    geometry.type==="MultiPolygon"
                ){

                    for(
                        const polygon
                        of
                        geometry.coordinates
                    ){

                        if(
                            pointInPolygon(
                                point,
                                polygon
                            )
                        ){

                            inside =
                                true;

                            break;

                        }

                    }

                }


                if(
                    inside
                ){

                    const name =
                        findRegionName(
                            feature.properties
                        );


                    if(
                        name &&
                        !result[target]
                            .includes(name)
                    ){

                        result[target]
                            .push(
                                name
                            );

                    }

                }

            }
        );

    }


    scan(
        state.protectedGeoJSON,
        "protected"
    );


    scan(
        state.huntingGeoJSON,
        "hunting"
    );


    return result;

}


/* =====================================================
   AREA FILTER
===================================================== */

function applyAreaFilter(
    fires
){

    if(
        state.areaFilter==="none"
    ){

        return fires;

    }


    return fires.filter(
        fire => {

            const lat =
                Number(
                    fire.latitude
                );


            const lon =
                Number(
                    fire.longitude
                );


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lon)
            ){

                return false;

            }


            const regions =
                findRegionsAtPoint(
                    lat,
                    lon
                );


            if(
                state.areaFilter==="protected"
            ){

                return (
                    regions.protected.length>0
                );

            }


            return (
                regions.hunting.length>0
            );

        }
    );

}


function getVisibleFires(){

    return applyAreaFilter(
        getTimeFilteredFires()
    );

}

    const lon =
        Number(
            fire.longitude
        );


    const regions =
        Number.isFinite(lat) &&
        Number.isFinite(lon)

        findRegionsAtPoint(
            lat,

                    تاریخ ایران:

                <span class="label">

/* =====================================================
   RENDER FIRES
===================================================== */

function renderFires(
    fires
){

    state.fireLayer
        .clearLayers();


    fires.forEach(
        fire => {

            const lat =
                Number(
                    fire.latitude
                );


            const lon =
                Number(
                    fire.longitude
                );


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lon)
            ){

                return;

            }


            const sensor =
                getSensor(
                    fire
                );


            const marker =
                L.circleMarker(
                    [
                        lat,
                        lon
                    ],
                    {
                        pane:
                            "firePane",

                        radius:
                            8,

                        color:
                            "#6d0000",

                        weight:
                            2,

                        fillColor:
                            sensorColor(
                                sensor
                            ),

                        fillOpacity:
                            .95
                    }
                );


            marker.bindPopup(
                createPopup(
                    fire,
                    sensor
                )
            );


            marker.addTo(
                state.fireLayer
            );

        }
    );

}


function refreshFires(){

    const fires =
        getVisibleFires();


    renderFires(
        fires
    );


    $("fireCount")
        .textContent =
            fa(
                fires.length
            );

}

function setAreaFilter(
    type
){

    state.areaFilter =
        type;


    $("protectedFilter")
        .checked =
            type==="protected";


    $("huntingFilter")
        .checked =
            type==="hunting";


    updateAreaLayers();


    refreshFires();

}


$("protectedFilter")
    .addEventListener(
        "change",
        function(){

            setAreaFilter(
                this.checked
                ?
                "protected"
                :
                "none"
            );

        }
    );


$("huntingFilter")
    .addEventListener(
        "change",
        function(){

            setAreaFilter(
                this.checked
                ?
                "hunting"
                :
                "none"
            );

        }
    );


function updateAreaLayers(){

    if(
        state.protectedLayer
    ){

        if(
            state.areaFilter==="protected"
        ){

            state.protectedLayer.addTo(
                state.map
            );

        }else{

            state.map.removeLayer(
                state.protectedLayer
            );

        }

    }


    if(
        state.huntingLayer
    ){

        if(
            state.areaFilter==="hunting"
        ){

            state.huntingLayer.addTo(
                state.map
            );

        }else{

            state.map.removeLayer(
                state.huntingLayer
            );

        }

    }

}

/* =====================================================
   STATUS
===================================================== */

function getLatestObservation(){

    let latest=null;


    state.fires.forEach(
        fire => {

            const time =
                fireUTCDateTime(
                    fire
                );


            if(
                !time
            ){

                return;

            }


            if(
                !latest ||
                time>latest
            ){

                latest =
                    time;

            }

        }
    );


    return latest;

}


function ageText(
    timestamp
){

    if(
        !timestamp
    ){

        return "در انتظار اطلاعات";

    }


    const seconds =
        Math.max(
            0,
            Math.floor(
                (
                    Date.now()-
                    timestamp
                )
                /
                1000
            )
        );


    const hours =
        Math.floor(
            seconds/3600
        );


    const minutes =
        Math.floor(
            (seconds%3600)/60
        );


    const sec =
        seconds%60;


    if(
        hours>0
    ){

        return (
            fa(hours)
            +
            " ساعت و "
            +
            fa(minutes)
            +
            " دقیقه پیش"
        );

    }


    return (
        fa(minutes)
        +
        " دقیقه و "
        +
        fa(sec)
        +
        " ثانیه پیش"
    );

}

/* =====================================================
   EXCEL
===================================================== */

function escapeXml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&apos;"
    );

}

            getTimeFilteredFires()
        );


    if(
        fires.length===0
    ){

        alert(
            "برای بازه انتخاب‌شده داده‌ای وجود ندارد."
        );

        return;

    }


    const headers =
        state.archiveHeaders.length
        ?
        state.archiveHeaders
        :
        Object.keys(
            fires[0]
        );


    let xml =
        '<?xml version="1.0"?>'
        +
        '<Workbook '
        +
        'xmlns="urn:schemas-microsoft-com:office:spreadsheet" '
        +
        'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
        +
        '<Worksheet ss:Name="FireData">'
        +
        '<Table>';


    xml +=
        "<Row>";


    headers.forEach(
        header => {

            xml +=
                "<Cell>"
                +
                '<Data ss:Type="String">'
                +
                escapeXml(
                    header
                )
                +
                "</Data>"
                +
                "</Cell>";

        }
    );


    xml +=
        "</Row>";


    fires.forEach(
        fire => {

            xml +=
                "<Row>";


            headers.forEach(
                header => {

                    xml +=
                        "<Cell>"
                        +
                        '<Data ss:Type="String">'
                        +
                        escapeXml(
                            fire[header]
                        )
                        +
                        "</Data>"
                        +
                        "</Cell>";

                }
            );


            xml +=
                "</Row>";

        }
    );


    xml +=
        "</Table>"
        +
        "</Worksheet>"
        +
        "</Workbook>";


    const blob =
        new Blob(
            [xml],
            {
                type:
                    "application/vnd.ms-excel"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "fires_"
        +
        new Date()
            .toISOString()
            .slice(0,10)
        +
        ".xls";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(
        () =>
            URL.revokeObjectURL(
                url
            ),
        1000
    );

}


/* =====================================================
   LIGHTWEIGHT REPORT TOOL
===================================================== */

async function loadHtml2Canvas(){

    if(
        typeof window.html2canvas==="function"
    ){

        return window.html2canvas;

    }


    const sources=[

        "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",

        "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js",

        "https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"

    ];


    for(
        const src of sources
    ){

        try{

            await new Promise(
                (resolve,reject) => {

                    const script =
                        document.createElement(
                            "script"
                        );


                    script.src =
                        src;


                    script.async =
                        true;


                    script.onload =
                        resolve;


                    script.onerror =
                        reject;


                    document.head.appendChild(
                        script
                    );

                }
            );


            if(
                typeof window.html2canvas==="function"
            ){

                return window.html2canvas;

            }

        }catch(error){}

    }


    throw new Error(
        "html2canvas could not be loaded"
    );

}


function getReportFilter(){

    if(
        state.areaFilter==="protected"
    ){

        return "مناطق چهارگانه محیط زیست";

    }


    if(
        state.areaFilter==="hunting"
    ){

        return "مناطق شکار ممنوع";

    }


    return "ندارد";

}


/* =====================================================
   REGION REPORT
===================================================== */

async function createRegionReport(){

    let html2canvas;


    try{

        html2canvas =
            await loadHtml2Canvas();

    }catch(error){

        alert(
            "ابزار تهیه گزارش بارگذاری نشد."
        );

        return;

    }


    const mapElement =
        document.getElementById(
            "map"
        );


    if(
        !mapElement
    ){

        return;

    }


    /* فقط رخدادهایی که داخل محدوده فعلی صفحه هستند */

    const mapBounds =
        state.map.getBounds();


    const fires =
        getVisibleFires()
            .filter(
                fire => {

                    const lat =
                        Number(
                            fire.latitude
                        );


                    const lon =
                        Number(
                            fire.longitude
                        );


                    return (
                        Number.isFinite(lat) &&
                        Number.isFinite(lon) &&
                        mapBounds.contains(
                            [
                                lat,
                                lon
                            ]
                        )
                    );

                }
            );


    /* عکس واقعی خود نقشه */

    const canvas =
        await html2canvas(
            mapElement,
            {
                backgroundColor:
                    "#ffffff",

                useCORS:
                    true,

                allowTaint:
                    false,

                logging:
                    false,

                scale:
                    Math.min(
                        window.devicePixelRatio || 1,
                        2
                    )
            }
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    const mapRect =
        mapElement.getBoundingClientRect();


    const scaleX =
        canvas.width /
        mapRect.width;


    const scaleY =
        canvas.height /
        mapRect.height;


    /* =================================================
       رسم مستقیم نقاط حریق روی تصویر
    ================================================= */

    fires.forEach(
        fire => {

            const lat =
                Number(
                    fire.latitude
                );


            const lon =
                Number(
                    fire.longitude
                );


            const point =
                state.map.latLngToContainerPoint(
                    [
                        lat,
                        lon
                    ]
                );


            const x =
                point.x *
                scaleX;


            const y =
                point.y *
                scaleY;


            const sensor =
                getSensor(
                    fire
                );


            const color =
                sensorColor(
                    sensor
                );


            const radius =
                7 *
                Math.max(
                    scaleX,
                    scaleY
                );


            /* هاله سفید */

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                radius+4,
                0,
                Math.PI*2
            );

            ctx.fillStyle =
                "rgba(255,255,255,.95)";

            ctx.fill();


            /* نقطه حریق */

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                radius,
                0,
                Math.PI*2
            );

            ctx.fillStyle =
                color;

            ctx.fill();


            ctx.lineWidth =
                2 *
                Math.max(
                    scaleX,
                    scaleY
                );

            ctx.strokeStyle =
                "#6d0000";

            ctx.stroke();

        }
    );


    /* =================================================
       افزودن سربرگ گزارش
    ================================================= */

    const headerHeight =
        Math.max(
            88,
            88*scaleY
        );


    const reportCanvas =
        document.createElement(
            "canvas"
        );


    reportCanvas.width =
        canvas.width;


    reportCanvas.height =
        canvas.height+
        headerHeight;


    const reportCtx =
        reportCanvas.getContext(
            "2d"
        );


    reportCtx.fillStyle =
        "#ffffff";


    reportCtx.fillRect(
        0,
        0,
        reportCanvas.width,
        reportCanvas.height
    );


    reportCtx.fillStyle =
        "#b71c1c";


    reportCtx.fillRect(
        0,
        0,
        reportCanvas.width,
        headerHeight
    );


    reportCtx.drawImage(
        canvas,
        0,
        headerHeight
    );


    reportCtx.direction =
        "rtl";


    reportCtx.textAlign =
        "right";


    reportCtx.fillStyle =
        "#ffffff";


    reportCtx.font =
        "bold 27px Tahoma";


    reportCtx.fillText(
        "سامانه پایش و مدیریت داده‌های حریق",
        reportCanvas.width-25,
        36
    );


    reportCtx.font =
        "15px Tahoma";


    reportCtx.fillText(
        "رخدادهای محدوده: "
        +
        fa(
            fires.length
        )
        +
        " | بازه: "
        +
        (
            state.mode==="24h"
            ?
            "۲۴ ساعت"
            :
            "۵ روز"
        )
        +
        " | فیلتر: "
        +
        getReportFilter(),
        reportCanvas.width-25,
        63
    );


    /* =================================================
       راهنمای رنگ سنجنده
    ================================================= */

    reportCtx.textAlign =
        "left";


    reportCtx.font =
        "13px Tahoma";


    reportCtx.fillStyle =
        "#ffffff";


    reportCtx.fillText(
        "VIIRS",
        25,
        32
    );


    reportCtx.fillText(
        "MODIS",
        25,
        58
    );


    reportCtx.beginPath();

    reportCtx.arc(
        72,
        27,
        6,
        0,
        Math.PI*2
    );

    reportCtx.fillStyle =
        sensorColor(
            "VIIRS"
        );

    reportCtx.fill();


    reportCtx.beginPath();

    reportCtx.arc(
        72,
        53,
        6,
        0,
        Math.PI*2
    );

    reportCtx.fillStyle =
        sensorColor(
            "MODIS"
        );

    reportCtx.fill();


    /* =================================================
       دانلود
    ================================================= */

    const link =
        document.createElement(
            "a"
        );


    link.download =
        "fire_report_"
        +
        new Date()
            .toISOString()
            .slice(0,10)
        +
        ".png";


    link.href =
        reportCanvas.toDataURL(
            "image/png"
        );


    link.click();

}


/* =====================================================
   NIGHT
===================================================== */

function toggleNight(){

    const enabled =
        document.body
            .classList
            .toggle(
                "night"
            );


    if(
        enabled
    ){

        state.map.removeLayer(
            state.lightMap
        );


        state.darkMap.addTo(
            state.map
        );


        $("nightBtn")
            .textContent =
                "☀️";


        localStorage.setItem(
            "fars-night",
            "1"
        );

    }else{

        state.map.removeLayer(
            state.darkMap
        );


        state.lightMap.addTo(
            state.map
        );


        $("nightBtn")
            .textContent =
                "🌙";


        localStorage.setItem(
            "fars-night",
            "0"
        );

    }

}


function restoreNight(){

    if(
        localStorage.getItem(
            "fars-night"
        )==="1"
    ){

        document.body
            .classList
            .add(
                "night"
            );


        state.map.removeLayer(
            state.lightMap
        );


        state.darkMap.addTo(
            state.map
        );


        $("nightBtn")
            .textContent =
                "☀️";

    }

}
